<style>

  .options label { display: flex; align-items: center; padding: 13px 16px; margin-bottom: 10px; border: 2px solid #e2e8f0; border-radius: 10px; cursor: pointer; background: #f8fafc; }

  .scoreBig.fail { color: var(--danger); }
  .sync-status { padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 0.9em; text-align: center; background: #f1f5f9; color: #475569; }
  .sync-status.ok { background: #dcfce7; color: #166534; font-weight: 600; }
  .sync-status.err { background: #fee2e2; color: #991b1b; }
  .reviewItem { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 14px; background: #ffffff; }

  .explanation-box {

    color: #334155;

  .btn-report-float {

    background-color: var(--danger); color: #ffffff; padding: 10px 18px;

    width: 100%; height: 100px; border: 2px solid #cbd5e1; border-radius: 8px;

  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
</style>

<body>

<div class="network-status" id="netStatus">
  <div class="status-dot" id="netDot"></div>
  <span id="netText">Conectado</span>
</div>

<div class="container">
  <div class="hero-banner-wrap">
    <img id="bannerImage" src="" alt="Banner Institucional">
  </div>

  <div class="card" id="startScreen">
    <h2 id="examTitleHeading">Evaluación de Materia</h2>
    <div class="alert-box">⚠️ Se necesita conexión a internet para registrar tu calificación.</div>
    <p id="examDescription" style="color: #475569; font-size: 0.92em; line-height: 1.5;"></p>

    <label for="studentNameInput">Nombre completo del alumno:</label>
    <input type="text" id="studentNameInput" placeholder="Ej. Juan Pérez García" required>

    <label for="studentGroupInput">Grupo:</label>
    <input type="text" id="studentGroupInput" placeholder="Ej. Grupo 101" required>

    <button class="btn-gold" onclick="startExam()">Comenzar Evaluación</button>
  </div>

  <div id="examScreen">
    <div class="exam-header">
      <div>👤 <span id="displayName"></span> | <span id="displayGroup" style="opacity: 0.85;"></span></div>
      <div style="font-size: 0.85em; color: var(--gold-brand); font-weight: 600;" id="headerMateriaTema"></div>
    </div>
    <div class="progressBarWrap"><div id="progressBar"></div></div>
    <div class="card card-standalone" id="questionCard">
      <details class="paletteWrap">
        <summary>🗺️ Ver mapa de preguntas</summary>
        <div id="palette"></div>
      </details>
      <div class="qMeta">
        <span id="metaMateriaTema">Evaluación</span>
        <span id="qCounter" style="white-space: nowrap;"></span>
      </div>
      <div class="qText" id="qText"></div>
      <div id="qImageContainer" class="qImageWrap" style="display:none;"></div>
      <div class="options" id="qOptions"></div>
      <div class="navRow">
        <button class="btn-secondary" id="prevBtn" onclick="goPrev()">◀ Anterior</button>
        <button class="btn-danger" onclick="confirmSubmit()">Finalizar y Entregar</button>
        <button class="btn-secondary" id="nextBtn" onclick="goNext()">Siguiente ▶</button>
      </div>
    </div>
  </div>

  <div class="card card-standalone" id="resultScreen">
    <h2>Resumen de Evaluación</h2>
    <p id="resultDetails" style="color: #475569; font-size: 0.95em;"></p>
    <div class="scoreBig" id="scoreBig"></div>
    <div id="syncStatus" class="sync-status">Guardando resultados en Google Sheets...</div>
    <div style="margin-top:25px;">
      <button class="btn-secondary" onclick="toggleReview()" id="reviewToggleBtn">🔍 Ver revisión detallada y explicaciones</button>
    </div>
    <div id="reviewList" style="margin-top:20px; display:none;"></div>
  </div>
</div>

<!-- Botón y Modal de Reporte de Errores -->
<button class="btn-report-float" onclick="openReportModal()">⚠️ Reportar error</button>

<div class="report-modal" id="reportModal">
  <div class="report-modal-content">
    <h3>⚠️ Reportar error o problema</h3>
    <p style="font-size: 0.88em; color: #475569; margin-bottom: 8px;">Describe el error detectado:</p>
    <textarea id="reportComment" placeholder="Escribe aquí tu observación..."></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeReportModal()">Cancelar</button>
      <button class="btn-danger" id="btnSendReport" onclick="submitReport()">Enviar reporte</button>
    </div>
  </div>
</div>

<script>
// =========================================================
// PANEL DE CONFIGURACIÓN PRINCIPAL
// =========================================================
const EXAM_MATERIA   = "Español";
const EXAM_TEMA      = "3.3.1.3 Jerarquización de ideas, 3.3.1.4 Tipología textual y 3.3.2 Contenido discursivo";
const EXAM_BANNER    = "https://lh3.googleusercontent.com/d/1f8FDPFBkTWv61r_czaycZEPT-Sz5Kgej";
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwlME2gtQ4nJ_BVeB1_FsvaQa1zG8kH8Kph4wmgaNwfB354QKGcd_MDrATEiIs2CQ/exec";

// =========================================================
// BANCO DE PREGUNTAS (20 REACTIVOS CON EXPLICACIÓN)
// =========================================================
const questions = [
  {
    "q": "1. Lee el siguiente fragmento:<br><br><em>«Los humedales son ecosistemas fundamentales para el equilibrio ambiental. Funcionan como hábitat de numerosas especies y contribuyen a regular las inundaciones. Además, pueden retener sedimentos y favorecer la filtración del agua. Por estas razones, su conservación resulta indispensable».</em><br><br>¿Cuál es la idea principal del fragmento?",
    "opts": [
      "Los humedales albergan numerosas especies animales.",
      "Los humedales contribuyen a regular las inundaciones.",
      "La conservación de los humedales es indispensable por sus funciones ambientales.",
      "La filtración del agua depende exclusivamente de los humedales."
    ],
    "correct": 2,
    "img": null,
    "exp": "La idea principal integra el mensaje central del fragmento: los humedales cumplen diversas funciones ambientales que justifican su conservación. Las otras opciones expresan detalles particulares o afirmaciones que el texto no sostiene."
  },
  {
    "q": "2. Lee el siguiente texto:<br><br>I. <em>La resistencia bacteriana a los antibióticos constituye un problema de salud pública.</em><br>II. <em>Este fenómeno ocurre cuando las bacterias desarrollan mecanismos que les permiten sobrevivir a determinados medicamentos.</em><br>III. <em>El uso inadecuado de antibióticos puede favorecer la selección y propagación de bacterias resistentes.</em><br>IV. <em>Por ello, es necesario promover el uso responsable de estos medicamentos y fortalecer las medidas de prevención de infecciones.</em><br><br>¿Cuál es la jerarquización lógica de las ideas?",
    "opts": [
      "I presenta el tema, II explica el fenómeno, III desarrolla un factor relacionado y IV plantea una conclusión.",
      "I presenta una conclusión, II introduce una objeción, III refuta la idea inicial y IV presenta un ejemplo.",
      "I y II son ejemplos secundarios, III es la tesis y IV introduce un tema independiente.",
      "I presenta una causa, II una consecuencia definitiva, III una conclusión y IV una definición."
    ],
    "correct": 0,
    "img": null,
    "exp": "El texto parte de la presentación del problema, explica en qué consiste, incorpora un factor que favorece su propagación y concluye con medidas generales para enfrentarlo."
  },
  {
    "q": "3. Lee el siguiente fragmento:<br><br><em>«Elena abrió la ventana y observó que el cielo se había oscurecido. Guardó rápidamente los documentos que estaban sobre la mesa y llamó a su hermano para que recogiera la ropa tendida».</em><br><br>¿Cuál es la inferencia más razonable sobre la situación?",
    "opts": [
      "Elena esperaba recibir una visita inesperada.",
      "Elena quería cambiar los documentos de lugar definitivamente.",
      "El hermano de Elena había olvidado una cita importante.",
      "Elena anticipó que probablemente llovería y quiso proteger sus pertenencias."
    ],
    "correct": 3,
    "img": null,
    "exp": "El cielo oscurecido y la decisión de guardar los documentos y recoger la ropa permiten inferir que Elena anticipó una posible lluvia. La conclusión se basa en las acciones del personaje y las condiciones ambientales descritas."
  },
  {
    "q": "4. Lee el siguiente fragmento:<br><br><em>«Algunos sostienen que las tareas escolares deben eliminarse porque aumentan la carga de trabajo de los estudiantes. Sin embargo, cuando son breves y están relacionadas con los objetivos de aprendizaje, pueden ayudar a practicar lo estudiado en clase. Por ello, conviene valorar su propósito y cantidad antes de decidir si deben asignarse».</em><br><br>¿Cuál es la estructura argumentativa predominante?",
    "opts": [
      "Presentación de una definición seguida de una clasificación.",
      "Exposición de una postura contraria, presentación de una objeción y narración de sus consecuencias.",
      "Presentación de una postura, consideración de otra perspectiva y formulación de una conclusión matizada.",
      "Descripción de una experiencia personal sin establecer una postura."
    ],
    "correct": 2,
    "img": null,
    "exp": "El fragmento presenta una crítica a las tareas, introduce una consideración favorable bajo determinadas condiciones y concluye que su pertinencia debe evaluarse según su propósito y cantidad."
  },
  {
    "q": "5. ¿Cuál de las siguientes opciones corresponde a un texto predominantemente expositivo?",
    "opts": [
      "«La fotosíntesis es el proceso mediante el cual ciertos organismos transforman la energía luminosa en energía química. En las plantas, este proceso permite producir compuestos orgánicos a partir de sustancias inorgánicas».",
      "«Las escuelas deberían ampliar sus laboratorios porque mejoran las oportunidades de aprendizaje».",
      "«Cuando terminó la tormenta, los habitantes salieron a revisar los daños ocasionados».",
      "«El laboratorio era amplio, luminoso y tenía estantes de metal junto a las ventanas»."
    ],
    "correct": 0,
    "img": null,
    "exp": "La opción A explica un proceso biológico mediante información conceptual. Su finalidad principal es informar y facilitar la comprensión de un fenómeno, no defender una postura, narrar acontecimientos ni describir un espacio."
  },
  {
    "q": "6. Lee el siguiente texto:<br><br><em>«La pérdida de vegetación puede incrementar la erosión del suelo. Cuando desaparecen las raíces que ayudan a mantenerlo estable, el agua de lluvia puede arrastrar partículas con mayor facilidad. Como resultado, el terreno puede perder nutrientes y disminuir su capacidad para sostener ciertos cultivos».</em><br><br>¿Qué organización de las ideas predomina?",
    "opts": [
      "Comparación entre diferentes tipos de vegetación.",
      "Secuencia cronológica de una actividad agrícola.",
      "Enumeración de conceptos sin relación lógica.",
      "Relación de causa y efecto desarrollada en una cadena de consecuencias."
    ],
    "correct": 3,
    "img": null,
    "exp": "El fragmento presenta una secuencia causal: la pérdida de vegetación favorece el arrastre de partículas, lo que puede provocar pérdida de nutrientes y afectar la productividad del suelo."
  },
  {
    "q": "7. Lee el siguiente fragmento:<br><br><em>«Aunque el museo recibió menos visitantes durante las primeras semanas del año, las cifras aumentaron después de que se inauguró una exposición interactiva. Los organizadores señalaron que muchas familias acudieron atraídas por las nuevas actividades».</em><br><br>¿Qué puede inferirse del fragmento?",
    "opts": [
      "El museo cerró definitivamente antes de inaugurar la exposición.",
      "La exposición interactiva pudo contribuir al aumento de visitantes.",
      "Todos los visitantes acudieron exclusivamente por las actividades infantiles.",
      "La exposición eliminó la necesidad de organizar otras actividades culturales."
    ],
    "correct": 1,
    "img": null,
    "exp": "El aumento de visitantes después de inaugurar la exposición y la explicación de los organizadores permiten inferir que las nuevas actividades pudieron contribuir al incremento. No se demuestra que fueran la única causa."
  },
  {
    "q": "8. Lee el siguiente texto:<br><br><em>«La lectura en formato digital facilita el acceso a documentos desde diferentes lugares. No obstante, algunos lectores prefieren los libros impresos porque consideran más cómodo consultar sus páginas y reducir el tiempo frente a las pantallas. La elección depende de factores como los hábitos personales, la disponibilidad de recursos y el tipo de material».</em><br><br>¿Cuál es la interpretación más adecuada de la organización textual?",
    "opts": [
      "El texto sostiene que los libros impresos son superiores en todas las circunstancias.",
      "El texto presenta una secuencia histórica sobre la aparición de los libros.",
      "El texto compara dos formatos, expone ventajas y preferencias y concluye que la elección depende de diversas condiciones.",
      "El texto defiende una tesis sobre la eliminación de los documentos digitales."
    ],
    "correct": 2,
    "img": null,
    "exp": "El fragmento compara las características y preferencias relacionadas con los formatos digital e impreso. La conclusión reconoce que la elección depende de varios factores, sin declarar que un formato sea universalmente superior."
  },
  {
    "q": "9. Lee el siguiente fragmento:<br><br><em>«Elena revisó los resultados de su experimento y descubrió que no coincidían con su hipótesis. En lugar de modificar los datos para que parecieran correctos, registró las diferencias y decidió repetir el procedimiento».</em><br><br>¿Qué rasgo de Elena puede inferirse de su conducta?",
    "opts": [
      "Impaciencia ante los procedimientos científicos.",
      "Desinterés por obtener resultados confiables.",
      "Incapacidad para formular hipótesis.",
      "Honestidad y disposición para comprobar sus resultados."
    ],
    "correct": 3,
    "img": null,
    "exp": "Elena registra los resultados tal como los obtuvo, incluso cuando contradicen su hipótesis, y decide repetir el procedimiento. Estas acciones sugieren honestidad y una actitud orientada a verificar la información."
  },
  {
    "q": "10. Lee el siguiente fragmento:<br><br><em>«El ayuntamiento debe mejorar la infraestructura peatonal. Las banquetas en mal estado dificultan el desplazamiento de muchas personas y pueden aumentar el riesgo de accidentes. Además, las rutas accesibles favorecen la movilidad de quienes utilizan sillas de ruedas o tienen dificultades para caminar. En consecuencia, invertir en banquetas seguras y accesibles debe considerarse una prioridad urbana».</em><br><br>¿Cuál es la tesis y qué función cumplen los argumentos?",
    "opts": [
      "La tesis es mejorar la infraestructura peatonal; los argumentos explican sus beneficios y justifican la propuesta.",
      "La tesis es que todas las banquetas son peligrosas; los argumentos narran la historia del municipio.",
      "La tesis es eliminar el transporte público; los argumentos presentan ejemplos de movilidad.",
      "La tesis es que solo las personas con discapacidad necesitan banquetas; los argumentos contradicen esa afirmación."
    ],
    "correct": 0,
    "img": null,
    "exp": "La tesis aparece en la primera oración y plantea una medida que debe adoptarse. Las razones posteriores describen problemas de seguridad y accesibilidad que respaldan esa postura."
  },
  {
    "q": "11. ¿Cuál es la función de una idea secundaria dentro de un texto?",
    "opts": [
      "Sustituir siempre la idea principal al final del texto.",
      "Introducir información que no guarda relación con el tema.",
      "Explicar, ampliar o ejemplificar la idea principal.",
      "Contradecir obligatoriamente todas las afirmaciones del autor."
    ],
    "correct": 2,
    "img": null,
    "exp": "Las ideas secundarias desarrollan la idea principal mediante datos, ejemplos, explicaciones o razones. Su función es complementar el mensaje central y facilitar su comprensión."

// =========================================================
// LÓGICA DEL SISTEMA (SIN CRONÓMETRO)
// =========================================================
let currentIndex = 0;
let studentName = "";
let studentGroup = "";
let answers = new Array(questions.length).fill(null);
let finished = false;
const letters = ["A", "B", "C", "D"];

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("bannerImage").src = EXAM_BANNER;
  document.title = "Evaluación — " + EXAM_MATERIA;
  document.getElementById("examTitleHeading").textContent = "Examen de " + EXAM_MATERIA + " — Tema 7";
  document.getElementById("examDescription").innerHTML = "Evaluación de la materia de <strong>" + EXAM_MATERIA + "</strong> (Tema: <em>" + EXAM_TEMA + "</em>). Consta de <strong>" + questions.length + " reactivos</strong>. Al finalizar, tu calificación se registrará directamente en el sistema.";
  document.getElementById("metaMateriaTema").textContent = EXAM_MATERIA + " · Tema 7";
  document.getElementById("headerMateriaTema").textContent = EXAM_MATERIA;
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('cut', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('selectstart', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) || (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))) { e.preventDefault(); return false; }
});
window.addEventListener('beforeunload', function (e) {
  if (!finished && document.getElementById('examScreen').style.display === 'block') {
    e.preventDefault(); e.returnValue = '¿Seguro que quieres salir del examen?'; return e.returnValue;
  }
});

function updateOnlineStatus() {
  const dot = document.getElementById('netDot');
  const text = document.getElementById('netText');
  if (navigator.onLine) { dot.className = 'status-dot'; text.textContent = 'Conectado'; } 
  else { dot.className = 'status-dot offline'; text.textContent = 'Sin conexión'; }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

function startExam() {
  const nameInput = document.getElementById('studentNameInput');
  const groupInput = document.getElementById('studentGroupInput');
  if (!nameInput.value.trim() || !groupInput.value.trim()) {
    alert("Por favor completa tu Nombre y Grupo antes de iniciar.");
    return;
  }
  studentName = nameInput.value.trim();
  studentGroup = groupInput.value.trim();

  document.getElementById('displayName').textContent = studentName;
  document.getElementById('displayGroup').textContent = studentGroup;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('examScreen').style.display = 'block';

  buildPalette();
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('qCounter').textContent = "Reactivo " + (currentIndex + 1) + " de " + questions.length;
  document.getElementById('qText').innerHTML = q.q;

  const imgContainer = document.getElementById('qImageContainer');
  if (q.img) {
    imgContainer.innerHTML = '<img src="' + q.img + '" alt="Figura del reactivo">';
    imgContainer.style.display = 'block';
  } else {
    imgContainer.innerHTML = '';
    imgContainer.style.display = 'none';
  }

  const optWrap = document.getElementById('qOptions');
  optWrap.innerHTML = '';
  q.opts.forEach((optText, i) => {
    const label = document.createElement('label');
    label.className = answers[currentIndex] === i ? 'selected' : '';
    label.innerHTML = '<input type="radio" name="opt" value="' + i + '" ' + (answers[currentIndex] === i ? 'checked' : '') + '><span><strong>' + letters[i] + ')</strong> ' + optText + '</span>';
    label.onclick = () => selectAnswer(i);
    optWrap.appendChild(label);
  });

  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === questions.length - 1 ? 'Último reactivo' : 'Siguiente ▶';
  document.getElementById('progressBar').style.width = Math.round((answers.filter(a => a !== null).length / questions.length) * 100) + '%';
  refreshPalette();
  
  if (window.MathJax) { MathJax.typesetPromise([document.getElementById('questionCard')]).catch((err) => console.log(err.message)); }
}

function selectAnswer(i) { answers[currentIndex] = i; renderQuestion(); }
function goNext() { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
function goPrev() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

function buildPalette() {
  const palette = document.getElementById('palette');
  palette.innerHTML = '';
  questions.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.textContent = i + 1;
    btn.onclick = () => { currentIndex = i; renderQuestion(); };
    btn.id = 'pal-' + i;
    palette.appendChild(btn);
  });
}

function refreshPalette() {
  questions.forEach((_, i) => {
    const btn = document.getElementById('pal-' + i);
    if(btn) {
      btn.classList.toggle('answered', answers[i] !== null);
      btn.classList.toggle('current', i === currentIndex);
    }
  });
}

function confirmSubmit() {
  const unanswered = answers.filter(a => a === null).length;
  if (confirm(unanswered > 0 ? "Tienes " + unanswered + " sin responder. ¿Finalizar?" : "¿Estás seguro de enviar tu evaluación?")) {
    finishExam();
  }
}

function finishExam() {
  if (finished) return;
  finished = true;

  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  let totalCorrect = 0;
  const reviewData = [];

  questions.forEach((q, i) => { 
    const userAns = answers[i];
    const isCorrect = userAns === q.correct;
    if (isCorrect) totalCorrect++; 
    reviewData.push({
      num: i + 1,
      text: q.q,
      opts: q.opts,
      correctIdx: q.correct,
      userIdx: userAns,
      isCorrect: isCorrect,
      exp: q.exp || ""
    });
  });
  
  const pct = ((totalCorrect / questions.length) * 100).toFixed(1);

  document.getElementById('resultDetails').innerHTML = "<strong>Materia:</strong> " + EXAM_MATERIA + "<br><strong>Tema:</strong> " + EXAM_TEMA + "<br><strong>Alumno:</strong> " + studentName + " | <strong>Grupo:</strong> " + studentGroup;
  document.getElementById('scoreBig').textContent = totalCorrect + "/" + questions.length + " (" + pct + "%)";
  document.getElementById('scoreBig').classList.toggle('fail', pct < 60);

  window._reviewData = reviewData;
  renderReview();

  sendDataToGoogleSheets({
    fecha: new Date().toLocaleDateString(),
    materia: EXAM_MATERIA,
    tema: EXAM_TEMA,
    nombre: studentName,
    grupo: studentGroup,
    puntajeGeneral: totalCorrect + "/" + questions.length + " (" + pct + "%)"
  });
}

function renderReview() {
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  window._reviewData.forEach(r => {
    const div = document.createElement('div');
    let cls = r.userIdx === null ? 'blank' : (r.isCorrect ? 'correct' : 'incorrect');
    div.className = 'reviewItem ' + cls;

    const correctText = '<strong>' + letters[r.correctIdx] + ')</strong> ' + r.opts[r.correctIdx];
    const userText = r.userIdx !== null ? '<strong>' + letters[r.userIdx] + ')</strong> ' + r.opts[r.userIdx] : '';

    let answerLine = '';
    if (r.userIdx === null) {
      answerLine = '<div class="yourAns">No respondida. Respuesta correcta: <span class="correctAns">' + correctText + '</span></div>';
    } else if (r.isCorrect) {
      answerLine = '<div class="yourAns">Tu respuesta: <span class="correctAns">' + userText + '</span> ✔</div>';
    } else {
      answerLine = '<div class="yourAns">Tu respuesta: <span class="wrongAns">' + userText + '</span> ✘ <br><span style="display:inline-block; margin-top:4px;">Respuesta correcta: <span class="correctAns">' + correctText + '</span></span></div>';
    }

    const expHtml = r.exp ? '<div class="explanation-box"><strong>💡 Explicación:</strong> ' + r.exp + '</div>' : '';

    div.innerHTML = '<div class="tag">Reactivo ' + r.num + '</div><div style="font-weight:600; margin-top:4px;">' + r.text + '</div>' + answerLine + expHtml;
    list.appendChild(div);
  });
  if (window.MathJax) { MathJax.typesetPromise([list]).catch((err) => console.log(err.message)); }
}

function toggleReview() {
  const list = document.getElementById('reviewList');
  const btn = document.getElementById('reviewToggleBtn');
  const show = list.style.display === 'none';
  list.style.display = show ? 'block' : 'none';
  btn.textContent = show ? 'Ocultar revisión detallada' : '🔍 Ver revisión detallada y explicaciones';
}

function sendDataToGoogleSheets(payload) {
  const syncEl = document.getElementById('syncStatus');
  syncEl.textContent = "Sincronizando con Google Sheets...";

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    syncEl.className = "sync-status ok";
    syncEl.textContent = "Calificación enviada con éxito";
  })
  .catch(err => {
    syncEl.className = "sync-status err";
    syncEl.textContent = "⚠️ Error al registrar: " + err.message;
  });
}

function openReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }

function submitReport() {
  const comment = document.getElementById('reportComment').value.trim();
  if (!comment) { alert("Escribe tu observación antes de enviar."); return; }
  
  const sendBtn = document.getElementById('btnSendReport');
  sendBtn.disabled = true;
  sendBtn.textContent = "Enviando...";

  const payload = {
    tipo: "reporte_error",
    fecha: new Date().toLocaleDateString(),
    examen: EXAM_MATERIA + " — " + EXAM_TEMA,
    nombre: studentName || "Anónimo",
    grupo: studentGroup || "Sin grupo",
    ubicacion: "Reactivo " + (currentIndex + 1),
    comentario: comment
  };

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    alert("✅ Reporte enviado con éxito.");
    closeReportModal();
  })
  .catch(err => {
    alert("⚠️ Error: " + err.message);
  })
  .finally(() => {
    sendBtn.disabled = false;
    sendBtn.textContent = "Enviar reporte";
  });
}
</script>
