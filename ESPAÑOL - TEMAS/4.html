<style>

  .btn-report-float {

    width: 100%; height: 100px; border: 2px solid #cbd5e1; border-radius: 8px;

  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
</style>

<div class="network-status" id="netStatus">
  <div class="status-dot" id="netDot"></div>

</div>

<div class="container">
  <div class="hero-banner-wrap">
    <img id="bannerImage" src="" alt="Banner Institucional">
  </div>

  <div class="card" id="startScreen">
    <h2 id="examTitleHeading">Evaluación de Materia</h2>
    <div class="alert-box">⚠️ Se necesita conexión a internet para registrar tu calificación.</div>
    <p id="examDescription" style="color: #475569; font-size: 0.92em; line-height: 1.5;"></p>

    <input type="text" id="studentNameInput" placeholder="Ej. Juan Pérez García" required>

    <label for="studentGroupInput">Grupo:</label>
    <input type="text" id="studentGroupInput" placeholder="Ej. Grupo 101" required>

    <button class="btn-gold" onclick="startExam()">Comenzar Evaluación</button>
  </div>

  <div id="examScreen">
    <div class="exam-header">
      <div>👤 <span id="displayName"></span> | <span id="displayGroup" style="opacity: 0.85;"></span></div>
      <div style="font-size: 0.85em; color: var(--gold-brand); font-weight: 600;" id="headerMateriaTema"></div>
    </div>
    <div class="progressBarWrap"><div id="progressBar"></div></div>
    <div class="card card-standalone" id="questionCard">
      <details class="paletteWrap">
        <summary>🗺️ Ver mapa de preguntas</summary>
        <div id="palette"></div>
      </details>
      <div class="qMeta">
        <span id="metaMateriaTema">Evaluación</span>
        <span id="qCounter" style="white-space: nowrap;"></span>
      </div>
      <div class="qText" id="qText"></div>
      <div id="qImageContainer" class="qImageWrap" style="display:none;"></div>

      <div class="navRow">
        <button class="btn-secondary" id="prevBtn" onclick="goPrev()">◀ Anterior</button>
        <button class="btn-danger" onclick="confirmSubmit()">Finalizar y Entregar</button>
        <button class="btn-secondary" id="nextBtn" onclick="goNext()">Siguiente ▶</button>
      </div>
    </div>
  </div>

  <div class="card card-standalone" id="resultScreen">
    <h2>Resumen de Evaluación</h2>
    <p id="resultDetails" style="color: #475569; font-size: 0.95em;"></p>
    <div class="scoreBig" id="scoreBig"></div>
    <div id="syncStatus" class="sync-status">Guardando resultados en Google Sheets...</div>
    <div style="margin-top:25px;">
      <button class="btn-secondary" onclick="toggleReview()" id="reviewToggleBtn">🔍 Ver revisión detallada y explicaciones</button>
    </div>
    <div id="reviewList" style="margin-top:20px; display:none;"></div>
  </div>
</div>

<!-- Botón y Modal de Reporte de Errores -->
<button class="btn-report-float" onclick="openReportModal()">⚠️ Reportar error</button>

<div class="report-modal" id="reportModal">
  <div class="report-modal-content">
    <h3>⚠️ Reportar error o problema</h3>
    <p style="font-size: 0.88em; color: #475569; margin-bottom: 8px;">Describe el error detectado:</p>
    <textarea id="reportComment" placeholder="Escribe aquí tu observación..."></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeReportModal()">Cancelar</button>
      <button class="btn-danger" id="btnSendReport" onclick="submitReport()">Enviar reporte</button>
    </div>
  </div>
</div>

<script>
// =========================================================
// PANEL DE CONFIGURACIÓN PRINCIPAL
// =========================================================
const EXAM_MATERIA   = "Español";
const EXAM_TEMA      = "3.1 Estructura del texto; 3.1.1 Ideas principales y secundarias; 3.1.2 Frases clave; 3.1.3 Jerarquización de ideas; 3.1.4 Organización textual";
const EXAM_BANNER    = "https://lh3.googleusercontent.com/d/1f8FDPFBkTWv61r_czaycZEPT-Sz5Kgej";
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwlME2gtQ4nJ_BVeB1_FsvaQa1zG8kH8Kph4wmgaNwfB354QKGcd_MDrATEiIs2CQ/exec";

// =========================================================
// BANCO DE PREGUNTAS (30 REACTIVOS CON EXPLICACIÓN)
// =========================================================
const questions = [
  {
    "q": "1. Lee el siguiente texto:<br><br><em>«Los humedales desempeñan un papel fundamental en el equilibrio ambiental. Funcionan como refugio para numerosas especies, contribuyen a regular las inundaciones y ayudan a filtrar contaminantes del agua. Sin embargo, la expansión urbana y las actividades agrícolas han provocado la desaparición de muchos de estos ecosistemas».</em><br><br>¿Cuál es la idea principal del texto?",
    "opts": [
      "Las actividades agrícolas son la única causa de la desaparición de los humedales.",
      "Los humedales cumplen funciones ambientales importantes, pero enfrentan amenazas que ponen en riesgo su conservación.",
      "Todas las especies animales dependen exclusivamente de los humedales.",
      "La expansión urbana siempre provoca inundaciones en las ciudades."
    ],
    "correct": 1,
    "img": null,
    "exp": "La idea principal integra el valor ambiental de los humedales y las amenazas que enfrentan. Las demás opciones presentan afirmaciones demasiado específicas o que no están sustentadas por el texto."
  },
  {
    "q": "2. Lee el siguiente fragmento:<br><br><em>«La lectura frecuente favorece el desarrollo del vocabulario y mejora la comprensión de textos complejos. Además, permite reconocer distintas estructuras argumentativas y fortalece la capacidad para interpretar información. Por estas razones, incorporar la lectura cotidiana en la formación académica contribuye al aprendizaje».</em><br><br>¿Cuál opción representa mejor la estructura lógica del fragmento?",
    "opts": [
      "Presentación de un problema, descripción de sus causas y propuesta de solución.",
      "Exposición de una secuencia temporal y narración de sus consecuencias.",
      "Comparación de dos posturas y refutación de una de ellas.",
      "Presentación de una afirmación general, exposición de razones que la respaldan y conclusión."
    ],
    "correct": 3,
    "img": null,
    "exp": "El fragmento plantea los beneficios de la lectura, desarrolla razones que los explican y termina con una conclusión sobre su contribución al aprendizaje."
  },
  {
    "q": "3. Lee el siguiente texto:<br><br><em>«Las abejas participan en la polinización de numerosas plantas. Este proceso permite la reproducción de muchas especies vegetales y contribuye a la producción de diversos alimentos. Por ello, proteger a los polinizadores es importante para mantener el equilibrio de los ecosistemas».</em><br><br>¿Cuál enunciado presenta una razón que sustenta la importancia de proteger a los polinizadores?",
    "opts": [
      "Las abejas participan en la polinización de numerosas plantas.",
      "La protección de los polinizadores es importante para mantener el equilibrio de los ecosistemas.",
      "La polinización favorece la reproducción de especies vegetales y contribuye a la producción de alimentos.",
      "Las abejas son los únicos organismos capaces de realizar la polinización."
    ],
    "correct": 2,
    "img": null,
    "exp": "El texto señala que proteger a los polinizadores contribuye al equilibrio de los ecosistemas. La opción C presenta una razón concreta que sustenta esa importancia: la polinización favorece la reproducción vegetal y la producción de alimentos. La opción A menciona una característica de las abejas, mientras que B repite la importancia de su protección sin explicar por qué y D introduce una afirmación que el texto no sostiene."
  },
  {
    "q": "4. Lee el siguiente texto:<br><br><em>«El uso de paneles solares ha aumentado debido a la búsqueda de fuentes de energía alternativas. Estos dispositivos transforman la radiación solar en electricidad mediante celdas fotovoltaicas. Su instalación puede disminuir la dependencia de combustibles fósiles, aunque su rendimiento depende de factores como la radiación disponible, la orientación y las condiciones de mantenimiento».</em><br><br>¿Cuál es la relación entre la segunda y la tercera oración?",
    "opts": [
      "La segunda explica el funcionamiento de los paneles; la tercera expone un beneficio potencial y las condiciones que influyen en su rendimiento.",
      "La segunda presenta una conclusión y la tercera narra un acontecimiento histórico.",
      "La segunda refuta la primera y la tercera introduce un tema sin relación.",
      "La segunda y la tercera expresan exclusivamente opiniones personales."
    ],
    "correct": 0,
    "img": null,
    "exp": "La segunda oración ofrece información explicativa sobre el funcionamiento de los paneles solares. La tercera amplía el tema al mencionar un beneficio y precisar las condiciones de las que depende su rendimiento."
  },
  {
    "q": "5. ¿Cuál opción contiene una frase clave que resume adecuadamente el siguiente párrafo?<br><br><em>«La actividad física regular fortalece los músculos, favorece la salud cardiovascular y contribuye al bienestar emocional. Sus beneficios pueden obtenerse mediante actividades adaptadas a las condiciones y capacidades de cada persona».</em>",
    "opts": [
      "Los músculos necesitan ejercicio.",
      "La actividad física tiene beneficios para la salud física y emocional.",
      "Todas las personas deben practicar el mismo deporte.",
      "El bienestar emocional depende exclusivamente del ejercicio."
    ],
    "correct": 1,
    "img": null,
    "exp": "Una frase clave sintetiza la información esencial del párrafo sin introducir afirmaciones ajenas ni reducir el contenido a un solo detalle."
  },
  {
    "q": "6. Lee el siguiente texto:<br><br><em>«El suelo fértil es indispensable para la producción agrícola. Su calidad depende de factores físicos, químicos y biológicos. Entre ellos se encuentran la disponibilidad de nutrientes, la estructura del suelo y la actividad de los microorganismos. Cuando estos componentes se deterioran, disminuye la capacidad del suelo para sostener el crecimiento de los cultivos».</em><br><br>¿Cuál es la jerarquización correcta de las ideas?",
    "opts": [
      "Idea principal: los microorganismos; ideas secundarias: los cultivos y la producción agrícola.",
      "Idea principal: la disminución de los cultivos; ideas secundarias: todos los factores físicos, químicos y biológicos son irrelevantes.",
      "Idea principal: los nutrientes; ideas secundarias: el suelo fértil depende exclusivamente de ellos.",
      "Idea principal: la importancia de la calidad del suelo para la agricultura; ideas secundarias: los factores que la determinan y los efectos de su deterioro."
    ],
    "correct": 3,
    "img": null,
    "exp": "La idea principal organiza el contenido general del texto. Los factores físicos, químicos y biológicos, así como las consecuencias del deterioro, aportan explicaciones subordinadas a esa idea."
  },
  {
    "q": "7. ¿Cuál es la función principal de una idea secundaria dentro de un texto expositivo?",
    "opts": [
      "Sustituir la idea principal por un tema diferente.",
      "Contradecir necesariamente la postura del autor.",
      "Ampliar, explicar, ejemplificar o justificar la idea principal.",
      "Cerrar siempre el texto con una conclusión definitiva."
    ],
    "correct": 2,
    "img": null,
    "exp": "Las ideas secundarias desarrollan la información central mediante detalles, explicaciones, ejemplos o argumentos que facilitan su comprensión."
  },
  {
    "q": "8. Lee el fragmento:<br><br><em>«La educación financiera permite comprender conceptos como ahorro, crédito e inversión. Por ejemplo, una persona que compara las tasas de interés antes de solicitar un préstamo puede identificar cuál alternativa implica un menor costo. Asimismo, elaborar un presupuesto ayuda a organizar los ingresos y los gastos».</em><br><br>¿Qué función cumple la segunda oración respecto de la primera?",
    "opts": [
      "Introduce un ejemplo concreto que desarrolla la idea general.",
      "Presenta una objeción que invalida la educación financiera.",
      "Establece una relación cronológica entre dos acontecimientos históricos.",
      "Formula una conclusión contraria a la afirmación inicial."
    ],
    "correct": 0,
    "img": null,
    "exp": "La expresión «por ejemplo» introduce un caso concreto que ilustra cómo la educación financiera permite tomar decisiones informadas."
  },
  {
    "q": "9. Lee las siguientes oraciones:<br>I. Por esta razón, es necesario separar los residuos desde su origen.<br>II. La clasificación de los residuos facilita su reciclaje y tratamiento.<br>III. Muchos materiales desechados pueden recuperarse y aprovecharse nuevamente.<br>IV. Esta práctica contribuye a reducir la cantidad de basura enviada a los rellenos sanitarios.<br><br>¿Cuál orden produce un párrafo coherente?",
    "opts": [
      "I, IV, II, III.",
      "III, I, IV, II.",
      "II, IV, I, III.",
      "III, II, I, IV."
    ],
    "correct": 3,
    "img": null,
    "exp": "Primero se introduce el hecho de que numerosos materiales pueden recuperarse; después se explica el beneficio de clasificarlos, se formula la recomendación y se presenta su consecuencia. El orden D conserva una secuencia lógica de información y conclusión."
  },
  {
    "q": "10. Un texto argumentativo presenta la siguiente estructura:<br>• Tesis: las escuelas deberían incorporar más actividades de educación ambiental.<br>• Argumento: estas actividades ayudan a desarrollar hábitos responsables en el manejo de residuos.<br>• Evidencia: en una escuela que implementó un programa de separación, aumentó la cantidad de materiales recuperados.<br>• Conclusión: la educación ambiental merece integrarse de manera sistemática en la formación escolar.<br><br>¿Qué elemento cumple la función de respaldar el argumento con información concreta?",
    "opts": [
      "La tesis.",
      "La evidencia.",
      "La conclusión.",
      "El tema general."
    ],
    "correct": 1,
    "img": null,
    "exp": "La evidencia aporta datos u observaciones que permiten sustentar un argumento. La tesis expresa la postura, mientras que la conclusión retoma o deriva de los razonamientos desarrollados."
  },
  {
    "q": "11. ¿Cuál conector expresa una relación de causa y consecuencia?",
    "opts": [
      "Sin embargo.",
      "Por el contrario.",
      "Por consiguiente.",
      "En cambio."
    ],
    "correct": 2,
    "img": null,
    "exp": "«Por consiguiente» introduce una consecuencia o resultado derivado de lo expresado anteriormente. Los otros conectores se utilizan principalmente para señalar contraste u oposición."

let currentIndex = 0;
let studentName = "";
let studentGroup = "";
let answers = new Array(questions.length).fill(null);
let finished = false;
const letters = ["A", "B", "C", "D"];

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("bannerImage").src = EXAM_BANNER;
  document.title = "Evaluación — " + EXAM_MATERIA;
  document.getElementById("examTitleHeading").textContent = "Examen de " + EXAM_MATERIA + " — Tema 4";
  document.getElementById("examDescription").innerHTML = "Evaluación de la materia de <strong>" + EXAM_MATERIA + "</strong> (Tema: <em>" + EXAM_TEMA + "</em>). Consta de <strong>" + questions.length + " reactivos</strong>. Al finalizar, tu calificación se registrará directamente en el sistema.";
  document.getElementById("metaMateriaTema").textContent = EXAM_MATERIA + " · Tema 4";
  document.getElementById("headerMateriaTema").textContent = EXAM_MATERIA;
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('cut', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('selectstart', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) || (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))) { e.preventDefault(); return false; }
});
window.addEventListener('beforeunload', function (e) {
  if (!finished && document.getElementById('examScreen').style.display === 'block') {
    e.preventDefault(); e.returnValue = '¿Seguro que quieres salir del examen?'; return e.returnValue;
  }
});

function updateOnlineStatus() {
  const dot = document.getElementById('netDot');
  const text = document.getElementById('netText');
  if (navigator.onLine) { dot.className = 'status-dot'; text.textContent = 'Conectado'; } 
  else { dot.className = 'status-dot offline'; text.textContent = 'Sin conexión'; }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

function startExam() {
  const nameInput = document.getElementById('studentNameInput');
  const groupInput = document.getElementById('studentGroupInput');
  if (!nameInput.value.trim() || !groupInput.value.trim()) {
    alert("Por favor completa tu Nombre y Grupo antes de iniciar.");
    return;
  }
  studentName = nameInput.value.trim();
  studentGroup = groupInput.value.trim();

  document.getElementById('displayName').textContent = studentName;
  document.getElementById('displayGroup').textContent = studentGroup;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('examScreen').style.display = 'block';

  buildPalette();
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('qCounter').textContent = "Reactivo " + (currentIndex + 1) + " de " + questions.length;
  document.getElementById('qText').innerHTML = q.q;

  const imgContainer = document.getElementById('qImageContainer');
  if (q.img) {
    imgContainer.innerHTML = '<img src="' + q.img + '" alt="Figura del reactivo">';
    imgContainer.style.display = 'block';
  } else {
    imgContainer.innerHTML = '';
    imgContainer.style.display = 'none';
  }

  const optWrap = document.getElementById('qOptions');
  optWrap.innerHTML = '';
  q.opts.forEach((optText, i) => {
    const label = document.createElement('label');
    label.className = answers[currentIndex] === i ? 'selected' : '';
    label.innerHTML = '<input type="radio" name="opt" value="' + i + '" ' + (answers[currentIndex] === i ? 'checked' : '') + '><span><strong>' + letters[i] + ')</strong> ' + optText + '</span>';
    label.onclick = () => selectAnswer(i);
    optWrap.appendChild(label);
  });

  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === questions.length - 1 ? 'Último reactivo' : 'Siguiente ▶';
  document.getElementById('progressBar').style.width = Math.round((answers.filter(a => a !== null).length / questions.length) * 100) + '%';
  refreshPalette();
  
  if (window.MathJax) { MathJax.typesetPromise([document.getElementById('questionCard')]).catch((err) => console.log(err.message)); }
}

function selectAnswer(i) { answers[currentIndex] = i; renderQuestion(); }
function goNext() { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
function goPrev() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

function buildPalette() {
  const palette = document.getElementById('palette');
  palette.innerHTML = '';
  questions.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.textContent = i + 1;
    btn.onclick = () => { currentIndex = i; renderQuestion(); };
    btn.id = 'pal-' + i;
    palette.appendChild(btn);
  });
}

function refreshPalette() {
  questions.forEach((_, i) => {
    const btn = document.getElementById('pal-' + i);
    if(btn) {
      btn.classList.toggle('answered', answers[i] !== null);
      btn.classList.toggle('current', i === currentIndex);
    }
  });
}

function confirmSubmit() {
  const unanswered = answers.filter(a => a === null).length;
  if (confirm(unanswered > 0 ? "Tienes " + unanswered + " sin responder. ¿Finalizar?" : "¿Estás seguro de enviar tu evaluación?")) {
    finishExam();
  }
}

function finishExam() {
  if (finished) return;
  finished = true;

  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  let totalCorrect = 0;
  const reviewData = [];

  questions.forEach((q, i) => { 
    const userAns = answers[i];
    const isCorrect = userAns === q.correct;
    if (isCorrect) totalCorrect++; 
    reviewData.push({
      num: i + 1,
      text: q.q,
      opts: q.opts,
      correctIdx: q.correct,
      userIdx: userAns,
      isCorrect: isCorrect,
      exp: q.exp || ""
    });
  });
  
  const pct = ((totalCorrect / questions.length) * 100).toFixed(1);

  document.getElementById('resultDetails').innerHTML = "<strong>Materia:</strong> " + EXAM_MATERIA + "<br><strong>Tema:</strong> " + EXAM_TEMA + "<br><strong>Alumno:</strong> " + studentName + " | <strong>Grupo:</strong> " + studentGroup;
  document.getElementById('scoreBig').textContent = totalCorrect + "/" + questions.length + " (" + pct + "%)";
  document.getElementById('scoreBig').classList.toggle('fail', pct < 60);

  window._reviewData = reviewData;
  renderReview();

  sendDataToGoogleSheets({
    fecha: new Date().toLocaleDateString(),
    materia: EXAM_MATERIA,
    tema: EXAM_TEMA,
    nombre: studentName,
    grupo: studentGroup,
    puntajeGeneral: totalCorrect + "/" + questions.length + " (" + pct + "%)"
  });
}

function renderReview() {
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  window._reviewData.forEach(r => {
    const div = document.createElement('div');
    let cls = r.userIdx === null ? 'blank' : (r.isCorrect ? 'correct' : 'incorrect');
    div.className = 'reviewItem ' + cls;

    const correctText = '<strong>' + letters[r.correctIdx] + ')</strong> ' + r.opts[r.correctIdx];
    const userText = r.userIdx !== null ? '<strong>' + letters[r.userIdx] + ')</strong> ' + r.opts[r.userIdx] : '';

    let answerLine = '';
    if (r.userIdx === null) {
      answerLine = '<div class="yourAns">No respondida. Respuesta correcta: <span class="correctAns">' + correctText + '</span></div>';
    } else if (r.isCorrect) {
      answerLine = '<div class="yourAns">Tu respuesta: <span class="correctAns">' + userText + '</span> ✔</div>';
    } else {
      answerLine = '<div class="yourAns">Tu respuesta: <span class="wrongAns">' + userText + '</span> ✘ <br><span style="display:inline-block; margin-top:4px;">Respuesta correcta: <span class="correctAns">' + correctText + '</span></span></div>';
    }

    const expHtml = r.exp ? '<div class="explanation-box"><strong>💡 Explicación:</strong> ' + r.exp + '</div>' : '';

    div.innerHTML = '<div class="tag">Reactivo ' + r.num + '</div><div style="font-weight:600; margin-top:4px;">' + r.text + '</div>' + answerLine + expHtml;
    list.appendChild(div);
  });
  if (window.MathJax) { MathJax.typesetPromise([list]).catch((err) => console.log(err.message)); }
}

function toggleReview() {
  const list = document.getElementById('reviewList');
  const btn = document.getElementById('reviewToggleBtn');
  const show = list.style.display === 'none';
  list.style.display = show ? 'block' : 'none';
  btn.textContent = show ? 'Ocultar revisión detallada' : '🔍 Ver revisión detallada y explicaciones';
}

function sendDataToGoogleSheets(payload) {
  const syncEl = document.getElementById('syncStatus');
  syncEl.textContent = "Sincronizando con Google Sheets...";

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    syncEl.className = "sync-status ok";
    syncEl.textContent = "Calificación enviada con éxito";
  })
  .catch(err => {
    syncEl.className = "sync-status err";
    syncEl.textContent = "⚠️ Error al registrar: " + err.message;
  });
}

function openReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }

function submitReport() {
  const comment = document.getElementById('reportComment').value.trim();
  if (!comment) { alert("Escribe tu observación antes de enviar."); return; }
  
  const sendBtn = document.getElementById('btnSendReport');
  sendBtn.disabled = true;
  sendBtn.textContent = "Enviando...";

  const payload = {
    tipo: "reporte_error",
    fecha: new Date().toLocaleDateString(),
    examen: EXAM_MATERIA + " — " + EXAM_TEMA,
    nombre: studentName || "Anónimo",
    grupo: studentGroup || "Sin grupo",
    ubicacion: "Reactivo " + (currentIndex + 1),
    comentario: comment
  };

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    alert("✅ Reporte enviado con éxito.");
    closeReportModal();
  })
  .catch(err => {
    alert("⚠️ Error: " + err.message);
  })
  .finally(() => {
    sendBtn.disabled = false;
    sendBtn.textContent = "Enviar reporte";
  });
}
</script>
</body>
