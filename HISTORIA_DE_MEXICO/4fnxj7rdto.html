<style>

  .btn-gold { background-color: #C89200; color: #ffffff; width: 100%; font-size: 1.1em; padding: 14px; margin-top: 20px; }

  .progressBarWrap { background: var(--navy-light); border-radius: 999px; height: 8px; overflow: hidden; margin-bottom: 18px; }

  .navRow { display: flex; justify-content: space-between; margin-top: 25px; gap: 10px; flex-wrap: wrap; }

  .scoreBig.fail { color: var(--danger); }
  .sync-status { padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 0.9em; text-align: center; background: #f1f5f9; color: #475569; }
  .sync-status.ok { background: #dcfce7; color: #166534; font-weight: 600; }
  .sync-status.err { background: #fee2e2; color: #991b1b; }
  .reviewItem { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 14px; background: #ffffff; }
  .reviewItem.correct { border-left: 6px solid var(--success); }
  .reviewItem.incorrect { border-left: 6px solid var(--danger); }

  .explanation-box {
    margin-top: 10px;
    padding: 10px 14px;
    background: #f8fafc;
    border-left: 3px solid var(--gold-brand);
    border-radius: 4px;
    font-size: 0.88em;
    color: #334155;
    line-height: 1.5;
  }
  
  .btn-report-float {
    position: fixed; bottom: 20px; right: 20px; z-index: 1000;
    background-color: var(--danger); color: #ffffff; padding: 10px 18px;
    border-radius: 999px; font-size: 0.88em; font-weight: 600;

    align-items: center; gap: 6px; border: none; cursor: pointer;

  .report-modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;

  }
  .report-modal-content textarea {
    width: 100%; height: 100px; border: 2px solid #cbd5e1; border-radius: 8px;
    padding: 10px; font-family: inherit; font-size: 0.9em; margin: 10px 0 15px; resize: none; outline: none;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

<div class="network-status" id="netStatus">
  <div class="status-dot" id="netDot"></div>
  <span id="netText">Conectado</span>
</div>

<div class="container">
  <div class="hero-banner-wrap">
    <img id="bannerImage" src="" alt="Banner Institucional">
  </div>

  <div class="card" id="startScreen">
    <h2 id="examTitleHeading">Evaluación de Materia</h2>
    <div class="alert-box">⚠️ Se necesita conexión a internet para registrar tu calificación.</div>
    <p id="examDescription" style="color: #475569; font-size: 0.92em; line-height: 1.5;"></p>

    <label for="studentNameInput">Nombre completo del alumno:</label>
    <input type="text" id="studentNameInput" placeholder="Ej. Juan Pérez García" required>

    <label for="studentGroupInput">Grupo:</label>
    <input type="text" id="studentGroupInput" placeholder="Ej. Grupo 101" required>

    <button class="btn-gold" onclick="startExam()">Comenzar Evaluación</button>
  </div>

  <div id="examScreen">
    <div class="exam-header">
      <div>👤 <span id="displayName"></span> | <span id="displayGroup" style="opacity: 0.85;"></span></div>
      <div style="font-size: 0.85em; color: var(--gold-brand); font-weight: 600;" id="headerMateriaTema"></div>
    </div>

    <div class="progressBarWrap"><div id="progressBar"></div></div>
    <div class="card card-standalone" id="questionCard">
      <details class="paletteWrap">
        <summary>🗺️ Ver mapa de preguntas</summary>
        <div id="palette"></div>
      </details>
      <div class="qMeta">
        <span id="metaMateriaTema">Evaluación</span>
        <span id="qCounter" style="white-space: nowrap;"></span>
      </div>
      <div class="qText" id="qText"></div>
      <div id="qImageContainer" class="qImageWrap" style="display:none;"></div>
      <div class="options" id="qOptions"></div>
      <div class="navRow">
        <button class="btn-secondary" id="prevBtn" onclick="goPrev()">◀ Anterior</button>
        <button class="btn-danger" onclick="confirmSubmit()">Finalizar y Entregar</button>
        <button class="btn-secondary" id="nextBtn" onclick="goNext()">Siguiente ▶</button>
      </div>
    </div>
  </div>

  <div class="card card-standalone" id="resultScreen">
    <h2>Resumen de Evaluación</h2>
    <p id="resultDetails" style="color: #475569; font-size: 0.95em;"></p>
    <div class="scoreBig" id="scoreBig"></div>
    <div id="syncStatus" class="sync-status">Guardando resultados en Google Sheets...</div>
    <div style="margin-top:25px;">
      <button class="btn-secondary" onclick="toggleReview()" id="reviewToggleBtn">🔍 Ver revisión detallada y explicaciones</button>
    </div>
    <div id="reviewList" style="margin-top:20px; display:none;"></div>
  </div>
</div>

<!-- Botón y Modal de Reporte de Errores -->
<button class="btn-report-float" onclick="openReportModal()">⚠️ Reportar error</button>

<div class="report-modal" id="reportModal">
  <div class="report-modal-content">
    <h3>⚠️ Reportar error o problema</h3>
    <p style="font-size: 0.88em; color: #475569; margin-bottom: 8px;">Describe el error detectado:</p>
    <textarea id="reportComment" placeholder="Escribe aquí tu observación..."></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeReportModal()">Cancelar</button>
      <button class="btn-danger" id="btnSendReport" onclick="submitReport()">Enviar reporte</button>
    </div>
  </div>
</div>

<script>
// =========================================================
// PANEL DE CONFIGURACIÓN PRINCIPAL
// =========================================================
const EXAM_MATERIA   = "Historia de México";
const EXAM_TEMA      = "27. Modelos económicos de México de 1940 a la fecha y su impacto (Tema 27)";
const EXAM_BANNER    = "https://lh3.googleusercontent.com/d/1ftPpCDdDCJkZEG9KNrqfsVN1YiS560n1";
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwlME2gtQ4nJ_BVeB1_FsvaQa1zG8kH8Kph4wmgaNwfB354QKGcd_MDrATEiIs2CQ/exec";

// =========================================================
// BANCO DE PREGUNTAS (20 REACTIVOS CON EXPLICACIÓN)
// =========================================================
const questions = [
  {
    "q": "1. ¿Cuál fue una característica fundamental del modelo de sustitución de importaciones implementado en México durante buena parte del siglo XX?",
    "opts": [
      "La eliminación de la industria nacional para favorecer las importaciones.",
      "La reducción de la intervención estatal en todas las actividades económicas.",
      "El impulso a la producción industrial nacional para sustituir bienes que anteriormente se importaban.",
      "La especialización exclusiva en la exportación de materias primas agrícolas."
    ],
    "correct": 2,
    "img": null,
    "exp": "El modelo de sustitución de importaciones buscó fortalecer la industria nacional mediante la producción interna de bienes que antes se adquirían en el extranjero, utilizando proteccionismo e inversión pública[cite: 20]."
  },
  {
    "q": "2. Entre las décadas de 1940 y 1970, México promovió la industrialización mediante protección arancelaria e inversión pública. ¿Cuál fue una consecuencia económica?",
    "opts": [
      "El crecimiento de la industria manufacturera, acompañado de una dependencia parcial de maquinaria y tecnología extranjeras.",
      "La desaparición de las empresas industriales nacionales.",
      "La eliminación total de la participación del Estado en la economía.",
      "La sustitución completa de las exportaciones por el autoconsumo agrícola."
    ],
    "correct": 0,
    "img": null,
    "exp": "La protección del mercado interno favoreció el crecimiento manufacturero, pero diversas ramas industriales continuaron dependiendo de bienes de capital e insumos importados[cite: 20]."
  },
  {
    "q": "3. ¿Qué presidente mexicano estuvo asociado con el inicio de una etapa de industrialización y crecimiento económico con mayor intervención estatal en la década de 1940?",
    "opts": [
      "Ernesto Zedillo Ponce de León.",
      "Miguel de la Madrid Hurtado.",
      "Carlos Salinas de Gortari.",
      "Manuel Ávila Camacho."
    ],
    "correct": 3,
    "img": null,
    "exp": "Durante el gobierno de Manuel Ávila Camacho (1940-1946) se impulsó la industrialización y la cooperación entre el Estado y el sector privado, favorecido por el contexto de la Segunda Guerra Mundial[cite: 20]."
  },
  {
    "q": "4. Durante el desarrollo estabilizador, México registró crecimiento sostenido, baja inflación y estabilidad cambiaria en los 50 y 60. ¿Cuál fue una característica de este modelo?",
    "opts": [
      "La eliminación de la industria manufacturera.",
      "La combinación de crecimiento industrial, estabilidad macroeconómica y participación estatal en la economía.",
      "La privatización generalizada de las empresas públicas como estrategia central.",
      "La apertura comercial irrestricta y la eliminación de la protección industrial."
    ],
    "correct": 1,
    "img": null,
    "exp": "El desarrollo estabilizador combinó crecimiento con estabilidad de precios y cambiaria, manteniendo el Estado una participación importante en infraestructura y regulación[cite: 20]."
  },
  {
    "q": "5. ¿Qué factor contribuyó a las dificultades del desarrollo estabilizador hacia finales de la década de 1960 y principios de la de 1970?",
    "opts": [
      "La desaparición completa de la inversión pública.",
      "La eliminación de las desigualdades regionales y sociales.",
      "La persistencia de desigualdades sociales y limitaciones en la distribución de los beneficios del crecimiento.",
      "La ausencia total de crecimiento industrial durante las décadas anteriores."
    ],
    "correct": 2,
    "img": null,
    "exp": "A pesar del crecimiento impulsado, sus beneficios se distribuyeron de manera desigual, persistiendo la pobreza y limitaciones en el acceso a servicios[cite: 20]."
  },
  {
    "q": "6. Durante el gobierno de Luis Echeverría Álvarez (1970-1976), se impulsó el desarrollo compartido. ¿Cuál fue uno de sus propósitos principales?",
    "opts": [
      "Reducir de manera inmediata toda la inversión pública.",
      "Eliminar los programas sociales para concentrar el gasto en exportaciones.",
      "Sustituir completamente la producción nacional por mercancías importadas.",
      "Promover el crecimiento económico y ampliar la participación de los sectores sociales en sus beneficios mediante una mayor intervención estatal."
    ],
    "correct": 3,
    "img": null,
    "exp": "El desarrollo compartido buscó combinar crecimiento económico con una distribución más amplia de sus beneficios a través de mayor gasto público y programas sociales[cite: 20]."
  },
  {
    "q": "7. ¿Cuál fue una característica del modelo de desarrollo acelerado impulsado durante el gobierno de José López Portillo (1976-1982)?",
    "opts": [
      "El aprovechamiento de los ingresos petroleros para impulsar el crecimiento y ampliar el gasto público.",
      "La eliminación de las exportaciones de petróleo.",
      "La sustitución inmediata de la economía mixta por una economía completamente privatizada.",
      "La prohibición de contratar deuda externa."
    ],
    "correct": 0,
    "img": null,
    "exp": "La expansión de la explotación petrolera generó expectativas de grandes ingresos, llevando al gobierno a aumentar el gasto y endeudarse en el exterior[cite: 20]."
  },
  {
    "q": "8. En 1982, México enfrentó una crisis de deuda externa, presiones cambiarias y problemas de pago. ¿Cuál de las siguientes condiciones contribuyó a esa crisis?",
    "opts": [
      "La ausencia de endeudamiento externo durante la década anterior.",
      "La combinación de endeudamiento elevado, mayores costos financieros y caída de los ingresos petroleros.",
      "La eliminación de las exportaciones petroleras desde 1970.",
      "La desaparición de los mercados financieros internacionales."
    ],
    "correct": 1,
    "img": null,
    "exp": "La crisis de 1982 derivó del endeudamiento externo, el aumento de tasas de interés internacionales, la caída de precios del petróleo y la pérdida de confianza financiera[cite: 20]."
  },
  {
    "q": "9. ¿Qué cambio caracterizó el modelo económico mexicano a partir de la década de 1980?",
    "opts": [
      "El regreso permanente a una economía basada exclusivamente en el autoconsumo.",
      "La eliminación del comercio internacional.",
      "La transición hacia una mayor apertura comercial, liberalización económica y participación del sector privado.",
      "La expansión indefinida de la protección arancelaria a todas las industrias nacionales."
    ],
    "correct": 2,
    "img": null,
    "exp": "A partir de la crisis de 1982, México reorientó su economía hacia la apertura comercial, privatizaciones, desregulación y mayor integración internacional[cite: 20]."
  },
  {
    "q": "10. En 1986, México ingresó al Acuerdo General sobre Aranceles Aduaneros y Comercio (GATT). ¿Qué implicación tuvo en el cambio de su modelo económico?",
    "opts": [
      "La obligación de abandonar toda actividad industrial nacional.",
      "La sustitución del peso por el dólar como moneda oficial.",
      "La prohibición de participar en el comercio internacional de manufacturas.",
      "El avance hacia una mayor integración comercial internacional y la reducción gradual de barreras al comercio."
    ],
    "correct": 3,
    "img": null,
    "exp": "El ingreso al GATT en 1986 comprometió a México con la reducción de barreras comerciales y una mayor integración a los mercados internacionales[cite: 20]."
  },
  {
    "q": "11. ¿Qué medida económica se asocia con el gobierno de Carlos Salinas de Gortari (1988-1994)?",
    "opts": [
      "La nacionalización de toda la banca privada.",
      "La privatización de numerosas empresas estatales y la negociación del Tratado de Libre Comercio de América del Norte.",
      "El cierre de la economía mexicana al comercio exterior.",
      "La eliminación de la inversión extranjera en el país."
    ],
    "correct": 1,
    "img": null,
    "exp": "Bajo el gobierno de Salinas se privatizaron empresas públicas, se profundizó la apertura y se negoció el TLCAN, que entró en vigor en 1994[cite: 20]."
  },
  {
    "q": "12. A partir de 1994, México experimentó una crisis financiera (fuga de capitales, depreciación). ¿Cuál fue una consecuencia económica importante?",
    "opts": [
      "El aumento automático del poder adquisitivo de todos los hogares.",
      "La desaparición de la deuda pública y privada.",
      "La presión sobre el sistema financiero, el encarecimiento de obligaciones en dólares y una contracción económica en 1995.",
      "La eliminación de la inflación y del desempleo."
    ],
    "correct": 2,
    "img": null,
    "exp": "La crisis de 1994-1995 generó desequilibrios financieros, depreciación cambiaria, encarecimiento de deudas en dólares y una profunda contracción económica en 1995[cite: 20]."
  },
  {
    "q": "13. ¿Qué tratado entró en vigor el 1 de enero de 1994 y transformó las relaciones comerciales de México con Estados Unidos y Canadá?",
    "opts": [
      "Tratado de Libre Comercio de América del Norte (TLCAN).",
      "Tratado de Maastricht.",
      "Tratado de Versalles.",
      "Tratado de Roma."
    ],
    "correct": 0,
    "img": null,
    "exp": "El TLCAN (sustituido en 2020 por el T-MEC) estableció el marco de reducción de barreras comerciales entre México, EE. UU. y Canadá[cite: 20]."
  },
  {
    "q": "14. Una empresa manufacturera exporta más a EE. UU. tras el TLCAN, incorporando tecnología y mejorando productividad. ¿Qué efecto ilustra este caso?",
    "opts": [
      "La desaparición inevitable de toda la industria nacional.",
      "La eliminación de la competencia internacional.",
      "La imposibilidad de incorporar tecnología extranjera.",
      "La integración a cadenas productivas internacionales y la presión para mejorar la competitividad."
    ],
    "correct": 3,
    "img": null,
    "exp": "La apertura comercial integró a ciertas empresas a cadenas de valor globales, incentivando la modernización y competitividad sectorial[cite: 20]."
  },
  {
    "q": "15. ¿Cuál de las siguientes características corresponde al modelo neoliberal implementado en México desde la década de 1980?",
    "opts": [
      "La eliminación de toda relación comercial con otros países.",
      "La expansión permanente de monopolios estatales en todas las ramas económicas.",
      "La apertura comercial, la privatización de empresas estatales y una mayor participación de los mecanismos de mercado.",
      "La prohibición de la inversión privada nacional y extranjera."
    ],
    "correct": 2,
    "img": null,
    "exp": "El neoliberalismo en México impulsó la apertura comercial, privatizaciones, desregulación y mayor predominio de los mecanismos de mercado[cite: 20]."
  },
  {

    "opts": [

    "opts": [

    "opts": [

      "La eliminación total de la pobreza.",
      "La persistencia de desigualdades sociales y regionales, a pesar de los periodos de crecimiento económico.",
      "La ausencia de cambios en la estructura productiva nacional."

  {

    "opts": [
      "México regresó íntegramente al modelo de sustitución de importaciones de 1940.",
      "México mantiene una economía de mercado integrada al comercio internacional, mientras modifica algunas prioridades de política social y de intervención estatal.",
      "México eliminó el comercio exterior y la inversión privada.",
      "México sustituyó el peso por una moneda regional común con EE. UU. y Canadá."
    ],
    "correct": 1,
    "img": null,

// =========================================================
// LÓGICA DEL SISTEMA (SIN CRONÓMETRO)
// =========================================================
let currentIndex = 0;
let studentName = "";
let studentGroup = "";
let answers = new Array(questions.length).fill(null);
let finished = false;
const letters = ["A", "B", "C", "D"];

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("bannerImage").src = EXAM_BANNER;
  document.title = "Evaluación — " + EXAM_MATERIA;
  document.getElementById("examTitleHeading").textContent = "Examen de " + EXAM_MATERIA + " — Tema 27";
  document.getElementById("examDescription").innerHTML = "Evaluación de la materia de <strong>" + EXAM_MATERIA + "</strong> (Tema: <em>Modelos económicos de México de 1940 a la fecha y su impacto</em>). Consta de <strong>" + questions.length + " reactivos</strong>. Al finalizar, tu calificación se registrará directamente en el sistema.";
  document.getElementById("metaMateriaTema").textContent = EXAM_MATERIA + " · Tema 27";
  document.getElementById("headerMateriaTema").textContent = EXAM_MATERIA;
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('cut', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('selectstart', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) || (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))) { e.preventDefault(); return false; }
});
window.addEventListener('beforeunload', function (e) {
  if (!finished && document.getElementById('examScreen').style.display === 'block') {
    e.preventDefault(); e.returnValue = '¿Seguro que quieres salir del examen?'; return e.returnValue;
  }
});

function updateOnlineStatus() {
  const dot = document.getElementById('netDot');
  const text = document.getElementById('netText');
  if (navigator.onLine) { dot.className = 'status-dot'; text.textContent = 'Conectado'; } 
  else { dot.className = 'status-dot offline'; text.textContent = 'Sin conexión'; }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

function startExam() {
  const nameInput = document.getElementById('studentNameInput');
  const groupInput = document.getElementById('studentGroupInput');
  if (!nameInput.value.trim() || !groupInput.value.trim()) {
    alert("Por favor completa tu Nombre y Grupo antes de iniciar.");
    return;
  }
  studentName = nameInput.value.trim();
  studentGroup = groupInput.value.trim();

  document.getElementById('displayName').textContent = studentName;
  document.getElementById('displayGroup').textContent = studentGroup;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('examScreen').style.display = 'block';

  buildPalette();
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('qCounter').textContent = "Reactivo " + (currentIndex + 1) + " de " + questions.length;
  document.getElementById('qText').innerHTML = q.q;

  const imgContainer = document.getElementById('qImageContainer');
  if (q.img) {
    imgContainer.innerHTML = '<img src="' + q.img + '" alt="Figura del reactivo">';
    imgContainer.style.display = 'block';
  } else {
    imgContainer.innerHTML = '';
    imgContainer.style.display = 'none';
  }

  const optWrap = document.getElementById('qOptions');
  optWrap.innerHTML = '';
  q.opts.forEach((optText, i) => {
    const label = document.createElement('label');
    label.className = answers[currentIndex] === i ? 'selected' : '';
    label.innerHTML = '<input type="radio" name="opt" value="' + i + '" ' + (answers[currentIndex] === i ? 'checked' : '') + '><span><strong>' + letters[i] + ')</strong> ' + optText + '</span>';
    label.onclick = () => selectAnswer(i);
    optWrap.appendChild(label);
  });

  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === questions.length - 1 ? 'Último reactivo' : 'Siguiente ▶';
  document.getElementById('progressBar').style.width = Math.round((answers.filter(a => a !== null).length / questions.length) * 100) + '%';
  refreshPalette();
  
  if (window.MathJax) { MathJax.typesetPromise([document.getElementById('questionCard')]).catch((err) => console.log(err.message)); }
}

function selectAnswer(i) { answers[currentIndex] = i; renderQuestion(); }
function goNext() { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
function goPrev() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

function buildPalette() {
  const palette = document.getElementById('palette');
  palette.innerHTML = '';
  questions.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.textContent = i + 1;
    btn.onclick = () => { currentIndex = i; renderQuestion(); };
    btn.id = 'pal-' + i;
    palette.appendChild(btn);
  });
}

function refreshPalette() {
  questions.forEach((_, i) => {
    const btn = document.getElementById('pal-' + i);
    if(btn) {
      btn.classList.toggle('answered', answers[i] !== null);
      btn.classList.toggle('current', i === currentIndex);
    }
  });
}

function confirmSubmit() {
  const unanswered = answers.filter(a => a === null).length;
  if (confirm(unanswered > 0 ? "Tienes " + unanswered + " sin responder. ¿Finalizar?" : "¿Estás seguro de enviar tu evaluación?")) {
    finishExam();
  }
}

function finishExam() {
  if (finished) return;
  finished = true;

  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  let totalCorrect = 0;
  const reviewData = [];

  questions.forEach((q, i) => { 
    const userAns = answers[i];
    const isCorrect = userAns === q.correct;
    if (isCorrect) totalCorrect++; 
    reviewData.push({
      num: i + 1,
      text: q.q,
      opts: q.opts,
      correctIdx: q.correct,
      userIdx: userAns,
      isCorrect: isCorrect,
      exp: q.exp || ""
    });
  });
  
  const pct = ((totalCorrect / questions.length) * 100).toFixed(1);

  document.getElementById('resultDetails').innerHTML = "<strong>Materia:</strong> " + EXAM_MATERIA + "<br><strong>Tema:</strong> Modelos económicos de México de 1940 a la fecha y su impacto<br><strong>Alumno:</strong> " + studentName + " | <strong>Grupo:</strong> " + studentGroup;
  document.getElementById('scoreBig').textContent = totalCorrect + "/" + questions.length + " (" + pct + "%)";
  document.getElementById('scoreBig').classList.toggle('fail', pct < 60);

  window._reviewData = reviewData;
  renderReview();

  sendDataToGoogleSheets({
    fecha: new Date().toLocaleDateString(),
    materia: EXAM_MATERIA,
    tema: "Modelos económicos de México de 1940 a la fecha y su impacto",
    nombre: studentName,
    grupo: studentGroup,
    puntajeGeneral: totalCorrect + "/" + questions.length + " (" + pct + "%)"
  });
}

function renderReview() {
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  window._reviewData.forEach(r => {
    const div = document.createElement('div');
    let cls = r.userIdx === null ? 'blank' : (r.isCorrect ? 'correct' : 'incorrect');
    div.className = 'reviewItem ' + cls;

    const correctText = '<strong>' + letters[r.correctIdx] + ')</strong> ' + r.opts[r.correctIdx];
    const userText = r.userIdx !== null ? '<strong>' + letters[r.userIdx] + ')</strong> ' + r.opts[r.userIdx] : '';

    let answerLine = '';
    if (r.userIdx === null) {
      answerLine = '<div class="yourAns">No respondida. Respuesta correcta: <span class="correctAns">' + correctText + '</span></div>';
    } else if (r.isCorrect) {
      answerLine = '<div class="yourAns">Tu respuesta: <span class="correctAns">' + userText + '</span> ✔</div>';
    } else {
      answerLine = '<div class="yourAns">Tu respuesta: <span class="wrongAns">' + userText + '</span> ✘ <br><span style="display:inline-block; margin-top:4px;">Respuesta correcta: <span class="correctAns">' + correctText + '</span></span></div>';
    }

    const expHtml = r.exp ? '<div class="explanation-box"><strong>💡 Explicación:</strong> ' + r.exp + '</div>' : '';

    div.innerHTML = '<div class="tag">Reactivo ' + r.num + '</div><div style="font-weight:600; margin-top:4px;">' + r.text + '</div>' + answerLine + expHtml;
    list.appendChild(div);
  });
  if (window.MathJax) { MathJax.typesetPromise([list]).catch((err) => console.log(err.message)); }
}

function toggleReview() {
  const list = document.getElementById('reviewList');
  const btn = document.getElementById('reviewToggleBtn');
  const show = list.style.display === 'none';
  list.style.display = show ? 'block' : 'none';
  btn.textContent = show ? 'Ocultar revisión detallada' : '🔍 Ver revisión detallada y explicaciones';
}

function sendDataToGoogleSheets(payload) {
  const syncEl = document.getElementById('syncStatus');
  syncEl.textContent = "Sincronizando con Google Sheets...";

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    syncEl.className = "sync-status ok";
    syncEl.textContent = "Calificación enviada con éxito";
  })
  .catch(err => {
    syncEl.className = "sync-status err";
    syncEl.textContent = "⚠️ Error al registrar: " + err.message;
  });
}

function openReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }

function submitReport() {
  const comment = document.getElementById('reportComment').value.trim();
  if (!comment) { alert("Escribe tu observación antes de enviar."); return; }
  
  const sendBtn = document.getElementById('btnSendReport');
  sendBtn.disabled = true;
  sendBtn.textContent = "Enviando...";

  const payload = {
    tipo: "reporte_error",
    fecha: new Date().toLocaleDateString(),
    examen: EXAM_MATERIA + " — Modelos económicos de México de 1940 a la fecha y su impacto",
    nombre: studentName || "Anónimo",
    grupo: studentGroup || "Sin grupo",
    ubicacion: "Reactivo " + (currentIndex + 1),
    comentario: comment
  };

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    alert("✅ Reporte enviado con éxito.");
    closeReportModal();
  })
  .catch(err => {
    alert("⚠️ Error: " + err.message);
  })
  .finally(() => {
    sendBtn.disabled = false;
    sendBtn.textContent = "Enviar reporte";
  });
}
</script>
