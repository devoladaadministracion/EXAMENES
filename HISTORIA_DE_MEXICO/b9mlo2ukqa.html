<style>

  .sync-status { padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 0.9em; text-align: center; background: #f1f5f9; color: #475569; }

  .sync-status.err { background: #fee2e2; color: #991b1b; }

  .explanation-box {

  .btn-report-float {

  .report-modal-content textarea {

  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

<div class="network-status" id="netStatus">

<div class="container">
  <div class="hero-banner-wrap">

  <div class="card" id="startScreen">
    <h2 id="examTitleHeading">Evaluación de Materia</h2>
    <div class="alert-box">⚠️ Se necesita conexión a internet para registrar tu calificación.</div>
    <p id="examDescription" style="color: #475569; font-size: 0.92em; line-height: 1.5;"></p>

    <label for="studentNameInput">Nombre completo del alumno:</label>
    <input type="text" id="studentNameInput" placeholder="Ej. Juan Pérez García" required>

    <label for="studentGroupInput">Grupo:</label>
    <input type="text" id="studentGroupInput" placeholder="Ej. Grupo 101" required>

    <button class="btn-gold" onclick="startExam()">Comenzar Evaluación</button>
  </div>

  <div id="examScreen">
    <div class="exam-header">
      <div>👤 <span id="displayName"></span> | <span id="displayGroup" style="opacity: 0.85;"></span></div>
      <div style="font-size: 0.85em; color: var(--gold-brand); font-weight: 600;" id="headerMateriaTema"></div>
    </div>

    <div class="progressBarWrap"><div id="progressBar"></div></div>
    <div class="card card-standalone" id="questionCard">
      <details class="paletteWrap">
        <summary>🗺️ Ver mapa de preguntas</summary>
        <div id="palette"></div>
      </details>
      <div class="qMeta">
        <span id="metaMateriaTema">Evaluación</span>
        <span id="qCounter" style="white-space: nowrap;"></span>
      </div>
      <div class="qText" id="qText"></div>
      <div id="qImageContainer" class="qImageWrap" style="display:none;"></div>
      <div class="options" id="qOptions"></div>
      <div class="navRow">
        <button class="btn-secondary" id="prevBtn" onclick="goPrev()">◀ Anterior</button>
        <button class="btn-danger" onclick="confirmSubmit()">Finalizar y Entregar</button>
        <button class="btn-secondary" id="nextBtn" onclick="goNext()">Siguiente ▶</button>
      </div>
    </div>
  </div>

  <div class="card card-standalone" id="resultScreen">
    <h2>Resumen de Evaluación</h2>
    <p id="resultDetails" style="color: #475569; font-size: 0.95em;"></p>
    <div class="scoreBig" id="scoreBig"></div>
    <div id="syncStatus" class="sync-status">Guardando resultados en Google Sheets...</div>
    <div style="margin-top:25px;">
      <button class="btn-secondary" onclick="toggleReview()" id="reviewToggleBtn">🔍 Ver revisión detallada y explicaciones</button>
    </div>
    <div id="reviewList" style="margin-top:20px; display:none;"></div>

<!-- Botón y Modal de Reporte de Errores -->

    <h3>⚠️ Reportar error o problema</h3>

    <textarea id="reportComment" placeholder="Escribe aquí tu observación..."></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeReportModal()">Cancelar</button>
      <button class="btn-danger" id="btnSendReport" onclick="submitReport()">Enviar reporte</button>

<script>
// =========================================================
// PANEL DE CONFIGURACIÓN PRINCIPAL
// =========================================================
const EXAM_MATERIA   = "Historia de México";
const EXAM_TEMA      = "4. Las reformas borbónicas y las ciencias y las artes (Tema 4)";
const EXAM_BANNER    = "https://lh3.googleusercontent.com/d/1ftPpCDdDCJkZEG9KNrqfsVN1YiS560n1";
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwlME2gtQ4nJ_BVeB1_FsvaQa1zG8kH8Kph4wmgaNwfB354QKGcd_MDrATEiIs2CQ/exec";

// =========================================================
// BANCO DE PREGUNTAS (20 REACTIVOS CON EXPLICACIÓN)
// =========================================================
const questions = [
  {
    "q": "1. ¿A qué dinastía perteneció la monarquía española que impulsó las reformas borbónicas durante el siglo XVIII?",
    "opts": [
      "Habsburgo.",
      "Trastámara.",
      "Borbón.",
      "Tudor."
    ],
    "correct": 2,
    "img": null,
    "exp": "La dinastía Borbón llegó al trono español a principios del siglo XVIII y promovió reformas administrativas, económicas, fiscales y militares para fortalecer la monarquía."
  },
  {
    "q": "2. Durante el siglo XVIII, la Corona española reorganizó la administración de sus territorios americanos y buscó incrementar los ingresos fiscales. ¿Cuál fue uno de los objetivos centrales de las reformas borbónicas?",
    "opts": [
      "Fortalecer el control de la Corona sobre las colonias y aumentar la recaudación.",
      "Conceder independencia política inmediata a Nueva España.",
      "Eliminar los impuestos y reducir la intervención del Estado en la economía.",
      "Transferir el gobierno virreinal a las corporaciones religiosas."
    ],
    "correct": 0,
    "img": null,
    "exp": "Las reformas borbónicas pretendían centralizar la administración, mejorar la recaudación y reforzar el poder de la monarquía española frente a otros grupos e intereses coloniales."
  },
  {
    "q": "3. ¿Qué institución administrativa se introdujo en Nueva España como parte de las reformas borbónicas para mejorar la recaudación y el control territorial?",
    "opts": [
      "La encomienda.",
      "El calpulli.",
      "La Real Casa de Moneda.",
      "El sistema de intendencias."
    ],
    "correct": 3,
    "img": null,
    "exp": "El sistema de intendencias se implantó en Nueva España a partir de 1786. Los intendentes asumieron funciones administrativas, fiscales, judiciales y militares."
  },
  {
    "q": "4. Un funcionario novohispano observa que, después de la implantación de las intendencias, ciertas funciones administrativas y fiscales se reorganizan bajo autoridades con atribuciones territoriales definidas. ¿Qué propósito perseguía principalmente esta medida?",
    "opts": [
      "Eliminar la autoridad del monarca sobre los territorios americanos.",
      "Mejorar la administración territorial y reforzar el control fiscal de la Corona.",
      "Sustituir todos los tribunales coloniales por instituciones indígenas.",
      "Garantizar que los criollos ocuparan exclusivamente los principales cargos públicos."
    ],
    "correct": 1,
    "img": null,
    "exp": "Las intendencias buscaron hacer más eficiente la administración territorial y la recaudación, además de reducir la autonomía de algunos poderes locales."
  },
  {
    "q": "5. ¿Qué medida de las reformas borbónicas afectó directamente a la Compañía de Jesús en los territorios de la monarquía española?",
    "opts": [
      "Su reconocimiento como autoridad política independiente.",
      "La transferencia de todas las minas novohispanas a su propiedad.",
      "Su expulsión de los dominios españoles en 1767.",
      "La concesión del gobierno del virreinato a sus superiores religiosos."
    ],
    "correct": 2,
    "img": null,
    "exp": "Carlos III ordenó la expulsión de los jesuitas de los territorios de la monarquía española en 1767, respondiendo a objetivos políticos y de control sobre la Iglesia."
  },
  {
    "q": "6. La expulsión de los jesuitas en 1767 provocó inconformidad entre distintos sectores de Nueva España. ¿Cuál fue una consecuencia importante de esta medida?",
    "opts": [
      "La desaparición inmediata de todas las instituciones educativas novohispanas.",
      "La independencia política de los territorios americanos.",
      "El establecimiento de un gobierno jesuita autónomo en la Ciudad de México.",
      "La pérdida de una orden religiosa que tenía presencia educativa, intelectual y económica en el virreinato."
    ],
    "correct": 3,
    "img": null,
    "exp": "Los jesuitas administraban colegios y participaban en actividades intelectuales y económicas. Su expulsión afectó instituciones educativas y provocó reacciones sociales."
  },
  {
    "q": "7. ¿Qué efecto tuvieron las reformas borbónicas sobre la participación de los criollos en el gobierno de Nueva España?",
    "opts": [
      "Se favoreció de manera general su acceso a los cargos más altos del virreinato.",
      "Se eliminaron todas las diferencias entre criollos y peninsulares.",
      "Se redujo la presencia de peninsulares en los principales puestos administrativos.",
      "Se favoreció el nombramiento de funcionarios peninsulares en puestos importantes, lo que generó descontento entre sectores criollos."
    ],
    "correct": 3,
    "img": null,
    "exp": "La Corona colocó a funcionarios peninsulares en cargos estratégicos, limitando oportunidades para ciertos criollos y generando descontento en sectores privilegiados."
  },
  {
    "q": "8. Un comerciante novohispano advierte que las reformas fiscales y administrativas incrementan la vigilancia de las actividades económicas y las obligaciones tributarias. ¿Qué relación existe entre estas medidas y la política borbónica?",
    "opts": [
      "La Corona pretendía fortalecer sus ingresos y su capacidad de intervención en la economía colonial.",
      "La Corona buscaba renunciar a todos los ingresos provenientes de América.",
      "Las reformas tenían como finalidad suprimir cualquier intercambio comercial.",
      "Las autoridades pretendían transferir la recaudación fiscal exclusivamente a las comunidades indígenas."
    ],
    "correct": 0,
    "img": null,
    "exp": "Las reformas fiscales buscaban elevar y hacer más eficiente la recaudación, reduciendo la evasión y fortaleciendo el control económico de la monarquía."
  },
  {
    "q": "9. ¿Qué relación existió entre el crecimiento económico de Nueva España y las reformas borbónicas?",
    "opts": [
      "Las reformas eliminaron de inmediato la minería y el comercio.",
      "Las reformas buscaron aumentar la actividad económica y los ingresos de la Corona mediante cambios fiscales y comerciales.",
      "La Corona prohibió toda actividad económica que no fuera agrícola.",
      "Las reformas convirtieron a Nueva España en un territorio políticamente independiente."
    ],
    "correct": 1,
    "img": null,
    "exp": "Las reformas impulsaron cambios fiscales, administrativos y comerciales para incrementar la actividad económica y los recursos destinados a la metrópoli."
  },
  {
    "q": "10. En el contexto de las reformas borbónicas, la Corona amplió ciertas posibilidades de comercio, pero mantuvo restricciones. ¿Cuál es la interpretación correcta de esta política?",
    "opts": [
      "Se instauró un comercio internacional completamente libre para todas las colonias.",
      "Se eliminaron todos los impuestos sobre las mercancías americanas.",
      "Se flexibilizaron algunas reglas comerciales sin abandonar el control monárquico sobre el intercambio colonial.",
      "Se prohibió el comercio entre Nueva España y la península ibérica."
    ],
    "correct": 2,
    "img": null,
    "exp": "Las disposiciones de libre comercio (1778) ampliaron los puertos y rutas, pero no significaron libertad comercial absoluta ni el fin de los controles coloniales."
  },
  {
    "q": "11. ¿Qué corriente intelectual europea del siglo XVIII promovió la razón, la crítica de las tradiciones y la difusión del conocimiento científico?",
    "opts": [
      "La escolástica medieval.",
      "El feudalismo.",
      "El romanticismo.",
      "La Ilustración."
    ],
    "correct": 3,
    "img": null,
    "exp": "La Ilustración fue un movimiento intelectual que destacó la razón, la observación y el conocimiento como medios para comprender y transformar la sociedad."
  },
  {
    "q": "12. Un grupo de intelectuales novohispanos estudia fenómenos naturales, recopila información sobre el territorio y cuestiona explicaciones tradicionales. ¿Qué influencia intelectual se relaciona?",
    "opts": [
      "La Ilustración, por su énfasis en la razón, la observación y la investigación sistemática.",
      "El pensamiento feudal, por su rechazo general de la investigación natural.",
      "El absolutismo religioso, por su oposición a cualquier conocimiento empírico.",
      "El romanticismo del siglo XIX, por su prioridad de los sentimientos sobre la ciencia."
    ],
    "correct": 0,
    "img": null,
    "exp": "Las ideas ilustradas estimularon el interés por la ciencia, la clasificación de la naturaleza y el análisis racional en Nueva España."
  },
  {
    "q": "13. ¿Cuál de las siguientes instituciones científicas fue fundada en Nueva España en 1792 para formar especialistas en minería?",
    "opts": [
      "La Real Academia Española.",
      "El Colegio de San Ildefonso.",
      "El Real Seminario de Minería.",
      "La Universidad de Salamanca."
    ],
    "correct": 2,
    "img": null,
    "exp": "El Real Seminario de Minería fue creado en 1792 para la formación técnica y científica de especialistas en minería."
  },
  {
    "q": "14. La minería novohispana requería mejorar los procedimientos de extracción. ¿Por qué la creación del Real Seminario de Minería representó un avance científico y técnico?",
    "opts": [
      "Porque sustituyó la investigación científica por la enseñanza exclusivamente religiosa.",
      "Porque impulsó la formación especializada y la aplicación de conocimientos científicos a la actividad minera.",
      "Porque prohibió el uso de conocimientos matemáticos en las minas.",
      "Porque convirtió a la minería en una actividad independiente de la economía virreinal."
    ],
    "correct": 1,
    "img": null,
    "exp": "El Real Seminario de Minería promovió la enseñanza de matemáticas, química y mineralogía aplicadas a los problemas técnicos de la minería."
  },
  {
    "q": "15. ¿Qué científico y naturalista novohispano destacó por sus estudios sobre la flora, la fauna y la geografía de Nueva España?",
    "opts": [
      "Carlos de Sigüenza y Góngora.",
      "José María Morelos y Pavón.",
      "Francisco Javier Clavijero.",
      "José Antonio de Alzate y Ramírez."
    ],
    "correct": 3,
    "img": null,
    "exp": "José Antonio de Alzate y Ramírez destacó en el siglo XVIII por sus estudios de ciencias naturales, observación y divulgación científica."
  },
  {
    "q": "16. Un intelectual novohispano publica trabajos científicos y utiliza periódicos para divulgar conocimientos sobre fenómenos naturales. ¿Qué transformación cultural refleja?",
    "opts": [

    "opts": [

  {

    "opts": [
      "Ambos procesos buscaron eliminar toda forma de conocimiento científico en Nueva España.",
      "Las reformas borbónicas garantizaron la independencia política inmediata del virreinato.",
      "La difusión de la Ilustración impidió cualquier cambio en la administración colonial.",
      "Las reformas reforzaron el control monárquico, mientras las ideas ilustradas favorecieron cambios en la educación, la ciencia y la cultura."
    ],
    "correct": 3,
    "img": null,

  }
];

// =========================================================
// LÓGICA DEL SISTEMA (SIN CRONÓMETRO)
// =========================================================
let currentIndex = 0;
let studentName = "";
let studentGroup = "";
let answers = new Array(questions.length).fill(null);
let finished = false;
const letters = ["A", "B", "C", "D"];

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("bannerImage").src = EXAM_BANNER;
  document.title = "Evaluación — " + EXAM_MATERIA;
  document.getElementById("examTitleHeading").textContent = "Examen de " + EXAM_MATERIA + " — Tema 4";
  document.getElementById("examDescription").innerHTML = "Evaluación de la materia de <strong>" + EXAM_MATERIA + "</strong> (Tema: <em>Las reformas borbónicas y las ciencias y las artes</em>). Consta de <strong>" + questions.length + " reactivos</strong>. Al finalizar, tu calificación se registrará directamente en el sistema.";
  document.getElementById("metaMateriaTema").textContent = EXAM_MATERIA + " · Tema 4";
  document.getElementById("headerMateriaTema").textContent = EXAM_MATERIA;
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('cut', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('selectstart', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) || (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))) { e.preventDefault(); return false; }
});
window.addEventListener('beforeunload', function (e) {
  if (!finished && document.getElementById('examScreen').style.display === 'block') {
    e.preventDefault(); e.returnValue = '¿Seguro que quieres salir del examen?'; return e.returnValue;
  }
});

function updateOnlineStatus() {
  const dot = document.getElementById('netDot');
  const text = document.getElementById('netText');
  if (navigator.onLine) { dot.className = 'status-dot'; text.textContent = 'Conectado'; } 
  else { dot.className = 'status-dot offline'; text.textContent = 'Sin conexión'; }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

function startExam() {
  const nameInput = document.getElementById('studentNameInput');
  const groupInput = document.getElementById('studentGroupInput');
  if (!nameInput.value.trim() || !groupInput.value.trim()) {
    alert("Por favor completa tu Nombre y Grupo antes de iniciar.");
    return;
  }
  studentName = nameInput.value.trim();
  studentGroup = groupInput.value.trim();

  document.getElementById('displayName').textContent = studentName;
  document.getElementById('displayGroup').textContent = studentGroup;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('examScreen').style.display = 'block';

  buildPalette();
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('qCounter').textContent = "Reactivo " + (currentIndex + 1) + " de " + questions.length;
  document.getElementById('qText').innerHTML = q.q;

  const imgContainer = document.getElementById('qImageContainer');
  if (q.img) {
    imgContainer.innerHTML = '<img src="' + q.img + '" alt="Figura del reactivo">';
    imgContainer.style.display = 'block';
  } else {
    imgContainer.innerHTML = '';
    imgContainer.style.display = 'none';
  }

  const optWrap = document.getElementById('qOptions');
  optWrap.innerHTML = '';
  q.opts.forEach((optText, i) => {
    const label = document.createElement('label');
    label.className = answers[currentIndex] === i ? 'selected' : '';
    label.innerHTML = '<input type="radio" name="opt" value="' + i + '" ' + (answers[currentIndex] === i ? 'checked' : '') + '><span><strong>' + letters[i] + ')</strong> ' + optText + '</span>';
    label.onclick = () => selectAnswer(i);
    optWrap.appendChild(label);
  });

  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === questions.length - 1 ? 'Último reactivo' : 'Siguiente ▶';
  document.getElementById('progressBar').style.width = Math.round((answers.filter(a => a !== null).length / questions.length) * 100) + '%';
  refreshPalette();
  
  if (window.MathJax) { MathJax.typesetPromise([document.getElementById('questionCard')]).catch((err) => console.log(err.message)); }
}

function selectAnswer(i) { answers[currentIndex] = i; renderQuestion(); }
function goNext() { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
function goPrev() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

function buildPalette() {
  const palette = document.getElementById('palette');
  palette.innerHTML = '';
  questions.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.textContent = i + 1;
    btn.onclick = () => { currentIndex = i; renderQuestion(); };
    btn.id = 'pal-' + i;
    palette.appendChild(btn);
  });
}

function refreshPalette() {
  questions.forEach((_, i) => {
    const btn = document.getElementById('pal-' + i);
    if(btn) {
      btn.classList.toggle('answered', answers[i] !== null);
      btn.classList.toggle('current', i === currentIndex);
    }
  });
}

function confirmSubmit() {
  const unanswered = answers.filter(a => a === null).length;
  if (confirm(unanswered > 0 ? "Tienes " + unanswered + " sin responder. ¿Finalizar?" : "¿Estás seguro de enviar tu evaluación?")) {
    finishExam();
  }
}

function finishExam() {
  if (finished) return;
  finished = true;

  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  let totalCorrect = 0;
  const reviewData = [];

  questions.forEach((q, i) => { 
    const userAns = answers[i];
    const isCorrect = userAns === q.correct;
    if (isCorrect) totalCorrect++; 
    reviewData.push({
      num: i + 1,
      text: q.q,
      opts: q.opts,
      correctIdx: q.correct,
      userIdx: userAns,
      isCorrect: isCorrect,
      exp: q.exp || ""
    });
  });
  
  const pct = ((totalCorrect / questions.length) * 100).toFixed(1);

  document.getElementById('resultDetails').innerHTML = "<strong>Materia:</strong> " + EXAM_MATERIA + "<br><strong>Tema:</strong> Las reformas borbónicas y las ciencias y las artes<br><strong>Alumno:</strong> " + studentName + " | <strong>Grupo:</strong> " + studentGroup;
  document.getElementById('scoreBig').textContent = totalCorrect + "/" + questions.length + " (" + pct + "%)";
  document.getElementById('scoreBig').classList.toggle('fail', pct < 60);

  window._reviewData = reviewData;
  renderReview();

  sendDataToGoogleSheets({
    fecha: new Date().toLocaleDateString(),
    materia: EXAM_MATERIA,
    tema: "Las reformas borbónicas y las ciencias y las artes",
    nombre: studentName,
    grupo: studentGroup,
    puntajeGeneral: totalCorrect + "/" + questions.length + " (" + pct + "%)"
  });
}

function renderReview() {
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  window._reviewData.forEach(r => {
    const div = document.createElement('div');
    let cls = r.userIdx === null ? 'blank' : (r.isCorrect ? 'correct' : 'incorrect');
    div.className = 'reviewItem ' + cls;

    const correctText = '<strong>' + letters[r.correctIdx] + ')</strong> ' + r.opts[r.correctIdx];
    const userText = r.userIdx !== null ? '<strong>' + letters[r.userIdx] + ')</strong> ' + r.opts[r.userIdx] : '';

    let answerLine = '';
    if (r.userIdx === null) {
      answerLine = '<div class="yourAns">No respondida. Respuesta correcta: <span class="correctAns">' + correctText + '</span></div>';
    } else if (r.isCorrect) {
      answerLine = '<div class="yourAns">Tu respuesta: <span class="correctAns">' + userText + '</span> ✔</div>';
    } else {
      answerLine = '<div class="yourAns">Tu respuesta: <span class="wrongAns">' + userText + '</span> ✘ <br><span style="display:inline-block; margin-top:4px;">Respuesta correcta: <span class="correctAns">' + correctText + '</span></span></div>';
    }

    const expHtml = r.exp ? '<div class="explanation-box"><strong>💡 Explicación:</strong> ' + r.exp + '</div>' : '';

    div.innerHTML = '<div class="tag">Reactivo ' + r.num + '</div><div style="font-weight:600; margin-top:4px;">' + r.text + '</div>' + answerLine + expHtml;
    list.appendChild(div);
  });
  if (window.MathJax) { MathJax.typesetPromise([list]).catch((err) => console.log(err.message)); }
}

function toggleReview() {
  const list = document.getElementById('reviewList');
  const btn = document.getElementById('reviewToggleBtn');
  const show = list.style.display === 'none';
  list.style.display = show ? 'block' : 'none';
  btn.textContent = show ? 'Ocultar revisión detallada' : '🔍 Ver revisión detallada y explicaciones';
}

function sendDataToGoogleSheets(payload) {
  const syncEl = document.getElementById('syncStatus');
  syncEl.textContent = "Sincronizando con Google Sheets...";

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    syncEl.className = "sync-status ok";
    syncEl.textContent = "Calificación enviada con éxito";
  })
  .catch(err => {
    syncEl.className = "sync-status err";
    syncEl.textContent = "⚠️ Error al registrar: " + err.message;
  });
}

function openReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }

function submitReport() {
  const comment = document.getElementById('reportComment').value.trim();
  if (!comment) { alert("Escribe tu observación antes de enviar."); return; }
  
  const sendBtn = document.getElementById('btnSendReport');
  sendBtn.disabled = true;
  sendBtn.textContent = "Enviando...";

  const payload = {
    tipo: "reporte_error",
    fecha: new Date().toLocaleDateString(),
    examen: EXAM_MATERIA + " — Las reformas borbónicas y las ciencias y las artes",
    nombre: studentName || "Anónimo",
    grupo: studentGroup || "Sin grupo",
    ubicacion: "Reactivo " + (currentIndex + 1),
    comentario: comment
  };

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    alert("✅ Reporte enviado con éxito.");
    closeReportModal();
  })
  .catch(err => {
    alert("⚠️ Error: " + err.message);
  })
  .finally(() => {
    sendBtn.disabled = false;
    sendBtn.textContent = "Enviar reporte";
  });
}
</script>
</body>
