<style>

  .sync-status { padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 0.9em; text-align: center; background: #f1f5f9; color: #475569; }
  .sync-status.ok { background: #dcfce7; color: #166534; font-weight: 600; }
  .sync-status.err { background: #fee2e2; color: #991b1b; }
  .reviewItem { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 14px; background: #ffffff; }
  .reviewItem.correct { border-left: 6px solid var(--success); }
  .reviewItem.incorrect { border-left: 6px solid var(--danger); }

  .explanation-box {

  .btn-report-float {

    padding: 10px; font-family: inherit; font-size: 0.9em; margin: 10px 0 15px; resize: none; outline: none;

<div class="network-status" id="netStatus">
  <div class="status-dot" id="netDot"></div>

</div>

<div class="container">
  <div class="hero-banner-wrap">
    <img id="bannerImage" src="" alt="Banner Institucional">
  </div>

  <div class="card" id="startScreen">
    <h2 id="examTitleHeading">Evaluación de Materia</h2>
    <div class="alert-box">⚠️ Se necesita conexión a internet para registrar tu calificación.</div>
    <p id="examDescription" style="color: #475569; font-size: 0.92em; line-height: 1.5;"></p>

    <label for="studentNameInput">Nombre completo del alumno:</label>
    <input type="text" id="studentNameInput" placeholder="Ej. Juan Pérez García" required>

    <label for="studentGroupInput">Grupo:</label>
    <input type="text" id="studentGroupInput" placeholder="Ej. Grupo 101" required>

    <button class="btn-gold" onclick="startExam()">Comenzar Evaluación</button>
  </div>

  <div id="examScreen">
    <div class="exam-header">
      <div>👤 <span id="displayName"></span> | <span id="displayGroup" style="opacity: 0.85;"></span></div>
      <div style="font-size: 0.85em; color: var(--gold-brand); font-weight: 600;" id="headerMateriaTema"></div>
    </div>

    <div class="progressBarWrap"><div id="progressBar"></div></div>
    <div class="card card-standalone" id="questionCard">
      <details class="paletteWrap">
        <summary>🗺️ Ver mapa de preguntas</summary>
        <div id="palette"></div>
      </details>
      <div class="qMeta">
        <span id="metaMateriaTema">Evaluación</span>
        <span id="qCounter" style="white-space: nowrap;"></span>
      </div>
      <div class="qText" id="qText"></div>
      <div id="qImageContainer" class="qImageWrap" style="display:none;"></div>
      <div class="options" id="qOptions"></div>
      <div class="navRow">
        <button class="btn-secondary" id="prevBtn" onclick="goPrev()">◀ Anterior</button>
        <button class="btn-danger" onclick="confirmSubmit()">Finalizar y Entregar</button>
        <button class="btn-secondary" id="nextBtn" onclick="goNext()">Siguiente ▶</button>
      </div>
    </div>
  </div>

  <div class="card card-standalone" id="resultScreen">
    <h2>Resumen de Evaluación</h2>
    <p id="resultDetails" style="color: #475569; font-size: 0.95em;"></p>
    <div class="scoreBig" id="scoreBig"></div>
    <div id="syncStatus" class="sync-status">Guardando resultados en Google Sheets...</div>
    <div style="margin-top:25px;">
      <button class="btn-secondary" onclick="toggleReview()" id="reviewToggleBtn">🔍 Ver revisión detallada y explicaciones</button>
    </div>
    <div id="reviewList" style="margin-top:20px; display:none;"></div>
  </div>
</div>

<!-- Botón y Modal de Reporte de Errores -->
<button class="btn-report-float" onclick="openReportModal()">⚠️ Reportar error</button>

<div class="report-modal" id="reportModal">
  <div class="report-modal-content">
    <h3>⚠️ Reportar error o problema</h3>
    <p style="font-size: 0.88em; color: #475569; margin-bottom: 8px;">Describe el error detectado:</p>
    <textarea id="reportComment" placeholder="Escribe aquí tu observación..."></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeReportModal()">Cancelar</button>
      <button class="btn-danger" id="btnSendReport" onclick="submitReport()">Enviar reporte</button>
    </div>
  </div>
</div>

<script>
// =========================================================
// PANEL DE CONFIGURACIÓN PRINCIPAL
// =========================================================
const EXAM_MATERIA   = "Historia de México";
const EXAM_TEMA      = "24. Procesos económicos, políticos y sociales a partir de 1929: Crisis de 1929 y Segunda Guerra Mundial (Tema 24)";
const EXAM_BANNER    = "https://lh3.googleusercontent.com/d/1ftPpCDdDCJkZEG9KNrqfsVN1YiS560n1";
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwlME2gtQ4nJ_BVeB1_FsvaQa1zG8kH8Kph4wmgaNwfB354QKGcd_MDrATEiIs2CQ/exec";

// =========================================================
// BANCO DE PREGUNTAS (20 REACTIVOS CON EXPLICACIÓN)
// =========================================================
const questions = [
  {
    "q": "1. ¿Cuál fue uno de los principales factores que desencadenaron la crisis económica de 1929 en Estados Unidos?",
    "opts": [
      "La reducción de la producción industrial durante toda la década de 1920.",
      "La sobreproducción, la especulación bursátil y el desequilibrio entre la producción y la capacidad de consumo.",
      "La nacionalización de las empresas privadas por el gobierno estadounidense.",
      "La suspensión del comercio internacional como consecuencia de la Segunda Guerra Mundial."
    ],
    "correct": 1,
    "img": null,
    "exp": "La crisis de 1929 fue resultado de diversos factores, entre ellos la especulación bursátil, el crédito excesivo y los desequilibrios entre la producción y el consumo[cite: 20]."
  },
  {
    "q": "2. Durante la década de 1920, numerosos inversionistas estadounidenses compraron acciones utilizando créditos. Cuando los precios comenzaron a caer en octubre de 1929, muchos intentaron venderlas simultáneamente. ¿Cuál fue una consecuencia inmediata de este comportamiento?",
    "opts": [
      "El incremento sostenido del valor de las acciones.",
      "La recuperación automática de los bancos comerciales.",
      "La desaparición de las deudas contraídas por los inversionistas.",
      "La aceleración de la caída bursátil y la pérdida de grandes cantidades de capital."
    ],
    "correct": 3,
    "img": null,
    "exp": "La venta masiva de acciones intensificó la caída de sus precios, provocando pérdidas colosales de capital y afectando a bancos y empresas[cite: 20]."
  },
  {
    "q": "3. ¿Qué acontecimiento se identifica convencionalmente como el inicio de la crisis bursátil de 1929?",
    "opts": [
      "El desplome de la Bolsa de Nueva York en octubre de 1929.",
      "La invasión alemana de Polonia en septiembre de 1939.",
      "La firma del Tratado de Versalles en junio de 1919.",
      "El ataque japonés a Pearl Harbor en diciembre de 1941."
    ],
    "correct": 0,
    "img": null,
    "exp": "El desplome bursátil de octubre de 1929 marcó el inicio de una crisis financiera que se transformó en una depresión económica prolongada[cite: 20]."
  },
  {
    "q": "4. Después del desplome bursátil de 1929, numerosos bancos estadounidenses quebraron y las empresas redujeron sus actividades. ¿Qué secuencia explica mejor cómo estos acontecimientos profundizaron la Gran Depresión?",
    "opts": [
      "Aumento del crédito, crecimiento del consumo y eliminación del desempleo.",
      "Expansión del gasto privado, aumento de los salarios y crecimiento sostenido de las exportaciones.",
      "Restricción del crédito, reducción de la inversión y la producción, y aumento del desempleo.",
      "Nacionalización generalizada de la industria, incremento inmediato de la demanda y recuperación financiera."
    ],
    "correct": 2,
    "img": null,
    "exp": "Las quiebras bancarias y la contracción del crédito dificultaron la financiación, redujeron la inversión y la producción, y elevaron el desempleo[cite: 20]."
  },
  {
    "q": "5. ¿Quién era el presidente de Estados Unidos cuando ocurrió el desplome bursátil de 1929?",
    "opts": [
      "Franklin D. Roosevelt.",
      "Harry S. Truman.",
      "Woodrow Wilson.",
      "Herbert Hoover."
    ],
    "correct": 3,
    "img": null,
    "exp": "Herbert Hoover asumió la presidencia en marzo de 1929, siendo sucedido posteriormente por Franklin D. Roosevelt en 1933[cite: 20]."
  },
  {
    "q": "6. En 1933, el gobierno de Franklin D. Roosevelt impulsó un conjunto de medidas para enfrentar la Gran Depresión. ¿Cuál de las siguientes acciones corresponde al enfoque general del New Deal?",
    "opts": [
      "Eliminar toda regulación económica y retirar completamente al Estado de la actividad financiera.",
      "Impulsar programas de empleo, reformar el sistema financiero y ampliar la intervención gubernamental en la economía.",
      "Priorizar exclusivamente la expansión territorial mediante conquistas militares.",
      "Sustituir inmediatamente la economía de mercado por un sistema de propiedad colectiva."
    ],
    "correct": 1,
    "img": null,
    "exp": "El New Deal incluyó obras públicas, empleo, reformas bancarias y regulación económica para aliviar la crisis sin abolir el capitalismo[cite: 20]."
  },
  {
    "q": "7. ¿Qué efecto tuvo la Gran Depresión en la economía mundial?",
    "opts": [
      "Provocó una expansión comercial uniforme en todos los continentes.",
      "Eliminó las diferencias económicas entre países industrializados y agrícolas.",
      "Redujo el comercio internacional y afectó la producción, el empleo y los ingresos de numerosos países.",
      "Terminó con la intervención del Estado en las economías nacionales."
    ],
    "correct": 2,
    "img": null,
    "exp": "La contracción de la demanda y el proteccionismo redujeron el comercio internacional, afectando fuertemente a los países exportadores de materias primas[cite: 20]."
  },
  {
    "q": "8. México dependía en parte de las exportaciones de minerales, petróleo y productos agrícolas. Durante la Gran Depresión disminuyó la demanda internacional. ¿Cuál fue una consecuencia probable para la economía mexicana?",
    "opts": [
      "La reducción de los ingresos por exportaciones y el deterioro de la actividad económica.",
      "La desaparición de la dependencia del mercado internacional.",
      "El crecimiento inmediato y generalizado de las exportaciones mexicanas.",
      "La eliminación de las dificultades económicas mediante la expansión del crédito externo."
    ],
    "correct": 0,
    "img": null,
    "exp": "La caída de la demanda y de los precios internacionales perjudicó los ingresos por exportaciones de México, evidenciando su vulnerabilidad externa[cite: 20]."
  },
  {
    "q": "9. ¿Cuál fue una característica de los regímenes totalitarios que se consolidaron en Europa durante el periodo de entreguerras?",
    "opts": [
      "La separación absoluta entre el Estado y las organizaciones políticas.",
      "La defensa de la pluralidad partidista y de elecciones plenamente competitivas.",
      "La renuncia del Estado a intervenir en la propaganda y la educación.",
      "La concentración del poder, el control político y la represión de la oposición."
    ],
    "correct": 3,
    "img": null,
    "exp": "Los regímenes totalitarios concentraron el poder y controlaron la sociedad mediante propaganda, represión y la anulación de la oposición[cite: 20]."
  },
  {
    "q": "10. Tras la Primera Guerra Mundial, Alemania enfrentó crisis y resentimiento por el Tratado de Versalles. ¿Cómo contribuyeron estos factores al ascenso del nazismo?",
    "opts": [
      "Fortalecieron la confianza en la República de Weimar y eliminaron el extremismo.",
      "Favorecieron el apoyo a movimientos nacionalistas radicales que prometían recuperar la grandeza alemana y superar la crisis.",
      "Provocaron la restauración inmediata de las fronteras alemanas anteriores a la guerra.",
      "Permitieron que Alemania abandonara las tensiones mediante una democracia estable."
    ],
    "correct": 1,
    "img": null,
    "exp": "La inestabilidad y el descontento social facilitaron el ascenso del nazismo bajo la promesa de superar la crisis y restaurar el poderío alemán[cite: 20]."
  },
  {
    "q": "11. ¿Qué acontecimiento marcó el inicio de la Segunda Guerra Mundial en Europa?",
    "opts": [
      "La invasión alemana de Polonia el 1 de septiembre de 1939.",
      "La invasión alemana de la Unión Soviética en junio de 1941.",
      "El ataque japonés a Pearl Harbor el 7 de diciembre de 1941.",
      "El desembarco aliado en Normandía en junio de 1944."
    ],
    "correct": 0,
    "img": null,
    "exp": "La invasión de Polonia por parte de Alemania el 1 de septiembre de 1939 desencadenó las declaraciones de guerra de Gran Bretaña y Francia[cite: 20]."
  },
  {
    "q": "12. Durante la Segunda Guerra Mundial, Alemania firmó un pacto de no agresión con la URSS en agosto de 1939. ¿Cuál fue una consecuencia estratégica inmediata?",
    "opts": [
      "La entrada de la URSS en la guerra contra Alemania desde septiembre de 1939.",
      "La formación de una alianza militar permanente entre Alemania y Estados Unidos.",
      "La reducción temporal del riesgo de una guerra en dos frentes y la delimitación de áreas de influencia en Europa oriental.",
      "La rendición incondicional de Alemania ante las potencias occidentales."
    ],
    "correct": 2,
    "img": null,
    "exp": "El pacto germano-soviético evitó temporalmente un conflicto en dos frentes para Alemania y repartió esferas de influencia en Europa oriental[cite: 20]."
  },
  {
    "q": "13. ¿Cuál fue la importancia del ataque japonés a Pearl Harbor, ocurrido el 7 de diciembre de 1941?",
    "opts": [
      "Provocó la rendición inmediata de Japón.",
      "Determinó la salida de Estados Unidos del conflicto mundial.",
      "Marcó el inicio de la invasión alemana de Polonia.",
      "Condujo a la entrada de Estados Unidos en la Segunda Guerra Mundial."
    ],
    "correct": 3,
    "img": null,
    "exp": "El ataque a Pearl Harbor provocó que Estados Unidos declarara formalmente la guerra a Japón y entrara de lleno en el conflicto global[cite: 20]."
  },
  {
    "q": "14. En junio de 1941, Alemania inició la Operación Barbarroja contra la Unión Soviética. ¿Cuál fue una consecuencia estratégica importante de esta decisión?",
    "opts": [
      "La Unión Soviética se retiró de la guerra y aceptó las condiciones alemanas.",
      "Alemania abrió un enorme frente oriental que exigió una gran cantidad de recursos y tropas.",
      "El Reino Unido firmó inmediatamente un armisticio con Alemania.",
      "Japón abandonó el Eje y declaró la guerra a Alemania."
    ],
    "correct": 1,
    "img": null,
    "exp": "La invasión a la URSS abrió un frente oriental masivo cuyo desgaste militar y logístico debilitó severamente a la maquinaria bélica alemana[cite: 20]."
  },
  {
    "q": "15. ¿Qué países integraron las principales potencias del Eje durante la Segunda Guerra Mundial?",
    "opts": [
      "Estados Unidos, Reino Unido y Unión Soviética.",
      "Francia, China y Polonia.",
      "Alemania, Italia y Japón.",
      "Reino Unido, Italia y Estados Unidos."
    ],
    "correct": 2,
    "img": null,
    "exp": "Alemania, Italia y Japón conformaron el bloque principal de las potencias del Eje frente a la coalición de los Aliados[cite: 20]."

  {

    "correct": 3,
    "img": null,

// =========================================================
// LÓGICA DEL SISTEMA (SIN CRONÓMETRO)
// =========================================================
let currentIndex = 0;
let studentName = "";
let studentGroup = "";
let answers = new Array(questions.length).fill(null);
let finished = false;
const letters = ["A", "B", "C", "D"];

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("bannerImage").src = EXAM_BANNER;
  document.title = "Evaluación — " + EXAM_MATERIA;
  document.getElementById("examTitleHeading").textContent = "Examen de " + EXAM_MATERIA + " — Tema 24";
  document.getElementById("examDescription").innerHTML = "Evaluación de la materia de <strong>" + EXAM_MATERIA + "</strong> (Tema: <em>Procesos económicos, políticos y sociales a partir de 1929: Crisis de 1929 y Segunda Guerra Mundial</em>). Consta de <strong>" + questions.length + " reactivos</strong>. Al finalizar, tu calificación se registrará directamente en el sistema.";
  document.getElementById("metaMateriaTema").textContent = EXAM_MATERIA + " · Tema 24";
  document.getElementById("headerMateriaTema").textContent = EXAM_MATERIA;
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('cut', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('selectstart', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) || (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))) { e.preventDefault(); return false; }
});
window.addEventListener('beforeunload', function (e) {
  if (!finished && document.getElementById('examScreen').style.display === 'block') {
    e.preventDefault(); e.returnValue = '¿Seguro que quieres salir del examen?'; return e.returnValue;
  }
});

function updateOnlineStatus() {
  const dot = document.getElementById('netDot');
  const text = document.getElementById('netText');
  if (navigator.onLine) { dot.className = 'status-dot'; text.textContent = 'Conectado'; } 
  else { dot.className = 'status-dot offline'; text.textContent = 'Sin conexión'; }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

function startExam() {
  const nameInput = document.getElementById('studentNameInput');
  const groupInput = document.getElementById('studentGroupInput');
  if (!nameInput.value.trim() || !groupInput.value.trim()) {
    alert("Por favor completa tu Nombre y Grupo antes de iniciar.");
    return;
  }
  studentName = nameInput.value.trim();
  studentGroup = groupInput.value.trim();

  document.getElementById('displayName').textContent = studentName;
  document.getElementById('displayGroup').textContent = studentGroup;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('examScreen').style.display = 'block';

  buildPalette();
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('qCounter').textContent = "Reactivo " + (currentIndex + 1) + " de " + questions.length;
  document.getElementById('qText').innerHTML = q.q;

  const imgContainer = document.getElementById('qImageContainer');
  if (q.img) {
    imgContainer.innerHTML = '<img src="' + q.img + '" alt="Figura del reactivo">';
    imgContainer.style.display = 'block';
  } else {
    imgContainer.innerHTML = '';
    imgContainer.style.display = 'none';
  }

  const optWrap = document.getElementById('qOptions');
  optWrap.innerHTML = '';
  q.opts.forEach((optText, i) => {
    const label = document.createElement('label');
    label.className = answers[currentIndex] === i ? 'selected' : '';
    label.innerHTML = '<input type="radio" name="opt" value="' + i + '" ' + (answers[currentIndex] === i ? 'checked' : '') + '><span><strong>' + letters[i] + ')</strong> ' + optText + '</span>';
    label.onclick = () => selectAnswer(i);
    optWrap.appendChild(label);
  });

  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === questions.length - 1 ? 'Último reactivo' : 'Siguiente ▶';
  document.getElementById('progressBar').style.width = Math.round((answers.filter(a => a !== null).length / questions.length) * 100) + '%';
  refreshPalette();
  
  if (window.MathJax) { MathJax.typesetPromise([document.getElementById('questionCard')]).catch((err) => console.log(err.message)); }
}

function selectAnswer(i) { answers[currentIndex] = i; renderQuestion(); }
function goNext() { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
function goPrev() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

function buildPalette() {
  const palette = document.getElementById('palette');
  palette.innerHTML = '';
  questions.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.textContent = i + 1;
    btn.onclick = () => { currentIndex = i; renderQuestion(); };
    btn.id = 'pal-' + i;
    palette.appendChild(btn);
  });
}

function refreshPalette() {
  questions.forEach((_, i) => {
    const btn = document.getElementById('pal-' + i);
    if(btn) {
      btn.classList.toggle('answered', answers[i] !== null);
      btn.classList.toggle('current', i === currentIndex);
    }
  });
}

function confirmSubmit() {
  const unanswered = answers.filter(a => a === null).length;
  if (confirm(unanswered > 0 ? "Tienes " + unanswered + " sin responder. ¿Finalizar?" : "¿Estás seguro de enviar tu evaluación?")) {
    finishExam();
  }
}

function finishExam() {
  if (finished) return;
  finished = true;

  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  let totalCorrect = 0;
  const reviewData = [];

  questions.forEach((q, i) => { 
    const userAns = answers[i];
    const isCorrect = userAns === q.correct;
    if (isCorrect) totalCorrect++; 
    reviewData.push({
      num: i + 1,
      text: q.q,
      opts: q.opts,
      correctIdx: q.correct,
      userIdx: userAns,
      isCorrect: isCorrect,
      exp: q.exp || ""
    });
  });
  
  const pct = ((totalCorrect / questions.length) * 100).toFixed(1);

  document.getElementById('resultDetails').innerHTML = "<strong>Materia:</strong> " + EXAM_MATERIA + "<br><strong>Tema:</strong> Crisis de 1929 y Segunda Guerra Mundial<br><strong>Alumno:</strong> " + studentName + " | <strong>Grupo:</strong> " + studentGroup;
  document.getElementById('scoreBig').textContent = totalCorrect + "/" + questions.length + " (" + pct + "%)";
  document.getElementById('scoreBig').classList.toggle('fail', pct < 60);

  window._reviewData = reviewData;
  renderReview();

  sendDataToGoogleSheets({
    fecha: new Date().toLocaleDateString(),
    materia: EXAM_MATERIA,
    tema: "Procesos económicos, políticos y sociales a partir de 1929: Crisis de 1929 y Segunda Guerra Mundial",
    nombre: studentName,
    grupo: studentGroup,
    puntajeGeneral: totalCorrect + "/" + questions.length + " (" + pct + "%)"
  });
}

function renderReview() {
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  window._reviewData.forEach(r => {
    const div = document.createElement('div');
    let cls = r.userIdx === null ? 'blank' : (r.isCorrect ? 'correct' : 'incorrect');
    div.className = 'reviewItem ' + cls;

    const correctText = '<strong>' + letters[r.correctIdx] + ')</strong> ' + r.opts[r.correctIdx];
    const userText = r.userIdx !== null ? '<strong>' + letters[r.userIdx] + ')</strong> ' + r.opts[r.userIdx] : '';

    let answerLine = '';
    if (r.userIdx === null) {
      answerLine = '<div class="yourAns">No respondida. Respuesta correcta: <span class="correctAns">' + correctText + '</span></div>';
    } else if (r.isCorrect) {
      answerLine = '<div class="yourAns">Tu respuesta: <span class="correctAns">' + userText + '</span> ✔</div>';
    } else {
      answerLine = '<div class="yourAns">Tu respuesta: <span class="wrongAns">' + userText + '</span> ✘ <br><span style="display:inline-block; margin-top:4px;">Respuesta correcta: <span class="correctAns">' + correctText + '</span></span></div>';
    }

    const expHtml = r.exp ? '<div class="explanation-box"><strong>💡 Explicación:</strong> ' + r.exp + '</div>' : '';

    div.innerHTML = '<div class="tag">Reactivo ' + r.num + '</div><div style="font-weight:600; margin-top:4px;">' + r.text + '</div>' + answerLine + expHtml;
    list.appendChild(div);
  });
  if (window.MathJax) { MathJax.typesetPromise([list]).catch((err) => console.log(err.message)); }
}

function toggleReview() {
  const list = document.getElementById('reviewList');
  const btn = document.getElementById('reviewToggleBtn');
  const show = list.style.display === 'none';
  list.style.display = show ? 'block' : 'none';
  btn.textContent = show ? 'Ocultar revisión detallada' : '🔍 Ver revisión detallada y explicaciones';
}

function sendDataToGoogleSheets(payload) {
  const syncEl = document.getElementById('syncStatus');
  syncEl.textContent = "Sincronizando con Google Sheets...";

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    syncEl.className = "sync-status ok";
    syncEl.textContent = "Calificación enviada con éxito";
  })
  .catch(err => {
    syncEl.className = "sync-status err";
    syncEl.textContent = "⚠️ Error al registrar: " + err.message;
  });
}

function openReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }

function submitReport() {
  const comment = document.getElementById('reportComment').value.trim();
  if (!comment) { alert("Escribe tu observación antes de enviar."); return; }
  
  const sendBtn = document.getElementById('btnSendReport');
  sendBtn.disabled = true;
  sendBtn.textContent = "Enviando...";

  const payload = {
    tipo: "reporte_error",
    fecha: new Date().toLocaleDateString(),
    examen: EXAM_MATERIA + " — Procesos económicos, políticos y sociales a partir de 1929 (Crisis de 1929 y Segunda Guerra Mundial)",
    nombre: studentName || "Anónimo",
    grupo: studentGroup || "Sin grupo",
    ubicacion: "Reactivo " + (currentIndex + 1),
    comentario: comment
  };

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    alert("✅ Reporte enviado con éxito.");
    closeReportModal();
  })
  .catch(err => {
    alert("⚠️ Error: " + err.message);
  })
  .finally(() => {
    sendBtn.disabled = false;
    sendBtn.textContent = "Enviar reporte";
  });
}
</script>
