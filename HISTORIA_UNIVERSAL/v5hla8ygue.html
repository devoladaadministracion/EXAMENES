<style>
  :root {

    --danger: #b91c1c;
  }

  body {
    font-family: 'Poppins', sans-serif;

    background-position: center;
    background-attachment: fixed;

  .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--success); }
  .status-dot.offline { background-color: var(--danger); }
  .hero-banner-wrap { width: 100%; border-radius: 12px 12px 0 0; overflow: hidden; border-top: 5px solid var(--gold-brand); background: var(--navy-main); }

  label { font-weight: 600; font-size: 0.9em; color: var(--navy-main); display: block; margin-top: 12px; }
  input[type=text] { width: 100%; padding: 12px 14px; font-size: 0.95em; border: 2px solid #cbd5e1; border-radius: 8px; margin-top: 6px; }
  input[type=text]:focus { border-color: var(--gold-brand); outline: none; }
  button { cursor: pointer; border: none; border-radius: 8px; padding: 12px 24px; font-size: 1em; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-gold { background-color: #C89200; color: #ffffff; width: 100%; font-size: 1.1em; padding: 14px; margin-top: 20px; }
  .btn-gold:hover { background-color: var(--gold-hover); }
  .btn-secondary { background: #e2e8f0; color: var(--navy-main); }

  .btn-danger { background: var(--danger); color: #fff; }
  #examScreen, #resultScreen { display: none; }
  .exam-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; background: var(--navy-main); color: var(--text-white); padding: 14px 18px; border-radius: 10px; border-left: 4px solid var(--gold-brand); margin-bottom: 15px; }
  .progressBarWrap { background: var(--navy-light); border-radius: 999px; height: 8px; overflow: hidden; margin-bottom: 18px; }
  #progressBar { height: 100%; background: linear-gradient(90deg, #a67900, var(--gold-brand)); width: 0%; transition: width 0.25s ease; }
  .qMeta { display: flex; justify-content: space-between; color: var(--gold-brand); font-size: 0.85em; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; gap: 10px; }
  .qText { font-size: 1.12em; margin-bottom: 15px; line-height: 1.6; color: var(--navy-dark); font-weight: 600; }
  .qImageWrap { text-align: center; margin: 15px 0 20px; }

  .options input { margin-right: 12px; transform: scale(1.2); accent-color: var(--gold-brand); }
  .navRow { display: flex; justify-content: space-between; margin-top: 25px; gap: 10px; flex-wrap: wrap; }
  #palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 5px; margin: 14px 0; }

  #palette button.current { outline: 3px solid var(--gold-brand); }
  details.paletteWrap summary { cursor: pointer; font-weight: 600; color: var(--navy-main); margin-bottom: 10px; }
  .scoreBig { font-size: 3em; font-weight: 800; color: var(--navy-main); text-align: center; margin: 15px 0 5px; }
  .scoreBig.fail { color: var(--danger); }
  .sync-status { padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 0.9em; text-align: center; background: #f1f5f9; color: #475569; }
  .sync-status.ok { background: #dcfce7; color: #166534; font-weight: 600; }
  .sync-status.err { background: #fee2e2; color: #991b1b; }
  .reviewItem { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 14px; background: #ffffff; }
  .reviewItem.correct { border-left: 6px solid var(--success); }
  .reviewItem.incorrect { border-left: 6px solid var(--danger); }
  .reviewItem.blank { border-left: 6px solid #94a3b8; }
  .reviewItem .tag { font-size: 0.75em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
  .reviewItem .yourAns { margin-top: 8px; font-size: 0.95em; }
  .reviewItem .correctAns { color: var(--success); font-weight: 600; }
  .reviewItem .wrongAns { color: var(--danger); font-weight: 600; }
  .explanation-box {
    margin-top: 10px;
    padding: 10px 14px;
    background: #f8fafc;
    border-left: 3px solid var(--gold-brand);
    border-radius: 4px;
    font-size: 0.88em;
    color: #334155;
    line-height: 1.5;
  }
  
  .btn-report-float {
    position: fixed; bottom: 20px; right: 20px; z-index: 1000;
    background-color: var(--danger); color: #ffffff; padding: 10px 18px;
    border-radius: 999px; font-size: 0.88em; font-weight: 600;
    box-shadow: 0 4px 15px rgba(185, 28, 28, 0.4); display: inline-flex;
    align-items: center; gap: 6px; border: none; cursor: pointer;
  }
  .report-modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;

  .report-modal-content {
    background: #ffffff; border-radius: 12px; width: 100%; max-width: 650px; padding: 24px;

    max-height: 90vh; overflow-y: auto;
  }
  .report-modal-content textarea {
    width: 100%; height: 100px; border: 2px solid #cbd5e1; border-radius: 8px;
    padding: 10px; font-family: inherit; font-size: 0.9em; margin: 10px 0 15px; resize: none; outline: none;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
</style>
</head>

<div class="network-status" id="netStatus">
  <div class="status-dot" id="netDot"></div>
  <span id="netText">Conectado</span>
</div>

<div class="container">
  <div class="hero-banner-wrap">
    <img id="bannerImage" src="" alt="Banner Institucional">
  </div>

  <div class="card" id="startScreen">
    <h2 id="examTitleHeading">Evaluación de Materia</h2>
    <div class="alert-box">⚠️ Se necesita conexión a internet para registrar tu calificación.</div>
    <p id="examDescription" style="color: #475569; font-size: 0.92em; line-height: 1.5;"></p>

    <label for="studentNameInput">Nombre completo del alumno:</label>
    <input type="text" id="studentNameInput" placeholder="Ej. Juan Pérez García" required>

    <label for="studentGroupInput">Grupo:</label>
    <input type="text" id="studentGroupInput" placeholder="Ej. Grupo 101" required>

    <button class="btn-gold" onclick="startExam()">Comenzar Evaluación</button>
  </div>

  <div id="examScreen">
    <div class="exam-header">
      <div>👤 <span id="displayName"></span> | <span id="displayGroup" style="opacity: 0.85;"></span></div>
      <div style="font-size: 0.85em; color: var(--gold-brand); font-weight: 600;" id="headerMateriaTema"></div>
    </div>

    <div class="progressBarWrap"><div id="progressBar"></div></div>
    <div class="card card-standalone" id="questionCard">
      <details class="paletteWrap">
        <summary>🗺️ Ver mapa de preguntas</summary>
        <div id="palette"></div>
      </details>
      <div class="qMeta">
        <span id="metaMateriaTema">Evaluación</span>
        <span id="qCounter" style="white-space: nowrap;"></span>
      </div>
      <div class="qText" id="qText"></div>
      <div id="qImageContainer" class="qImageWrap" style="display:none;"></div>
      <div class="options" id="qOptions"></div>
      <div class="navRow">
        <button class="btn-secondary" id="prevBtn" onclick="goPrev()">◀ Anterior</button>
        <button class="btn-danger" onclick="confirmSubmit()">Finalizar y Entregar</button>
        <button class="btn-secondary" id="nextBtn" onclick="goNext()">Siguiente ▶</button>
      </div>
    </div>
  </div>

  <div class="card card-standalone" id="resultScreen">
    <h2>Resumen de Evaluación</h2>
    <p id="resultDetails" style="color: #475569; font-size: 0.95em;"></p>
    <div class="scoreBig" id="scoreBig"></div>
    <div id="syncStatus" class="sync-status">Guardando resultados en Google Sheets...</div>
    <div style="margin-top:25px;">
      <button class="btn-secondary" onclick="toggleReview()" id="reviewToggleBtn">🔍 Ver revisión detallada y explicaciones</button>
    </div>
    <div id="reviewList" style="margin-top:20px; display:none;"></div>
  </div>
</div>

<!-- Botón y Modal de Reporte de Errores -->
<button class="btn-report-float" onclick="openReportModal()">⚠️ Reportar error</button>

<div class="report-modal" id="reportModal">
  <div class="report-modal-content">
    <h3>⚠️ Reportar error o problema</h3>
    <p style="font-size: 0.88em; color: #475569; margin-bottom: 8px;">Describe el error detectado:</p>
    <textarea id="reportComment" placeholder="Escribe aquí tu observación..."></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeReportModal()">Cancelar</button>
      <button class="btn-danger" id="btnSendReport" onclick="submitReport()">Enviar reporte</button>
    </div>
  </div>
</div>

<script>
// =========================================================
// PANEL DE CONFIGURACIÓN PRINCIPAL
// =========================================================
const EXAM_MATERIA   = "Historia Universal";
const EXAM_TEMA      = "2.2 El fortalecimiento de la burguesía: Independencia de las Trece Colonias, Revolución Francesa, Imperio napoleónico, Independencia de Hispanoamérica y Revolución Industrial (Tema 3)";
const EXAM_BANNER    = "https://lh3.googleusercontent.com/d/1NYNHyM5xS3dVErmQCoXt8PLN08VX9atQ";
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwlME2gtQ4nJ_BVeB1_FsvaQa1zG8kH8Kph4wmgaNwfB354QKGcd_MDrATEiIs2CQ/exec";

// =========================================================
// BANCO DE PREGUNTAS (20 REACTIVOS CON EXPLICACIÓN)
// =========================================================
const questions = [
  {
    "q": "1. ¿Cuál fue una de las principales causas de la Independencia de las Trece Colonias inglesas de América del Norte?",
    "opts": [
      "La imposición de nuevos impuestos por parte de Gran Bretaña sin representación colonial en el Parlamento.",
      "La intención de las colonias de restablecer el sistema feudal europeo.",
      "La prohibición británica de practicar cualquier actividad agrícola.",
      "La intervención militar de Francia para impedir el comercio colonial."
    ],
    "correct": 0,
    "img": null,
    "exp": "Las medidas fiscales británicas, como los impuestos al papel sellado y al té, provocaron oposición entre los colonos, quienes reclamaban participar en las decisiones políticas que los afectaban."
  },
  {
    "q": "2. La Declaración de Independencia de Estados Unidos, aprobada el 4 de julio de 1776, retomó ideas ilustradas sobre los derechos naturales. ¿Qué pensador influyó especialmente en la afirmación de que los gobiernos deben proteger derechos como la vida y la libertad?",
    "opts": [
      "Thomas Hobbes.",
      "Jacques-Bénigne Bossuet.",
      "John Locke.",
      "Nicolás Maquiavelo."
    ],
    "correct": 2,
    "img": null,
    "exp": "John Locke defendió la existencia de derechos naturales y sostuvo que la legitimidad del gobierno dependía de su función de protegerlos, ideas que influyeron en el pensamiento revolucionario estadounidense."
  },
  {
    "q": "3. ¿Qué documento proclamó formalmente la independencia de las Trece Colonias en 1776?",
    "opts": [
      "La Constitución francesa de 1791.",
      "La Declaración de Independencia de Estados Unidos.",
      "El Tratado de Versalles de 1815.",
      "La Declaración de los Derechos del Hombre y del Ciudadano."
    ],
    "correct": 1,
    "img": null,
    "exp": "La Declaración de Independencia, aprobada el 4 de julio de 1776, anunció la separación política de las Trece Colonias respecto de Gran Bretaña."
  },
  {
    "q": "4. ¿Cuál fue una consecuencia política fundamental de la independencia estadounidense y de la posterior organización constitucional de Estados Unidos?",
    "opts": [
      "La restauración de la monarquía absoluta en las antiguas colonias.",
      "La eliminación de toda autoridad federal y estatal.",
      "La instauración de una sociedad basada exclusivamente en privilegios hereditarios.",
      "La formación de una república constitucional con división de poderes."
    ],
    "correct": 3,
    "img": null,
    "exp": "La Constitución estadounidense de 1787 estableció un sistema republicano federal con separación de poderes, aunque coexistió con la esclavitud y exclusiones sociales."
  },
  {
    "q": "5. ¿Cuál fue uno de los factores que contribuyeron al estallido de la Revolución francesa en 1789?",
    "opts": [
      "La desaparición de las diferencias sociales entre los estamentos.",
      "La crisis financiera de la monarquía, la desigualdad fiscal y el descontento social.",
      "La industrialización completa de Francia antes de 1789.",
      "La derrota definitiva de Napoleón en Waterloo."
    ],
    "correct": 1,
    "img": null,
    "exp": "La crisis fiscal de la monarquía, los privilegios de la nobleza y el clero, las dificultades económicas y las ideas ilustradas contribuyeron al descontento que desembocó en la Revolución francesa."
  },
  {
    "q": "6. En la sociedad francesa anterior a la Revolución, el Tercer Estado incluía burgueses, artesanos y campesinos. ¿Qué situación generaba un conflicto central con los estamentos privilegiados?",
    "opts": [
      "El Tercer Estado concentraba todos los privilegios fiscales y políticos.",
      "La nobleza y el clero carecían de derechos jurídicos especiales.",
      "El Tercer Estado soportaba importantes cargas fiscales y tenía una representación política limitada frente a los privilegios de los otros estamentos.",
      "Los campesinos controlaban de manera exclusiva las instituciones de la monarquía."
    ],
    "correct": 2,
    "img": null,
    "exp": "Aunque el Tercer Estado incluía grupos diversos, sus integrantes enfrentaban desigualdades fiscales y políticas frente a la nobleza y el clero, alimentando demandas de transformación."
  },
  {
    "q": "7. ¿Qué documento aprobado en 1789 durante la Revolución francesa proclamó principios como la libertad, la igualdad jurídica y la soberanía nacional?",
    "opts": [
      "La Declaración de los Derechos del Hombre y del Ciudadano.",
      "El Código de Hammurabi.",
      "La Carta Magna inglesa de 1215.",
      "El Acta de Navegación de 1651."
    ],
    "correct": 0,
    "img": null,
    "exp": "La Declaración de los Derechos del Hombre y del Ciudadano estableció principios fundamentales de libertad e igualdad ante la ley y afirmó que la soberanía reside en la nación."
  },
  {
    "q": "8. ¿Cuál fue una diferencia importante entre la etapa inicial de la Revolución francesa y el periodo del Terror de 1793-1794?",
    "opts": [
      "La primera restauró el feudalismo y el segundo estableció el absolutismo borbónico.",
      "La primera abolió toda forma de representación política y el segundo eliminó la república.",
      "La primera fue dirigida por Napoleón y el segundo por Luis XVI.",
      "La primera impulsó la transformación del orden monárquico y la afirmación de derechos, mientras que el Terror se caracterizó por una intensa represión política revolucionaria."
    ],
    "correct": 3,
    "img": null,
    "exp": "Durante el Terror, asociado al gobierno de los jacobinos, se aplicaron medidas de represión severa contra los considerados enemigos de la revolución."
  },
  {
    "q": "9. ¿Quién asumió el poder en Francia mediante el golpe de Estado del 18 de brumario de 1799?",
    "opts": [
      "Luis XVI.",
      "Maximilien Robespierre.",
      "Napoleón Bonaparte.",
      "Charles de Gaulle."
    ],
    "correct": 2,
    "img": null,
    "exp": "Napoleón Bonaparte encabezó el golpe de Estado del 18 de brumario (9 de noviembre de 1799), estableciendo el Consulado."
  },
  {
    "q": "10. ¿Cuál fue una consecuencia del Código Civil napoleónico de 1804?",
    "opts": [
      "La restauración general de los privilegios jurídicos de la nobleza feudal.",
      "La consolidación de principios como la igualdad civil masculina ante la ley y la protección de la propiedad privada.",
      "La eliminación de la propiedad privada en Francia.",
      "La concesión inmediata de igualdad política plena a las mujeres."
    ],
    "correct": 1,
    "img": null,
    "exp": "El Código Napoleónico consolidó la igualdad civil masculina ante la ley y protegió la propiedad privada, reforzando también la autoridad patriarcal."
  },
  {
    "q": "11. ¿Qué acontecimiento europeo favoreció el inicio de los movimientos independentistas en Hispanoamérica a comienzos del siglo XIX?",
    "opts": [
      "La unificación política de Italia en 1861.",
      "La Revolución rusa de 1917.",
      "La caída del Imperio romano de Occidente.",
      "La invasión napoleónica de España en 1808 y la crisis de legitimidad de la monarquía española."
    ],
    "correct": 3,
    "img": null,
    "exp": "La invasión francesa y las abdicaciones de Bayona de 1808 provocaron una crisis de legitimidad en la monarquía española que impulsó juntas de gobierno en América."
  },
  {
    "q": "12. En los movimientos de independencia hispanoamericanos participaron diversos grupos. ¿Qué factor contribuyó a que los criollos encabezaran numerosas luchas?",
    "opts": [
      "Su exclusión absoluta de todas las actividades económicas.",
      "Su oposición generalizada a cualquier forma de autonomía americana.",
      "Su descontento con las restricciones políticas y el predominio peninsular en los principales cargos de la administración colonial.",
      "Su intención de restablecer el dominio político de los pueblos originarios en toda América."
    ],
    "correct": 2,
    "img": null,
    "exp": "Los criollos poseían recursos y educación, pero estaban limitados en el acceso a altos cargos administrativos, lo que impulsó su liderazgo independentista."
  },
  {
    "q": "13. ¿Qué líder se convirtió en una figura central de la Revolución haitiana durante sus primeras etapas, iniciadas con la rebelión de personas esclavizadas en 1791?",
    "opts": [
      "Simón Bolívar.",
      "Miguel Hidalgo y Costilla.",
      "José de San Martín.",
      "Toussaint Louverture."
    ],
    "correct": 3,
    "img": null,
    "exp": "Toussaint Louverture fue un líder clave de la Revolución haitiana, la cual culminó con la proclamación de la independencia en 1804 bajo Jean-Jacques Dessalines."
  },
  {
    "q": "14. ¿Cuál fue una diferencia relevante entre la independencia de Haití y varios procesos independentistas de Hispanoamérica?",
    "opts": [
      "Haití surgió de una revolución en la que la rebelión de los esclavizados tuvo un papel central y se abolió la esclavitud en el proceso revolucionario.",
      "Haití obtuvo su independencia sin enfrentamientos armados.",
      "Haití mantuvo el dominio colonial francés después de 1804.",
      "Los movimientos hispanoamericanos fueron dirigidos exclusivamente por personas esclavizadas."
    ],
    "correct": 0,
    "img": null,
    "exp": "La Revolución haitiana fue una insurrección antiesclavista radical que abolió la esclavitud y fundó el segundo estado independiente de América."
  },
  {
    "q": "15. ¿Cuál fue una de las principales características de la Revolución Industrial iniciada en Gran Bretaña durante la segunda mitad del siglo XVIII?",
    "opts": [
      "La sustitución generalizada de las fábricas por talleres domésticos.",
      "La expansión de la producción mecanizada y del sistema fabril.",
      "La desaparición inmediata del comercio internacional.",
      "El abandono de las fuentes de energía para regresar al trabajo manual."
    ],
    "correct": 1,
    "img": null,
    "exp": "La Revolución Industrial transformó la producción mediante la mecanización, el uso creciente de energía y la concentración fabril."
  },
  {
    "q": "16. ¿Por qué Gran Bretaña reunió condiciones favorables para el inicio de la Revolución Industrial?",
    "opts": [
      "Porque carecía de mercados comerciales y de recursos minerales.",

// =========================================================
// LÓGICA DEL SISTEMA (SIN CRONÓMETRO)
// =========================================================
let currentIndex = 0;
let studentName = "";
let studentGroup = "";
let answers = new Array(questions.length).fill(null);
let finished = false;
const letters = ["A", "B", "C", "D"];

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("bannerImage").src = EXAM_BANNER;
  document.title = "Evaluación — " + EXAM_MATERIA;
  document.getElementById("examTitleHeading").textContent = "Examen de " + EXAM_MATERIA + " — Tema 3";
  document.getElementById("examDescription").innerHTML = "Evaluación de la materia de <strong>" + EXAM_MATERIA + "</strong> (Tema: <em>El fortalecimiento de la burguesía</em>). Consta de <strong>" + questions.length + " reactivos</strong>. Al finalizar, tu calificación se registrará directamente en el sistema.";
  document.getElementById("metaMateriaTema").textContent = EXAM_MATERIA + " · Tema 3";
  document.getElementById("headerMateriaTema").textContent = EXAM_MATERIA;
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('cut', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('selectstart', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) || (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))) { e.preventDefault(); return false; }
});
window.addEventListener('beforeunload', function (e) {
  if (!finished && document.getElementById('examScreen').style.display === 'block') {
    e.preventDefault(); e.returnValue = '¿Seguro que quieres salir del examen?'; return e.returnValue;
  }
});

function updateOnlineStatus() {
  const dot = document.getElementById('netDot');
  const text = document.getElementById('netText');
  if (navigator.onLine) { dot.className = 'status-dot'; text.textContent = 'Conectado'; } 
  else { dot.className = 'status-dot offline'; text.textContent = 'Sin conexión'; }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

function startExam() {
  const nameInput = document.getElementById('studentNameInput');
  const groupInput = document.getElementById('studentGroupInput');
  if (!nameInput.value.trim() || !groupInput.value.trim()) {
    alert("Por favor completa tu Nombre y Grupo antes de iniciar.");
    return;
  }
  studentName = nameInput.value.trim();
  studentGroup = groupInput.value.trim();

  document.getElementById('displayName').textContent = studentName;
  document.getElementById('displayGroup').textContent = studentGroup;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('examScreen').style.display = 'block';

  buildPalette();
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('qCounter').textContent = "Reactivo " + (currentIndex + 1) + " de " + questions.length;
  document.getElementById('qText').innerHTML = q.q;

  const imgContainer = document.getElementById('qImageContainer');
  if (q.img) {
    imgContainer.innerHTML = '<img src="' + q.img + '" alt="Figura del reactivo">';
    imgContainer.style.display = 'block';
  } else {
    imgContainer.innerHTML = '';
    imgContainer.style.display = 'none';
  }

  const optWrap = document.getElementById('qOptions');
  optWrap.innerHTML = '';
  q.opts.forEach((optText, i) => {
    const label = document.createElement('label');
    label.className = answers[currentIndex] === i ? 'selected' : '';
    label.innerHTML = '<input type="radio" name="opt" value="' + i + '" ' + (answers[currentIndex] === i ? 'checked' : '') + '><span><strong>' + letters[i] + ')</strong> ' + optText + '</span>';
    label.onclick = () => selectAnswer(i);
    optWrap.appendChild(label);
  });

  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === questions.length - 1 ? 'Último reactivo' : 'Siguiente ▶';
  document.getElementById('progressBar').style.width = Math.round((answers.filter(a => a !== null).length / questions.length) * 100) + '%';
  refreshPalette();
  
  if (window.MathJax) { MathJax.typesetPromise([document.getElementById('questionCard')]).catch((err) => console.log(err.message)); }
}

function selectAnswer(i) { answers[currentIndex] = i; renderQuestion(); }
function goNext() { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
function goPrev() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

function buildPalette() {
  const palette = document.getElementById('palette');
  palette.innerHTML = '';
  questions.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.textContent = i + 1;
    btn.onclick = () => { currentIndex = i; renderQuestion(); };
    btn.id = 'pal-' + i;
    palette.appendChild(btn);
  });
}

function refreshPalette() {
  questions.forEach((_, i) => {
    const btn = document.getElementById('pal-' + i);
    if(btn) {
      btn.classList.toggle('answered', answers[i] !== null);
      btn.classList.toggle('current', i === currentIndex);
    }
  });
}

function confirmSubmit() {
  const unanswered = answers.filter(a => a === null).length;
  if (confirm(unanswered > 0 ? "Tienes " + unanswered + " sin responder. ¿Finalizar?" : "¿Estás seguro de enviar tu evaluación?")) {
    finishExam();
  }
}

function finishExam() {
  if (finished) return;
  finished = true;

  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  let totalCorrect = 0;
  const reviewData = [];

  questions.forEach((q, i) => { 
    const userAns = answers[i];
    const isCorrect = userAns === q.correct;
    if (isCorrect) totalCorrect++; 
    reviewData.push({
      num: i + 1,
      text: q.q,
      opts: q.opts,
      correctIdx: q.correct,
      userIdx: userAns,
      isCorrect: isCorrect,
      exp: q.exp || ""
    });
  });
  
  const pct = ((totalCorrect / questions.length) * 100).toFixed(1);

  document.getElementById('resultDetails').innerHTML = "<strong>Materia:</strong> " + EXAM_MATERIA + "<br><strong>Tema:</strong> El fortalecimiento de la burguesía<br><strong>Alumno:</strong> " + studentName + " | <strong>Grupo:</strong> " + studentGroup;
  document.getElementById('scoreBig').textContent = totalCorrect + "/" + questions.length + " (" + pct + "%)";
  document.getElementById('scoreBig').classList.toggle('fail', pct < 60);

  window._reviewData = reviewData;
  renderReview();

  sendDataToGoogleSheets({
    fecha: new Date().toLocaleDateString(),
    materia: EXAM_MATERIA,
    tema: "El fortalecimiento de la burguesía",
    nombre: studentName,
    grupo: studentGroup,
    puntajeGeneral: totalCorrect + "/" + questions.length + " (" + pct + "%)"
  });
}

function renderReview() {
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  window._reviewData.forEach(r => {
    const div = document.createElement('div');
    let cls = r.userIdx === null ? 'blank' : (r.isCorrect ? 'correct' : 'incorrect');
    div.className = 'reviewItem ' + cls;

    const correctText = '<strong>' + letters[r.correctIdx] + ')</strong> ' + r.opts[r.correctIdx];
    const userText = r.userIdx !== null ? '<strong>' + letters[r.userIdx] + ')</strong> ' + r.opts[r.userIdx] : '';

    let answerLine = '';
    if (r.userIdx === null) {
      answerLine = '<div class="yourAns">No respondida. Respuesta correcta: <span class="correctAns">' + correctText + '</span></div>';
    } else if (r.isCorrect) {
      answerLine = '<div class="yourAns">Tu respuesta: <span class="correctAns">' + userText + '</span> ✔</div>';
    } else {
      answerLine = '<div class="yourAns">Tu respuesta: <span class="wrongAns">' + userText + '</span> ✘ <br><span style="display:inline-block; margin-top:4px;">Respuesta correcta: <span class="correctAns">' + correctText + '</span></span></div>';
    }

    const expHtml = r.exp ? '<div class="explanation-box"><strong>💡 Explicación:</strong> ' + r.exp + '</div>' : '';

    div.innerHTML = '<div class="tag">Reactivo ' + r.num + '</div><div style="font-weight:600; margin-top:4px;">' + r.text + '</div>' + answerLine + expHtml;
    list.appendChild(div);
  });
  if (window.MathJax) { MathJax.typesetPromise([list]).catch((err) => console.log(err.message)); }
}

function toggleReview() {
  const list = document.getElementById('reviewList');
  const btn = document.getElementById('reviewToggleBtn');
  const show = list.style.display === 'none';
  list.style.display = show ? 'block' : 'none';
  btn.textContent = show ? 'Ocultar revisión detallada' : '🔍 Ver revisión detallada y explicaciones';
}

function sendDataToGoogleSheets(payload) {
  const syncEl = document.getElementById('syncStatus');
  syncEl.textContent = "Sincronizando con Google Sheets...";

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    syncEl.className = "sync-status ok";
    syncEl.textContent = "Calificación enviada con éxito";
  })
  .catch(err => {
    syncEl.className = "sync-status err";
    syncEl.textContent = "⚠️ Error al registrar: " + err.message;
  });
}

function openReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }

function submitReport() {
  const comment = document.getElementById('reportComment').value.trim();
  if (!comment) { alert("Escribe tu observación antes de enviar."); return; }
  
  const sendBtn = document.getElementById('btnSendReport');
  sendBtn.disabled = true;
  sendBtn.textContent = "Enviando...";

  const payload = {
    tipo: "reporte_error",
    fecha: new Date().toLocaleDateString(),
    examen: EXAM_MATERIA + " — El fortalecimiento de la burguesía",
    nombre: studentName || "Anónimo",
    grupo: studentGroup || "Sin grupo",
    ubicacion: "Reactivo " + (currentIndex + 1),
    comentario: comment
  };

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    alert("✅ Reporte enviado con éxito.");
    closeReportModal();
  })
  .catch(err => {
    alert("⚠️ Error: " + err.message);
  })
  .finally(() => {
    sendBtn.disabled = false;
    sendBtn.textContent = "Enviar reporte";
  });
}
</script>
