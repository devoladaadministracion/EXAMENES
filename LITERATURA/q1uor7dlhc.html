<script>
const EXAM_MATERIA   = "Literatura";
const EXAM_TEMA      = "2.1 Géneros literarios (Énfasis UNAM) (Examen 6)";

const questions = [
  {
    "q": "1. ¿Cuál de las siguientes opciones relaciona correctamente los tres géneros literarios con sus características predominantes?",
    "opts": [
      "Épico: expresión subjetiva; lírico: representación escénica; dramático: narración de acontecimientos.",
      "Épico: representación escénica; lírico: narración de acontecimientos; dramático: expresión subjetiva.",
      "Épico: narración de acontecimientos; lírico: expresión subjetiva; dramático: representación de acciones mediante personajes.",
      "Épico: descripción científica; lírico: argumentación; dramático: exposición de acontecimientos."
    ],
    "correct": 2,
    "img": null,
    "exp": "El género épico relata acontecimientos mediante voz narrativa; el lírico expresa emociones mediante voz poética; el dramático presenta acciones mediante personajes[cite: 78]."
  },
  {
    "q": "2. ¿Qué subgénero narrativo se caracteriza por presentar una historia breve, generalmente concentrada en un conflicto principal y con un número limitado de personajes?",
    "opts": [
      "Cuento.",
      "Novela.",
      "Epopeya.",
      "Cantar de gesta."
    ],
    "correct": 0,
    "img": null,
    "exp": "El cuento es una narración relativamente breve concentrada en un conflicto central, distinguiéndose de la novela por su menor extensión[cite: 78]."
  },
  {
    "q": "3. ¿Cuál de las siguientes características corresponde principalmente a la novela?",
    "opts": [
      "Presenta exclusivamente acontecimientos heroicos mediante versos.",
      "Desarrolla una narración breve que culmina necesariamente con una moraleja.",
      "Expresa sentimientos mediante una voz poética y una estructura estrófica.",
      "Desarrolla una narración extensa con personajes, conflictos y acciones que pueden ser complejos."
    ],
    "correct": 3,
    "img": null,
    "exp": "La novela es una narración extensa en prosa que permite desarrollar diversos personajes, conflictos, ambientes y líneas argumentales[cite: 78, 79]."
  },
  {
    "q": "4. Lee el fragmento:<br><br><em>\"Un héroe emprende un largo viaje después de una guerra. Durante su regreso enfrenta criaturas extraordinarias, intervenciones divinas y numerosas pruebas...\".</em><br><br>¿A qué subgénero corresponde?",
    "opts": [
      "Leyenda.",
      "Epopeya.",
      "Fábula.",
      "Cuento."
    ],
    "correct": 1,
    "img": null,
    "exp": "La epopeya relata hazañas heroicas de importancia colectiva con elementos mitológicos o sobrenaturales (ej. La Odisea)[cite: 79]."
  },
  {
    "q": "5. ¿Cuál de las siguientes obras constituye un ejemplo representativo del cantar de gesta medieval?",
    "opts": [
      "Cantar de mio Cid.",
      "Edipo rey.",
      "La vida es sueño.",
      "La Celestina."
    ],
    "correct": 0,
    "img": null,
    "exp": "El Cantar de mio Cid es la obra épica medieval española por excelencia, que narra las hazañas de Rodrigo Díaz de Vivar[cite: 79, 80]."
  },
  {
    "q": "6. ¿Qué característica distingue principalmente a la fábula?",
    "opts": [
      "Presenta un conflicto trágico mediante diálogos escénicos.",
      "Expresa sentimientos amorosos en un ambiente pastoril.",
      "Narra una historia breve que transmite una enseñanza moral, frecuentemente mediante animales personificados.",
      "Relata extensamente las hazañas de héroes vinculados con una comunidad."
    ],
    "correct": 2,
    "img": null,
    "exp": "La fábula es una narración breve con animales personificados que transmite una enseñanza moral o moraleja[cite: 80]."
  },
  {
    "q": "7. Lee el fragmento:<br><br><em>\"Los habitantes de un pueblo cuentan que, durante las noches de luna llena, aparece una mujer vestida de blanco junto al antiguo puente...\".</em><br><br>¿Qué subgénero narrativo representa?",
    "opts": [
      "Mito.",
      "Epopeya.",
      "Fábula.",
      "Leyenda."
    ],
    "correct": 3,
    "img": null,
    "exp": "La leyenda combina elementos históricos, locales o reconocibles con acontecimientos extraordinarios o sobrenaturales de transmisión generacional[cite: 80]."
  },
  {
    "q": "8. ¿Cuál de las siguientes características corresponde principalmente al mito?",
    "opts": [
      "La narración de situaciones cotidianas con una finalidad humorística.",
      "La explicación simbólica del origen del mundo o de fenómenos mediante seres divinos o sobrenaturales.",
      "La representación teatral de conflictos familiares de carácter realista.",
      "La exposición de sentimientos personales mediante recursos poéticos."
    ],
    "correct": 1,
    "img": null,
    "exp": "El mito explica simbólicamente los orígenes del mundo o fenómenos naturales mediante la intervención de divinidades[cite: 81]."
  },
  {
    "q": "9. ¿Cuál de las siguientes opciones establece correctamente una diferencia entre mito y leyenda?",
    "opts": [
      "El mito suele explicar orígenes o fenómenos mediante relatos sagrados, mientras que la leyenda vincula acontecimientos extraordinarios con tradiciones, personajes o lugares reconocibles.",
      "El mito utiliza exclusivamente personajes humanos, mientras que la leyenda presenta únicamente dioses.",
      "El mito pertenece al género dramático, mientras que la leyenda corresponde al género lírico.",
      "El mito siempre contiene una moraleja explícita, mientras que la leyenda carece de elementos sobrenaturales."
    ],
    "correct": 0,
    "img": null,
    "exp": "El mito explica aspectos del mundo desde una perspectiva simbólica o sagrada, mientras la leyenda se arraiga en tradiciones y referentes histórico-geográficos locales[cite: 81]."
  },
  {
    "q": "10. ¿Qué subgénero lírico se caracteriza por expresar dolor, tristeza o lamentación ante una pérdida, especialmente la muerte de una persona?",

      "Oda.",
      "Égloga.",
      "Himno.",
      "Elegía."
    ],
    "correct": 3,
    "img": null,
    "exp": "La elegía es una composición lírica de tono lamentativo que expresa dolor ante una pérdida o fallecimiento[cite: 81, 82]."
  },
  {
    "q": "11. Lee el fragmento:<br><br><em>\"¡Oh, libertad, principio luminoso que inspira a los pueblos y fortalece la dignidad humana!\".</em><br><br>¿Con qué subgénero lírico se relaciona principalmente por su tono de exaltación?",

      "Elegía.",
      "Égloga.",
      "Oda.",
      "Epigrama."
    ],
    "correct": 2,
    "img": null,
    "exp": "La oda expresa admiración, exaltación o reflexión solemne sobre una persona, objeto, sentimiento o idea (como la libertad)[cite: 82]."
  },
  {
    "q": "12. ¿Cuál de las siguientes características corresponde a la égloga?",

      "Presenta una crítica humorística de las costumbres sociales.",
      "Expresa sentimientos, frecuentemente amorosos, mediante personajes pastoriles en un ambiente natural idealizado.",

      "Representa un conflicto grave que conduce a la desgracia del protagonista."
    ],
    "correct": 1,
    "img": null,
    "exp": "La égloga es una composición lírica de ambiente pastoril donde los pastores expresan reflexiones amorosas en una naturaleza idealizada[cite: 82, 83]."
  },
  {
    "q": "13. ¿Qué subgénero lírico se caracteriza por expresar solemnemente sentimientos de alabanza o exaltación hacia una divinidad, una patria o un ideal colectivo?",
    "opts": [
      "Himno.",
      "Madrigal.",
      "Elegía.",
      "Epigrama."
    ],
    "correct": 0,
    "img": null,
    "exp": "El himno expresa alabanza, celebración o exaltación solemne de carácter religioso, patriótico o colectivo[cite: 83]."
  },
  {
    "q": "14. ¿Cuál de las siguientes características corresponde al madrigal?",
    "opts": [
      "Presenta acontecimientos heroicos de importancia colectiva.",
      "Representa conflictos humanos mediante diálogos teatrales.",
      "Desarrolla una narración breve con una enseñanza moral.",
      "Expresa sentimientos delicados, frecuentemente amorosos, mediante una composición lírica generalmente breve."
    ],
    "correct": 3,
    "img": null,
    "exp": "El madrigal es una composición lírica breve, de tono delicado y temática generalmente amorosa[cite: 83]."
  },
  {
    "q": "15. Lee el fragmento:<br><br><em>\"Un poeta escribe una composición breve en la que ridiculiza la avaricia de un funcionario mediante expresiones irónicas y un final ingenioso\".</em><br><br>¿Qué forma poética se relaciona?",
    "opts": [
      "Himno.",
      "Égloga.",
      "Epigrama.",
      "Elegía."
    ],
    "correct": 2,
    "img": null,
    "exp": "El epigrama es una composición poética breve caracterizada por su agudeza, concisión y final ingenioso con tintes satíricos[cite: 83, 84]."

  {
    "q": "16. ¿Cuál de las siguientes afirmaciones sobre el soneto es correcta?",

  {

  {
    "q": "19. ¿Cuál de las siguientes características corresponde principalmente a la comedia?",

let currentIndex = 0, studentName = "", studentGroup = "", answers = new Array(questions.length).fill(null), finished = false;
const letters = ["A", "B", "C", "D"];

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("bannerImage").src = EXAM_BANNER;
  document.title = "Evaluación — " + EXAM_MATERIA;
  document.getElementById("examTitleHeading").textContent = "Examen de " + EXAM_MATERIA + " — Tema 2.1 (Énfasis UNAM)";
  document.getElementById("examDescription").innerHTML = "Evaluación de la materia de <strong>" + EXAM_MATERIA + "</strong> (Tema: <em>Géneros y subgéneros literarios</em>). Consta de <strong>" + questions.length + " reactivos</strong>.";
  document.getElementById("metaMateriaTema").textContent = EXAM_MATERIA + " · Tema 2.1 (UNAM)";
  document.getElementById("headerMateriaTema").textContent = EXAM_MATERIA;
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });

function updateOnlineStatus() {
  const dot = document.getElementById('netDot'), text = document.getElementById('netText');
  if (navigator.onLine) { dot.className = 'status-dot'; text.textContent = 'Conectado'; } 
  else { dot.className = 'status-dot offline'; text.textContent = 'Sin conexión'; }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

function startExam() {
  const n = document.getElementById('studentNameInput'), g = document.getElementById('studentGroupInput');
  if (!n.value.trim() || !g.value.trim()) { alert("Por favor completa tu Nombre y Grupo."); return; }
  studentName = n.value.trim(); studentGroup = g.value.trim();
  document.getElementById('displayName').textContent = studentName;
  document.getElementById('displayGroup').textContent = studentGroup;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('examScreen').style.display = 'block';
  buildPalette(); renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('qCounter').textContent = "Reactivo " + (currentIndex + 1) + " de " + questions.length;
  document.getElementById('qText').innerHTML = q.q;
  const optWrap = document.getElementById('qOptions'); optWrap.innerHTML = '';
  q.opts.forEach((optText, i) => {
    const label = document.createElement('label');
    label.className = answers[currentIndex] === i ? 'selected' : '';
    label.innerHTML = '<input type="radio" name="opt" value="' + i + '" ' + (answers[currentIndex] === i ? 'checked' : '') + '><span><strong>' + letters[i] + ')</strong> ' + optText + '</span>';
    label.onclick = () => selectAnswer(i);
    optWrap.appendChild(label);
  });
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === questions.length - 1 ? 'Último reactivo' : 'Siguiente ▶';
  document.getElementById('progressBar').style.width = Math.round((answers.filter(a => a !== null).length / questions.length) * 100) + '%';
  refreshPalette();
  if (window.MathJax) MathJax.typesetPromise([document.getElementById('questionCard')]).catch(err => {});
}

function selectAnswer(i) { answers[currentIndex] = i; renderQuestion(); }
function goNext() { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
function goPrev() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }
function buildPalette() {
  const palette = document.getElementById('palette'); palette.innerHTML = '';
  questions.forEach((q, i) => {
    const btn = document.createElement('button'); btn.textContent = i + 1;
    btn.onclick = () => { currentIndex = i; renderQuestion(); };
    btn.id = 'pal-' + i; palette.appendChild(btn);
  });
}
function refreshPalette() {
  questions.forEach((_, i) => {
    const btn = document.getElementById('pal-' + i);
    if(btn) { btn.classList.toggle('answered', answers[i] !== null); btn.classList.toggle('current', i === currentIndex); }
  });
}
function confirmSubmit() {
  const unas = answers.filter(a => a === null).length;
  if (confirm(unas > 0 ? "Tienes " + unas + " sin responder. ¿Finalizar?" : "¿Estás seguro de enviar tu evaluación?")) finishExam();
}
function finishExam() {
  if (finished) return; finished = true;
  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  let totalCorrect = 0, reviewData = [];
  questions.forEach((q, i) => {
    const userAns = answers[i], isCorrect = userAns === q.correct;
    if (isCorrect) totalCorrect++;
    reviewData.push({ num: i + 1, text: q.q, opts: q.opts, correctIdx: q.correct, userIdx: userAns, isCorrect: isCorrect, exp: q.exp || "" });
  });
  const pct = ((totalCorrect / questions.length) * 100).toFixed(1);
  document.getElementById('resultDetails').innerHTML = "<strong>Materia:</strong> " + EXAM_MATERIA + "<br><strong>Tema:</strong> Géneros literarios (Énfasis UNAM)<br><strong>Alumno:</strong> " + studentName + " | <strong>Grupo:</strong> " + studentGroup;
  document.getElementById('scoreBig').textContent = totalCorrect + "/" + questions.length + " (" + pct + "%)";
  document.getElementById('scoreBig').classList.toggle('fail', pct < 60);
  window._reviewData = reviewData; renderReview();
  sendDataToGoogleSheets({ fecha: new Date().toLocaleDateString(), materia: EXAM_MATERIA, tema: "Géneros literarios (Énfasis UNAM)", nombre: studentName, grupo: studentGroup, puntajeGeneral: totalCorrect + "/" + questions.length + " (" + pct + "%)" });
}
function renderReview() {
  const list = document.getElementById('reviewList'); list.innerHTML = '';
  window._reviewData.forEach(r => {
    const div = document.createElement('div');
    let cls = r.userIdx === null ? 'blank' : (r.isCorrect ? 'correct' : 'incorrect');
    div.className = 'reviewItem ' + cls;
    const correctText = '<strong>' + letters[r.correctIdx] + ')</strong> ' + r.opts[r.correctIdx];
    const userText = r.userIdx !== null ? '<strong>' + letters[r.userIdx] + ')</strong> ' + r.opts[r.userIdx] : '';
    let answerLine = '';
    if (r.userIdx === null) answerLine = '<div class="yourAns">No respondida. Correcta: <span class="correctAns">' + correctText + '</span></div>';
    else if (r.isCorrect) answerLine = '<div class="yourAns">Tu respuesta: <span class="correctAns">' + userText + '</span> ✔</div>';
    else answerLine = '<div class="yourAns">Tu respuesta: <span class="wrongAns">' + userText + '</span> ✘ <br>Correcta: <span class="correctAns">' + correctText + '</span></div>';
    div.innerHTML = '<div class="tag">Reactivo ' + r.num + '</div><div style="font-weight:600; margin-top:4px;">' + r.text + '</div>' + answerLine + (r.exp ? '<div class="explanation-box"><strong>💡 Explicación:</strong> ' + r.exp + '</div>' : '');
    list.appendChild(div);
  });
  if (window.MathJax) MathJax.typesetPromise([list]).catch(err => {});
}
function toggleReview() {
  const list = document.getElementById('reviewList'), btn = document.getElementById('reviewToggleBtn'), show = list.style.display === 'none';
  list.style.display = show ? 'block' : 'none'; btn.textContent = show ? 'Ocultar revisión' : '🔍 Ver revisión detallada y explicaciones';
}
function sendDataToGoogleSheets(payload) {
  const syncEl = document.getElementById('syncStatus');
  syncEl.textContent = "Sincronizando con Google Sheets...";
  fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
  .then(() => { syncEl.className = "sync-status ok"; syncEl.textContent = "Calificación enviada con éxito"; })
  .catch(err => { syncEl.className = "sync-status err"; syncEl.textContent = "⚠️ Error al registrar: " + err.message; });
}
