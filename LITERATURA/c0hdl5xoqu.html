<script>
const EXAM_MATERIA   = "Literatura";
const EXAM_TEMA      = "1.4 El texto dramático (Examen 3)";
const EXAM_BANNER    = "https://lh3.googleusercontent.com/d/1SCjanIDihhIZxj9rdLamZpYyoomgaQNE";
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwlME2gtQ4nJ_BVeB1_FsvaQa1zG8kH8Kph4wmgaNwfB354QKGcd_MDrATEiIs2CQ/exec";

const questions = [
  {
    "q": "1. ¿Cuál es la característica fundamental que distingue al texto dramático de otros géneros literarios?",
    "opts": [
      "La narración de acontecimientos mediante un narrador omnisciente.",
      "La expresión de sentimientos mediante un hablante lírico.",
      "La presentación de una acción mediante los diálogos y las actuaciones de los personajes.",
      "La descripción objetiva de acontecimientos históricos."
    ],
    "correct": 2,
    "img": null,
    "exp": "El texto dramático presenta una acción que se desarrolla principalmente mediante los diálogos y las actuaciones de los personajes[cite: 50]. Está concebido para su representación escénica."
  },
  {
    "q": "2. Lee el siguiente fragmento:<br><br>ELENA: ¿Por qué no me dijiste la verdad?<br>MARCOS: Porque sabía que intentarías detenerme.<br>ELENA: Ahora tendremos que enfrentar las consecuencias.<br><br>¿Qué forma de organización textual predomina?",
    "opts": [
      "Dialógica.",
      "Narrativa.",
      "Descriptiva.",
      "Expositiva."
    ],
    "correct": 0,
    "img": null,
    "exp": "La organización dialógica se caracteriza por la alternancia de intervenciones entre dos o más personajes[cite: 50]. A través de sus parlamentos se desarrolla la acción dramática."
  },
  {
    "q": "3. ¿Cuál es la función principal de las acotaciones en un texto dramático?",
    "opts": [
      "Presentar las reflexiones personales del autor sobre el conflicto.",
      "Explicar al lector el significado simbólico de cada personaje.",
      "Sustituir los diálogos mediante descripciones narrativas extensas.",
      "Proporcionar indicaciones sobre movimientos, gestos, escenarios o formas de expresión."
    ],
    "correct": 3,
    "img": null,
    "exp": "Las acotaciones son indicaciones del dramaturgo relacionadas con la representación escénica (movimientos, gestos, tonos, iluminación, escenografía)[cite: 50, 51]."
  },
  {
    "q": "4. En la estructura de una obra dramática, ¿qué elemento constituye el conflicto central que enfrenta a los personajes y genera tensión?",
    "opts": [
      "Desenlace.",
      "Nudo.",
      "Acotación.",
      "Exposición."
    ],
    "correct": 1,
    "img": null,
    "exp": "El nudo corresponde a la fase en la que el conflicto dramático se desarrolla y se complica, intensificando la acción hacia el desenlace[cite: 51]."
  },
  {
    "q": "5. Lee el siguiente fragmento:<br><br><em>\"Al regresar a su pueblo, Andrés descubre que las tierras de su familia han sido vendidas sin su consentimiento. Decide enfrentarse a su hermano, quien realizó la operación\".</em><br><br>¿Qué elemento de la acción dramática se presenta principalmente?",
    "opts": [
      "El surgimiento del conflicto que impulsará el desarrollo de la acción.",
      "La resolución definitiva del enfrentamiento familiar.",
      "La conclusión de las consecuencias del conflicto.",
      "La restauración del equilibrio entre los personajes."
    ],
    "correct": 0,
    "img": null,
    "exp": "El descubrimiento de la venta y la decisión de enfrentar al hermano establecen el conflicto que impulsará la acción, introduciendo tensión sin resolver[cite: 51]."
  },
  {
    "q": "6. ¿Cuál de las siguientes situaciones corresponde al desenlace de una obra dramática?",
    "opts": [
      "Se presentan los personajes y el lugar donde ocurrirá la acción.",
      "Aparece una circunstancia que altera la situación inicial.",
      "El conflicto principal alcanza una resolución y se conocen sus consecuencias.",
      "Las dificultades de los personajes aumentan progresivamente."
    ],
    "correct": 2,
    "img": null,
    "exp": "El desenlace es la parte final de la estructura dramática en la que se resuelve el conflicto principal[cite: 51, 52]."
  },
  {
    "q": "7. Lee el siguiente fragmento:<br><br>SOFÍA: (Retrocede lentamente hacia la puerta). No pienso quedarme aquí.<br>DANIEL: (Se interpone en his camino). Antes tendrás que escucharme.<br><br>¿Cuál es la función de las expresiones entre paréntesis?",
    "opts": [
      "Introducir comentarios de un narrador omnisciente.",
      "Presentar pensamientos que los personajes expresan al público.",
      "Establecer una división entre actos y escenas.",
      "Indicar acciones físicas que acompañan los parlamentos."
    ],
    "correct": 3,
    "img": null,
    "exp": "Las expresiones entre paréntesis son acotaciones que describen movimientos y acciones físicas de los personajes para orientar su representación escénica[cite: 52]."
  },
  {
    "q": "8. En una obra dramática, ¿qué personaje concentra generalmente la acción principal y enfrenta el conflicto central?",
    "opts": [
      "Personaje incidental.",
      "Protagonista.",
      "Personaje secundario.",
      "Personaje colectivo."
    ],
    "correct": 1,
    "img": null,
    "exp": "El protagonista es el personaje alrededor del cual se articula principalmente la acción dramática y sus objetivos determinan el desarrollo[cite: 52]."
  },
  {
    "q": "9. Lee el siguiente fragmento:<br><br><em>\"Claudio desea recuperar el gobierno de su ciudad, pero su antiguo aliado utiliza todos los recursos disponibles para impedirlo\".</em><br><br>¿Qué función desempeña el antiguo aliado dentro del conflicto?",
    "opts": [
      "Antagonista.",
      "Protagonista.",
      "Confidente.",
      "Personaje incidental."
    ],
    "correct": 0,
    "img": null,
    "exp": "El antagonista es el personaje o fuerza que se opone a los objetivos del protagonista[cite: 52, 53]."
  },
  {
    "q": "10. ¿Cuál de las siguientes características corresponde a un personaje secundario en una obra dramática?",
    "opts": [
      "Carece de relación con el conflicto y no participa en la acción.",
      "Se opone necesariamente a los objetivos del protagonista.",
      "Interviene únicamente mediante indicaciones escénicas.",
      "Participa en la acción y contribuye al desarrollo del conflicto sin ocupar el papel central."
    ],
    "correct": 3,
    "img": null,
    "exp": "Los personajes secundarios acompañan, ayudan, dificultan o complementan al protagonista sin constituir el eje central de la obra[cite: 53]."
  },
  {
    "q": "11. ¿Cuál de las siguientes características es propia de la tragedia clásica?",
    "opts": [
      "La presentación de conflictos cotidianos que terminan siempre favorablemente.",
      "La utilización del humor como recurso principal para resolver los problemas.",
      "El desarrollo de un conflicto grave que conduce al sufrimiento o la desgracia del protagonista.",
      "La representación de situaciones absurdas sin consecuencias para los personajes."
    ],
    "correct": 2,
    "img": null,
    "exp": "La tragedia clásica presenta conflictos graves sobre el destino, el deber o las pasiones, conduciendo a consecuencias dolorosas e irreversibles[cite: 53]."
  },
  {
    "q": "12. En la tragedia griega, ¿qué concepto se relaciona con el efecto de purificación o clarificación emocional que experimenta el espectador mediante el temor y la compasión?",
    "opts": [
      "Peripecia.",
      "Catarsis.",
      "Anagnórisis.",
      "Hamartía."
    ],
    "correct": 1,
    "img": null,
    "exp": "La catarsis es el efecto de purificación emocional que produce la representación trágica en el espectador mediante la compasión y el temor[cite: 53, 54]."
  },
  {
    "q": "13. Lee el fragmento:<br><br><em>\"Un gobernante intenta evitar una profecía que anuncia su desgracia. Sin embargo, las decisiones que toma para escapar de ella contribuyen a que finalmente se cumpla\".</em><br><br>¿Qué característica de la tragedia se manifiesta?",
    "opts": [
      "La resolución humorística de un conflicto político.",
      "La crítica de las costumbres mediante personajes caricaturescos.",
      "La reconciliación de los personajes después de un malentendido.",
      "La intervención del destino como fuerza vinculada con la desgracia del protagonista."
    ],
    "correct": 3,
    "img": null,
    "exp": "En la tragedia clásica, el destino obra como una fuerza ineludible; los intentos por evadirlo suelen propiciar paradójicamente su cumplimiento[cite: 54]."
  },
  {
    "q": "14. ¿Cuál de las siguientes obras pertenece al género trágico?",
    "opts": [
      "Edipo rey, de Sófocles.",
      "Las nubes, de Aristófanes.",
      "El avaro, de Molière.",
      "La comedia de las equivocaciones, de William Shakespeare."
    ],
    "correct": 0,
    "img": null,
    "exp": "Edipo rey es una tragedia de Sófocles; las demás opciones son obras cómicas[cite: 54]."
  },
  {
    "q": "15. ¿Cuál es una característica distintiva de la comedia como género dramático?",
    "opts": [
      "La presencia obligatoria de acontecimientos sobrenaturales.",
      "La muerte inevitable del protagonista como resolución del conflicto.",
      "La representación humorística de situaciones humanas y conflictos sociales.",
      "La ausencia de conflictos entre los personajes."
    ],
    "correct": 2,
    "img": null,
    "exp": "La comedia representa situaciones y comportamientos humanos con recursos humorísticos, criticando frecuentemente las costumbres y defectos sociales[cite: 54, 55]."
  },
  {
    "q": "16. Lee el fragmento:<br><br><em>\"Un hombre presume constantemente de su inteligencia, pero sus intentos por engañar a los demás terminan exponiendo su propia ingenuidad ante todos\".</em><br><br>¿Qué recurso de la comedia se identifica?",
    "opts": [
      "El cumplimiento inevitable de una profecía.",
      "La ridiculización de un defecto humano.",
      "El enfrentamiento solemne con una fuerza divina.",
      "La representación de un sacrificio heroico."
    ],
    "correct": 1,
    "img": null,
    "exp": "La comedia utiliza la ridiculización de defectos (vanidad, presunción, avaricia) para generar comicidad[cite: 55]."
  },
  {
    "q": "17. ¿Cuál de las siguientes afirmaciones establece correctamente una diferencia general entre tragedia y comedia?",
    "opts": [
      "La tragedia desarrolla conflictos graves y dolorosos, mientras la comedia recurre al humor para representar conflictos humanos.",
      "La tragedia utiliza exclusivamente diálogos y la comedia únicamente narraciones.",
      "La tragedia presenta personajes principales y la comedia carece de protagonistas.",
      "La tragedia siempre representa hechos históricos y la comedia sucesos fantásticos."
    ],
    "correct": 0,
    "img": null,
    "exp": "La tragedia destaca por la gravedad y dolor de sus consecuencias, mientras que la comedia se basa en el humor y la crítica social[cite: 55]."
  },
  {
    "q": "18. Lee el diálogo:<br><br>MARTA: ¡Has perdido nuevamente las llaves!<br>LUIS: No las perdí. Las guardé en un lugar tan seguro que ahora nadie puede encontrarlas.<br><br>¿Qué recurso humorístico predomina?",
    "opts": [
      "La intervención de un destino inevitable.",
      "La evocación de acontecimientos trágicos.",
      "La revelación solemne de una identidad oculta.",
      "La ironía derivada de una contradicción entre la intención y el resultado."
    ],
    "correct": 3,
    "img": null,
    "exp": "El humor surge de la contradicción irónica entre la intención de guardar las llaves de forma segura y el resultado de no poder localizarlas[cite: 55, 56]."
  },
  {
    "q": "19. En la estructura externa de una obra dramática, ¿qué elemento suele señalar un cambio en la configuración de los personajes presentes en el escenario?",
    "opts": [
      "El desenlace.",
      "La escena.",
      "El conflicto.",
      "El argumento."

let currentIndex = 0, studentName = "", studentGroup = "", answers = new Array(questions.length).fill(null), finished = false;
const letters = ["A", "B", "C", "D"];

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("bannerImage").src = EXAM_BANNER;
  document.title = "Evaluación — " + EXAM_MATERIA;
  document.getElementById("examTitleHeading").textContent = "Examen de " + EXAM_MATERIA + " — Tema 1.4";
  document.getElementById("examDescription").innerHTML = "Evaluación de la materia de <strong>" + EXAM_MATERIA + "</strong> (Tema: <em>El texto dramático</em>). Consta de <strong>" + questions.length + " reactivos</strong>.";
  document.getElementById("metaMateriaTema").textContent = EXAM_MATERIA + " · Tema 1.4";
  document.getElementById("headerMateriaTema").textContent = EXAM_MATERIA;
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });

function updateOnlineStatus() {
  const dot = document.getElementById('netDot'), text = document.getElementById('netText');
  if (navigator.onLine) { dot.className = 'status-dot'; text.textContent = 'Conectado'; } 
  else { dot.className = 'status-dot offline'; text.textContent = 'Sin conexión'; }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

function startExam() {
  const n = document.getElementById('studentNameInput'), g = document.getElementById('studentGroupInput');
  if (!n.value.trim() || !g.value.trim()) { alert("Por favor completa tu Nombre y Grupo."); return; }
  studentName = n.value.trim(); studentGroup = g.value.trim();
  document.getElementById('displayName').textContent = studentName;
  document.getElementById('displayGroup').textContent = studentGroup;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('examScreen').style.display = 'block';
  buildPalette(); renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('qCounter').textContent = "Reactivo " + (currentIndex + 1) + " de " + questions.length;
  document.getElementById('qText').innerHTML = q.q;
  const optWrap = document.getElementById('qOptions'); optWrap.innerHTML = '';
  q.opts.forEach((optText, i) => {
    const label = document.createElement('label');
    label.className = answers[currentIndex] === i ? 'selected' : '';
    label.innerHTML = '<input type="radio" name="opt" value="' + i + '" ' + (answers[currentIndex] === i ? 'checked' : '') + '><span><strong>' + letters[i] + ')</strong> ' + optText + '</span>';
    label.onclick = () => selectAnswer(i);
    optWrap.appendChild(label);
  });
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === questions.length - 1 ? 'Último reactivo' : 'Siguiente ▶';
  document.getElementById('progressBar').style.width = Math.round((answers.filter(a => a !== null).length / questions.length) * 100) + '%';
  refreshPalette();
  if (window.MathJax) MathJax.typesetPromise([document.getElementById('questionCard')]).catch(err => {});
}

function selectAnswer(i) { answers[currentIndex] = i; renderQuestion(); }
function goNext() { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
function goPrev() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }
function buildPalette() {
  const palette = document.getElementById('palette'); palette.innerHTML = '';
  questions.forEach((q, i) => {
    const btn = document.createElement('button'); btn.textContent = i + 1;
    btn.onclick = () => { currentIndex = i; renderQuestion(); };
    btn.id = 'pal-' + i; palette.appendChild(btn);
  });
}
function refreshPalette() {
  questions.forEach((_, i) => {
    const btn = document.getElementById('pal-' + i);
    if(btn) { btn.classList.toggle('answered', answers[i] !== null); btn.classList.toggle('current', i === currentIndex); }
  });
}
function confirmSubmit() {
  const unas = answers.filter(a => a === null).length;
  if (confirm(unas > 0 ? "Tienes " + unas + " sin responder. ¿Finalizar?" : "¿Estás seguro de enviar tu evaluación?")) finishExam();
}
function finishExam() {
  if (finished) return; finished = true;
  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  let totalCorrect = 0, reviewData = [];
  questions.forEach((q, i) => {
    const userAns = answers[i], isCorrect = userAns === q.correct;
    if (isCorrect) totalCorrect++;
    reviewData.push({ num: i + 1, text: q.q, opts: q.opts, correctIdx: q.correct, userIdx: userAns, isCorrect: isCorrect, exp: q.exp || "" });
  });
  const pct = ((totalCorrect / questions.length) * 100).toFixed(1);
  document.getElementById('resultDetails').innerHTML = "<strong>Materia:</strong> " + EXAM_MATERIA + "<br><strong>Tema:</strong> El texto dramático<br><strong>Alumno:</strong> " + studentName + " | <strong>Grupo:</strong> " + studentGroup;
  document.getElementById('scoreBig').textContent = totalCorrect + "/" + questions.length + " (" + pct + "%)";
  document.getElementById('scoreBig').classList.toggle('fail', pct < 60);
  window._reviewData = reviewData; renderReview();
  sendDataToGoogleSheets({ fecha: new Date().toLocaleDateString(), materia: EXAM_MATERIA, tema: "El texto dramático", nombre: studentName, grupo: studentGroup, puntajeGeneral: totalCorrect + "/" + questions.length + " (" + pct + "%)" });
}
function renderReview() {
  const list = document.getElementById('reviewList'); list.innerHTML = '';
  window._reviewData.forEach(r => {
    const div = document.createElement('div');
    let cls = r.userIdx === null ? 'blank' : (r.isCorrect ? 'correct' : 'incorrect');
    div.className = 'reviewItem ' + cls;
    const correctText = '<strong>' + letters[r.correctIdx] + ')</strong> ' + r.opts[r.correctIdx];
    const userText = r.userIdx !== null ? '<strong>' + letters[r.userIdx] + ')</strong> ' + r.opts[r.userIdx] : '';
    let answerLine = '';
    if (r.userIdx === null) answerLine = '<div class="yourAns">No respondida. Correcta: <span class="correctAns">' + correctText + '</span></div>';
    else if (r.isCorrect) answerLine = '<div class="yourAns">Tu respuesta: <span class="correctAns">' + userText + '</span> ✔</div>';
    else answerLine = '<div class="yourAns">Tu respuesta: <span class="wrongAns">' + userText + '</span> ✘ <br>Correcta: <span class="correctAns">' + correctText + '</span></div>';
    div.innerHTML = '<div class="tag">Reactivo ' + r.num + '</div><div style="font-weight:600; margin-top:4px;">' + r.text + '</div>' + answerLine + (r.exp ? '<div class="explanation-box"><strong>💡 Explicación:</strong> ' + r.exp + '</div>' : '');
    list.appendChild(div);
  });
  if (window.MathJax) MathJax.typesetPromise([list]).catch(err => {});
}
function toggleReview() {
  const list = document.getElementById('reviewList'), btn = document.getElementById('reviewToggleBtn'), show = list.style.display === 'none';
  list.style.display = show ? 'block' : 'none'; btn.textContent = show ? 'Ocultar revisión' : '🔍 Ver revisión detallada y explicaciones';
}
function sendDataToGoogleSheets(payload) {
  const syncEl = document.getElementById('syncStatus');
  syncEl.textContent = "Sincronizando con Google Sheets...";
  fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
  .then(() => { syncEl.className = "sync-status ok"; syncEl.textContent = "Calificación enviada con éxito"; })
  .catch(err => { syncEl.className = "sync-status err"; syncEl.textContent = "⚠️ Error al registrar: " + err.message; });
}
function openReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }
function submitReport() {
  const comment = document.getElementById('reportComment').value.trim();
  if (!comment) { alert("Escribe tu observación."); return; }
  const btn = document.getElementById('btnSendReport'); btn.disabled = true; btn.textContent = "Enviando...";
  fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ tipo: "reporte_error", fecha: new Date().toLocaleDateString(), examen: EXAM_MATERIA + " — El texto dramático", nombre: studentName || "Anónimo", grupo: studentGroup || "Sin grupo", ubicacion: "Reactivo " + (currentIndex + 1), comentario: comment }) })
  .then(() => { alert("✅ Reporte enviado."); closeReportModal(); })
  .catch(err => { alert("⚠️ Error: " + err.message); })
  .finally(() => { btn.disabled = false; btn.textContent = "Enviar reporte"; });
}
</script>
