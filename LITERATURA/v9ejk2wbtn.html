<script>
const EXAM_MATERIA   = "Literatura";
const EXAM_TEMA      = "1.5 El texto poético (Examen 4)";
const EXAM_BANNER    = "https://lh3.googleusercontent.com/d/1SCjanIDihhIZxj9rdLamZpYyoomgaQNE";
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwlME2gtQ4nJ_BVeB1_FsvaQa1zG8kH8Kph4wmgaNwfB354QKGcd_MDrATEiIs2CQ/exec";

const questions = [
  {
    "q": "1. ¿Cuál de las siguientes características distingue principalmente al texto poético?",
    "opts": [
      "La exposición objetiva de acontecimientos verificables.",
      "La presentación de conflictos mediante diálogos escénicos.",
      "La organización cronológica de acontecimientos narrados.",
      "El uso expresivo del lenguaje para producir significados y efectos estéticos."
    ],
    "correct": 3,
    "img": null,
    "exp": "El texto poético se caracteriza por el empleo expresivo del lenguaje mediante recursos como imágenes, ritmo, musicalidad y figuras retóricas[cite: 60]."
  },
  {
    "q": "2. En el análisis de un poema, ¿qué se entiende por verso?",
    "opts": [
      "Cada línea que integra la composición poética.",
      "El conjunto de composiciones que forman un poemario.",
      "La repetición de sonidos al final de dos estrofas.",
      "La división temática entre las partes de un poema."
    ],
    "correct": 0,
    "img": null,
    "exp": "El verso es una unidad de la composición poética que suele disponerse en una línea y cuenta con medida silábica y ritmo[cite: 60]."
  },
  {
    "q": "3. ¿Cuál de las siguientes opciones define correctamente una estrofa?",
    "opts": [
      "La coincidencia de sonidos al final de varios versos.",
      "La repetición de una misma estructura sintáctica.",
      "La agrupación de versos dentro de una composición poética.",
      "La cantidad de sílabas métricas que contiene un poema."
    ],
    "correct": 2,
    "img": null,
    "exp": "La estrofa es la agrupación de versos que constituye una unidad formal dentro del poema[cite: 60, 61]."
  },
  {
    "q": "4. ¿Qué aspecto estudia principalmente el análisis intratextual de un poema?",
    "opts": [
      "Las circunstancias políticas que rodearon al autor.",
      "Los elementos formales y de significado presentes en el propio poema.",
      "Las características biográficas del escritor y su familia.",
      "La recepción de la obra por parte de sus contemporáneos."
    ],
    "correct": 1,
    "img": null,
    "exp": "El análisis intratextual examina los elementos internos de la composición, como metro, rima, ritmo, figuras retóricas y significado[cite: 61]."
  },
  {
    "q": "5. ¿Cuántas sílabas métricas tiene el siguiente verso?<br><br><em>\"La luna brilla en el cielo\".</em>",
    "opts": [
      "7",
      "9",
      "10",
      "8"
    ],
    "correct": 3,
    "img": null,
    "exp": "La separación gramatical es: La /lu-na/bri-lla/en/el/cie-lo (9 sílabas). Se forma una sinalefa entre «brilla» y «en», resultando en 8 sílabas métricas (palabra final grave)[cite: 61]."
  },
  {
    "q": "6. ¿Cuál es el nombre del fenómeno métrico que consiste en unir en una sola sílaba las vocales finales e iniciales de palabras consecutivas?",
    "opts": [
      "Sinalefa.",
      "Diéresis.",
      "Sinéresis.",
      "Hiato."
    ],
    "correct": 0,
    "img": null,
    "exp": "La sinalefa une la vocal final de una palabra con la vocal inicial de la siguiente para contarlas como una sola sílaba métrica[cite: 61]."
  },
  {
    "q": "7. ¿Cuántas sílabas métricas tiene el siguiente verso?<br><br><em>\"Mi corazón canta feliz\".</em>",
    "opts": [
      "7",
      "8",
      "9",
      "10"
    ],
    "correct": 2,
    "img": null,
    "exp": "La separación gramatical da 8 sílabas, pero al terminar en palabra aguda («feliz»), se añade una sílaba métrica, sumando 9[cite: 61, 62]."
  },
  {
    "q": "8. En la métrica española, ¿qué sucede cuando un verso termina en una palabra esdrújula?",
    "opts": [
      "Se añade una sílaba al cómputo métrico.",
      "Se resta una sílaba al cómputo métrico.",
      "Se duplican las sílabas de la última palabra.",
      "Se conserva siempre el número de sílabas gramaticales."
    ],
    "correct": 1,
    "img": null,
    "exp": "Si el verso termina en palabra esdrújula, se resta una sílaba al cómputo métrico total[cite: 62]."
  },
  {
    "q": "9. ¿Cuál de los siguientes versos es octosílabo, considerando las reglas métricas habituales?",
    "opts": [
      "\"La noche cubre los campos\".",
      "\"El sol ilumina la montaña\".",
      "\"Los pájaros cantan alegremente\".",
      "\"La primavera despierta los jardines\"."
    ],
    "correct": 0,
    "img": null,
    "exp": "El verso «La noche cubre los campos» se divide en La / no-che/cu-bre/los/cam-pos, sumando 8 sílabas métricas exactas al terminar en palabra grave[cite: 62]."
  },
  {
    "q": "10. ¿Cuál es la característica de la rima consonante?",
    "opts": [
      "Coinciden únicamente las vocales finales de los versos.",
      "Se repite una palabra completa al inicio de cada verso.",
      "Los versos mantienen la misma cantidad de sílabas métricas.",
      "Coinciden vocales y consonantes desde la última vocal acentuada."
    ],
    "correct": 3,
    "img": null,
    "exp": "La rima consonante se produce cuando coinciden todos los sonidos (vocales y consonantes) a partir de la última vocal acentuada[cite: 62, 63]."
  },
  {
    "q": "11. ¿Qué tipo de rima presentan las palabras \"camino\" y \"destino\" al final de dos versos?",
    "opts": [
      "Asonante.",
      "Libre.",
      "Consonante.",
      "Blanca."
    ],
    "correct": 2,
    "img": null,
    "exp": "Coinciden en todos los sonidos desde la última vocal acentuada («-ino»), por lo que es rima consonante[cite: 63]."
  },
  {
    "q": "12. Lee las siguientes terminaciones de dos versos: «casa» y «rama». ¿Qué tipo de rima presentan?",
    "opts": [
      "Consonante.",
      "Asonante.",
      "Encadenada.",
      "Gemela."
    ],
    "correct": 1,
    "img": null,
    "exp": "Coinciden únicamente en las vocales «a-a» a partir de la última vocal acentuada, presentando rima asonante[cite: 63]."
  },
  {
    "q": "13. Observa los versos:<br><em>\"La tarde se viste de oro,<br>el viento comienza a cantar,<br>las hojas parecen un tesoro,<br>y el río se pierde en el mar\".</em><br>¿Cuál es el esquema de rima consonante?",
    "opts": [
      "ABBA.",
      "AABB.",
      "AAAA.",
      "ABAB."
    ],
    "correct": 3,
    "img": null,
    "exp": "«Oro» rima con «tesoro» (A), y «cantar» rima con «mar» (B), distribuyéndose de forma alternada (ABAB)[cite: 63, 64]."
  },
  {
    "q": "14. En una composición poética, ¿qué caracteriza a los versos blancos?",
    "opts": [
      "Mantienen una medida métrica, pero carecen de rima.",
      "Presentan rima asonante en todos los versos.",
      "Carecen necesariamente de ritmo y de medida silábica.",
      "Presentan una distribución irregular de estrofas y rimas."
    ],
    "correct": 0,
    "img": null,
    "exp": "Los versos blancos poseen medida métrica regular, pero carecen de rima, a diferencia del verso libre[cite: 64]."
  },
  {
    "q": "15. ¿Cuál de los siguientes elementos contribuye principalmente a la construcción del ritmo poético?",
    "opts": [
      "La fecha en que fue escrita la composición.",
      "La cantidad de personajes mencionados en el poema.",
      "La distribución de acentos, pausas y repeticiones sonoras.",
      "La información biográfica proporcionada por el autor."
    ],
    "correct": 2,
    "img": null,
    "exp": "El ritmo poético surge de la organización interna de acentos, pausas, repeticiones y patrones sonoros[cite: 64]."
  },
  {
    "q": "16. Lee los versos:<br><em>\"Corre el río, corre el viento,<br>corre el tiempo sin cesar\".</em><br>¿Qué recurso contribuye especialmente al ritmo?",
    "opts": [
      "La comparación entre elementos naturales.",
      "La repetición de la palabra \"corre\".",
      "La eliminación de las pausas sintácticas.",
      "La ausencia de acentos en las palabras."
    ],
    "correct": 1,
    "img": null,
    "exp": "La repetición de «corre» (anáfora) genera un patrón rítmico dinámico y refuerza la sensación de movimiento[cite: 64, 65]."
  },
  {
    "q": "17. Lee el siguiente verso:<br><br><em>\"Tus ojos son dos luceros\".</em><br><br>¿Qué figura retórica predomina?",
    "opts": [
      "Metáfora.",
      "Hipérbole.",
      "Hipérbaton.",
      "Onomatopeya."
    ],
    "correct": 0,
    "img": null,
    "exp": "La metáfora establece una identificación figurada entre dos elementos (ojos y luceros) basados en una semejanza estética o de brillo[cite: 65]."
  },
  {
    "q": "18. ¿Cuál de los siguientes enunciados presenta un símil o comparación?",
    "opts": [
      "\"El silencio gritaba en la habitación\".",
      "\"La ciudad despertó entre sombras\".",
      "\"Sus cabellos eran hilos de oro\".",
      "\"Sus manos eran suaves como la seda\"."
    ],
    "correct": 3,
    "img": null,
    "exp": "El símil establece una relación de semejanza explícita empleando nexos comparativos como «como»[cite: 65]."
  },
  {
    "q": "19. Lee el siguiente verso:<br><br><em>\"El viento acariciaba las flores del jardín\".</em><br><br>¿Qué figura retórica se utiliza principalmente?",
    "opts": [
      "Antítesis.",
      "Personificación.",
      "Hipérbaton.",
      "Metonimia."
    ],
    "correct": 1,
    "img": null,
    "exp": "La personificación (o prosopopeya) atribuye acciones humanas (acariciar) a fenómenos de la naturaleza (el viento)[cite: 65, 66]."
  },
  {
    "q": "20. ¿Cuál de los siguientes versos contiene una hipérbole?",
    "opts": [
      "\"La luna se refleja sobre el lago\".",
      "\"El cielo parece una inmensa sábana\".",
      "\"Te he esperado durante mil eternidades\".",
      "\"Las hojas murmuran bajo la lluvia\"."
    ],
    "correct": 2,
    "img": null,
    "exp": "La hipérbole exagera desproporcionadamente una idea (mil eternidades) para intensificar su expresividad[cite: 66]."
  },
  {
    "q": "21. Lee el verso:<br><br><em>\"Del monte en la ladera,<br>por mi mano plantado tengo un huerto\".</em><br><br>¿Qué figura retórica altera el orden habitual de las palabras?",
    "opts": [
      "Hipérbaton.",
      "Anáfora.",
      "Aliteración.",
      "Epíteto."
    ],
    "correct": 0,
    "img": null,
    "exp": "El hipérbaton altera la sintaxis tradicional de la oración para otorgar musicalidad o énfasis estético[cite: 66]."
  },
  {
    "q": "22. Lee el verso:<br><br><em>\"En el silencio solo se escuchaba un susurro de suaves sonidos\".</em><br><br>¿Qué figura se manifiesta mediante la reiteración del sonido /s/?",
    "opts": [
      "Metonimia.",
      "Sinestesia.",
      "Antítesis.",
      "Aliteración."
    ],
    "correct": 3,
    "img": null,
    "exp": "La aliteración consiste en la repetición deliberada de fonemas afines (como el sonido /s/) para evocar sensaciones auditivas[cite: 66, 67]."
  },
  {
    "q": "23. ¿Cuál es el propósito principal del análisis contextual de un poema?",
    "opts": [
      "Determinar exclusivamente el número de sílabas de sus versos.",
      "Identificar únicamente las figuras retóricas presentes en el texto.",
      "Relacionar la obra con las circunstancias históricas, culturales y literarias de su producción.",
      "Clasificar los versos de acuerdo con su esquema de rima."
    ],
    "correct": 2,
    "img": null,
    "exp": "El análisis contextual vincula la creación poética con su época histórica, movimiento literario y entorno sociocultural[cite: 67]."
  },
  {
    "q": "24. Un poema del Romanticismo expresa inconformidad social y usa la naturaleza como reflejo emocional. ¿Qué aspecto permite comprender mejor su significado?",
    "opts": [
      "La identificación exclusiva de su esquema métrico.",
      "La relación entre sus temas y los ideales estéticos del Romanticismo.",
      "La clasificación de sus palabras según su acentuación.",
      "La distribución de sus versos dentro de las estrofas."
    ],
    "correct": 1,
    "img": null,
    "exp": "Comprender los ideales románticos (subjetividad, libertad, naturaleza expresiva) facilita la interpretación profunda del texto[cite: 67]."
  },
  {
    "q": "25. Lee el fragmento poético:<br><br><em>\"Mi tierra llora bajo el cielo oscuro... mas nace entre las sombras un futuro\".</em><br><br>¿Cuál procedimiento es más adecuado para un análisis integral (intratextual y contextual)?",
    "opts": [
      "Investigar exclusivamente la biografía del autor sin ver los recursos expresivos.",
      "Identificar solo rima y sílabas sin examinar significados.",
      "Interpretar solo a partir de emociones personales del lector.",
      "Analizar imágenes, recursos sonoros y temas, y relacionarlos con el contexto histórico y cultural."
    ],
    "correct": 3,
    "img": null,
    "exp": "Un análisis integral une la dimensión interna (métrica, figuras, imágenes) con las circunstancias contextuales de producción y trasfondo histórico[cite: 67, 68]."
  }
];

let currentIndex = 0, studentName = "", studentGroup = "", answers = new Array(questions.length).fill(null), finished = false;
const letters = ["A", "B", "C", "D"];

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("bannerImage").src = EXAM_BANNER;
  document.title = "Evaluación — " + EXAM_MATERIA;
  document.getElementById("examTitleHeading").textContent = "Examen de " + EXAM_MATERIA + " — Tema 1.5";
  document.getElementById("examDescription").innerHTML = "Evaluación de la materia de <strong>" + EXAM_MATERIA + "</strong> (Tema: <em>El texto poético</em>). Consta de <strong>" + questions.length + " reactivos</strong>.";
  document.getElementById("metaMateriaTema").textContent = EXAM_MATERIA + " · Tema 1.5";
  document.getElementById("headerMateriaTema").textContent = EXAM_MATERIA;
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });

function updateOnlineStatus() {
  const dot = document.getElementById('netDot'), text = document.getElementById('netText');
  if (navigator.onLine) { dot.className = 'status-dot'; text.textContent = 'Conectado'; } 
  else { dot.className = 'status-dot offline'; text.textContent = 'Sin conexión'; }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

function startExam() {
  const n = document.getElementById('studentNameInput'), g = document.getElementById('studentGroupInput');
  if (!n.value.trim() || !g.value.trim()) { alert("Por favor completa tu Nombre y Grupo."); return; }
  studentName = n.value.trim(); studentGroup = g.value.trim();
  document.getElementById('displayName').textContent = studentName;
  document.getElementById('displayGroup').textContent = studentGroup;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('examScreen').style.display = 'block';
  buildPalette(); renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('qCounter').textContent = "Reactivo " + (currentIndex + 1) + " de " + questions.length;
  document.getElementById('qText').innerHTML = q.q;
  const optWrap = document.getElementById('qOptions'); optWrap.innerHTML = '';
  q.opts.forEach((optText, i) => {
    const label = document.createElement('label');
    label.className = answers[currentIndex] === i ? 'selected' : '';
    label.innerHTML = '<input type="radio" name="opt" value="' + i + '" ' + (answers[currentIndex] === i ? 'checked' : '') + '><span><strong>' + letters[i] + ')</strong> ' + optText + '</span>';
    label.onclick = () => selectAnswer(i);
    optWrap.appendChild(label);
  });
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === questions.length - 1 ? 'Último reactivo' : 'Siguiente ▶';
  document.getElementById('progressBar').style.width = Math.round((answers.filter(a => a !== null).length / questions.length) * 100) + '%';
  refreshPalette();
  if (window.MathJax) MathJax.typesetPromise([document.getElementById('questionCard')]).catch(err => {});
}

function selectAnswer(i) { answers[currentIndex] = i; renderQuestion(); }
function goNext() { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
function goPrev() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }
function buildPalette() {
  const palette = document.getElementById('palette'); palette.innerHTML = '';
  questions.forEach((q, i) => {
    const btn = document.createElement('button'); btn.textContent = i + 1;
    btn.onclick = () => { currentIndex = i; renderQuestion(); };
    btn.id = 'pal-' + i; palette.appendChild(btn);
  });
}
function refreshPalette() {
  questions.forEach((_, i) => {
    const btn = document.getElementById('pal-' + i);
    if(btn) { btn.classList.toggle('answered', answers[i] !== null); btn.classList.toggle('current', i === currentIndex); }
  });
}
function confirmSubmit() {
  const unas = answers.filter(a => a === null).length;
  if (confirm(unas > 0 ? "Tienes " + unas + " sin responder. ¿Finalizar?" : "¿Estás seguro de enviar tu evaluación?")) finishExam();
}
function finishExam() {
  if (finished) return; finished = true;
  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  let totalCorrect = 0, reviewData = [];
  questions.forEach((q, i) => {
    const userAns = answers[i], isCorrect = userAns === q.correct;
    if (isCorrect) totalCorrect++;
    reviewData.push({ num: i + 1, text: q.q, opts: q.opts, correctIdx: q.correct, userIdx: userAns, isCorrect: isCorrect, exp: q.exp || "" });
  });
  const pct = ((totalCorrect / questions.length) * 100).toFixed(1);
  document.getElementById('resultDetails').innerHTML = "<strong>Materia:</strong> " + EXAM_MATERIA + "<br><strong>Tema:</strong> El texto poético<br><strong>Alumno:</strong> " + studentName + " | <strong>Grupo:</strong> " + studentGroup;
  document.getElementById('scoreBig').textContent = totalCorrect + "/" + questions.length + " (" + pct + "%)";
  document.getElementById('scoreBig').classList.toggle('fail', pct < 60);
  window._reviewData = reviewData; renderReview();
  sendDataToGoogleSheets({ fecha: new Date().toLocaleDateString(), materia: EXAM_MATERIA, tema: "El texto poético", nombre: studentName, grupo: studentGroup, puntajeGeneral: totalCorrect + "/" + questions.length + " (" + pct + "%)" });
}
function renderReview() {
  const list = document.getElementById('reviewList'); list.innerHTML = '';
  window._reviewData.forEach(r => {
    const div = document.createElement('div');
    let cls = r.userIdx === null ? 'blank' : (r.isCorrect ? 'correct' : 'incorrect');
    div.className = 'reviewItem ' + cls;
    const correctText = '<strong>' + letters[r.correctIdx] + ')</strong> ' + r.opts[r.correctIdx];
    const userText = r.userIdx !== null ? '<strong>' + letters[r.userIdx] + ')</strong> ' + r.opts[r.userIdx] : '';
    let answerLine = '';
    if (r.userIdx === null) answerLine = '<div class="yourAns">No respondida. Correcta: <span class="correctAns">' + correctText + '</span></div>';
    else if (r.isCorrect) answerLine = '<div class="yourAns">Tu respuesta: <span class="correctAns">' + userText + '</span> ✔</div>';
    else answerLine = '<div class="yourAns">Tu respuesta: <span class="wrongAns">' + userText + '</span> ✘ <br>Correcta: <span class="correctAns">' + correctText + '</span></div>';
    div.innerHTML = '<div class="tag">Reactivo ' + r.num + '</div><div style="font-weight:600; margin-top:4px;">' + r.text + '</div>' + answerLine + (r.exp ? '<div class="explanation-box"><strong>💡 Explicación:</strong> ' + r.exp + '</div>' : '');
    list.appendChild(div);
  });
  if (window.MathJax) MathJax.typesetPromise([list]).catch(err => {});
}
function toggleReview() {
  const list = document.getElementById('reviewList'), btn = document.getElementById('reviewToggleBtn'), show = list.style.display === 'none';
  list.style.display = show ? 'block' : 'none'; btn.textContent = show ? 'Ocultar revisión' : '🔍 Ver revisión detallada y explicaciones';
}
function sendDataToGoogleSheets(payload) {
  const syncEl = document.getElementById('syncStatus');
  syncEl.textContent = "Sincronizando con Google Sheets...";
  fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
  .then(() => { syncEl.className = "sync-status ok"; syncEl.textContent = "Calificación enviada con éxito"; })
  .catch(err => { syncEl.className = "sync-status err"; syncEl.textContent = "⚠️ Error al registrar: " + err.message; });
}
function openReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }
function submitReport() {
  const comment = document.getElementById('reportComment').value.trim();
  if (!comment) { alert("Escribe tu observación."); return; }
  const btn = document.getElementById('btnSendReport'); btn.disabled = true; btn.textContent = "Enviando...";
  fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ tipo: "reporte_error", fecha: new Date().toLocaleDateString(), examen: EXAM_MATERIA + " — El texto poético", nombre: studentName || "Anónimo", grupo: studentGroup || "Sin grupo", ubicacion: "Reactivo " + (currentIndex + 1), comentario: comment }) })
  .then(() => { alert("✅ Reporte enviado."); closeReportModal(); })
  .catch(err => { alert("⚠️ Error: " + err.message); })
  .finally(() => { btn.disabled = false; btn.textContent = "Enviar reporte"; });
}
</script>
</body>
</html>
