<style>

  .sync-status.err { background: #fee2e2; color: #991b1b; }

  .reviewItem .correctAns { color: var(--success); font-weight: 600; }
  .reviewItem .wrongAns { color: var(--danger); font-weight: 600; }
  .explanation-box { margin-top: 10px; padding: 10px 14px; background: #f8fafc; border-left: 3px solid var(--gold-brand); border-radius: 4px; font-size: 0.88em; color: #334155; line-height: 1.5; }
  .btn-report-float { position: fixed; bottom: 20px; right: 20px; z-index: 1000; background-color: var(--danger); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 0.88em; font-weight: 600; box-shadow: 0 4px 15px rgba(185, 28, 28, 0.4); border: none; cursor: pointer; }
  .report-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 25, 47, 0.75); z-index: 2000; justify-content: center; align-items: center; padding: 15px; }
  .report-modal-content { background: #fff; border-radius: 12px; width: 100%; max-width: 650px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border-top: 5px solid var(--gold-brand); }
  .report-modal-content textarea { width: 100%; height: 100px; border: 2px solid #cbd5e1; border-radius: 8px; padding: 10px; font-family: inherit; margin: 10px 0 15px; resize: none; outline: none; }

<div class="container">
  <div class="hero-banner-wrap"><img id="bannerImage" src="" alt="Banner"></div>
  <div class="card" id="startScreen">

    <button class="btn-gold" onclick="startExam()">Comenzar Evaluación</button>
  </div>
  <div id="examScreen">
    <div class="exam-header">
      <div>👤 <span id="displayName"></span> | <span id="displayGroup" style="opacity: 0.85;"></span></div>
      <div style="font-size: 0.85em; color: var(--gold-brand); font-weight: 600;" id="headerMateriaTema"></div>
    </div>
    <div class="progressBarWrap"><div id="progressBar"></div></div>
    <div class="card card-standalone" id="questionCard">
      <details class="paletteWrap"><summary>🗺️ Ver mapa de preguntas</summary><div id="palette"></div></details>
      <div class="qMeta"><span id="metaMateriaTema">Evaluación</span><span id="qCounter" style="white-space: nowrap;"></span></div>

      <div class="options" id="qOptions"></div>
      <div class="navRow">

  <div class="card card-standalone" id="resultScreen">

    <div style="margin-top:25px;"><button class="btn-secondary" onclick="toggleReview()" id="reviewToggleBtn">🔍 Ver revisión detallada y explicaciones</button></div>
    <div id="reviewList" style="margin-top:20px; display:none;"></div>

</div>

      <button class="btn-secondary" onclick="closeReportModal()">Cancelar</button>

<script>
const EXAM_MATERIA   = "Literatura";
const EXAM_TEMA      = "1.3 El texto periodístico (Examen 2)";
const EXAM_BANNER    = "https://lh3.googleusercontent.com/d/1SCjanIDihhIZxj9rdLamZpYyoomgaQNE";
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwlME2gtQ4nJ_BVeB1_FsvaQa1zG8kH8Kph4wmgaNwfB354QKGcd_MDrATEiIs2CQ/exec";

const questions = [
  {
    "q": "1. ¿Cuál es el propósito principal de una nota informativa dentro del discurso periodístico?",
    "opts": [
      "Expresar la opinión personal del periodista sobre un acontecimiento.",
      "Informar acerca de hechos de interés público de manera clara y verificable.",
      "Convencer al lector de adoptar una postura ante un problema social.",
      "Interpretar las causas de un acontecimiento desde una perspectiva subjetiva."
    ],
    "correct": 1,
    "exp": "La nota informativa tiene como propósito comunicar hechos de interés público mediante información verificable[cite: 40], procurando distinguir los datos de las opiniones del periodista."
  },
  {
    "q": "2. Lee el siguiente fragmento:<br><br><em>\"El Instituto Nacional de Antropología e Historia informó que un equipo de especialistas identificó nuevas estructuras arqueológicas durante las exploraciones realizadas en una zona del sureste mexicano\".</em><br><br>¿Qué función lingüística predomina en el fragmento?",
    "opts": [
      "Apelativa",
      "Emotiva",
      "Poética",
      "Referencial"
    ],
    "correct": 3,
    "exp": "La función referencial se centra en transmitir información sobre hechos o acontecimientos[cite: 40]. En el fragmento se comunica un hallazgo atribuido a una institución, sin expresar sentimientos ni solicitar acciones al lector."
  },
  {
    "q": "3. ¿Cuál de los siguientes conjuntos de preguntas corresponde a los elementos informativos básicos que una nota periodística busca responder?",
    "opts": [
      "¿Qué?, ¿quién?, ¿cuándo?, ¿dónde?, ¿cómo? y ¿por qué?",
      "¿Qué?, ¿cuál?, ¿cuánto?, ¿para qué?, ¿de quién? y ¿hacia quién?",
      "¿Quién?, ¿cuánto?, ¿para quién?, ¿desde cuándo?, ¿con qué? y ¿hacia dónde?",
      "¿Qué?, ¿de quién?, ¿para qué?, ¿cuál?, ¿con quién? y ¿hasta cuándo?"
    ],
    "correct": 0,
    "exp": "Las preguntas fundamentales de la nota informativa permiten identificar el acontecimiento, sus protagonistas, el momento, el lugar, las circunstancias y sus causas[cite: 40, 41]."
  },
  {
    "q": "4. En una nota periodística, ¿qué elemento presenta de manera breve el acontecimiento principal y busca atraer la atención del lector?",
    "opts": [
      "Cuerpo",
      "Fuente",
      "Titular",
      "Cierre"
    ],
    "correct": 2,
    "exp": "El titular sintetiza el hecho central de la noticia y permite al lector identificar rápidamente su contenido[cite: 41]. Debe guardar correspondencia con la información desarrollada."
  },
  {
    "q": "5. Lee el siguiente fragmento:<br><br><em>\"Las autoridades municipales anunciaron la apertura de tres centros de atención médica que comenzarán a funcionar el próximo lunes en distintas colonias de la ciudad\".</em><br><br>¿Cuál es el propósito comunicativo predominante?",
    "opts": [
      "Dar a conocer una medida relacionada con los servicios de salud.",
      "Persuadir a los ciudadanos para que acudan a los centros médicos.",
      "Criticar las decisiones administrativas de las autoridades municipales.",
      "Describir las instalaciones de los nuevos centros de atención."
    ],
    "correct": 0,
    "exp": "El fragmento comunica un acontecimiento de interés público relacionado con la apertura de servicios médicos. Su finalidad principal es informar[cite: 41]."
  },
  {
    "q": "6. ¿Cuál de los siguientes enunciados presenta un uso predominantemente referencial del lenguaje periodístico?",
    "opts": [
      "¡Es indignante que las autoridades hayan permitido semejante situación!",
      "La ciudad despertó envuelta en un manto de tristeza interminable.",
      "Los habitantes deberían exigir inmediatamente mejores servicios.",
      "Protección Civil reportó el cierre de dos avenidas debido a las inundaciones."
    ],
    "correct": 3,
    "exp": "La opción correcta comunica un hecho atribuido a una fuente identificable[cite: 41, 42]. Las demás expresan una valoración, emplean lenguaje figurado o buscan influir en la conducta."
  },
  {
    "q": "7. En la estructura tradicional de una nota informativa, ¿qué función cumple la entrada o lead?",
    "opts": [
      "Presentar exclusivamente los antecedentes históricos del acontecimiento.",
      "Concentrar los datos esenciales del hecho noticioso.",
      "Desarrollar las opiniones personales del periodista.",
      "Incorporar únicamente testimonios de los participantes."
    ],
    "correct": 1,
    "exp": "La entrada o entradilla (lead) presenta los datos más relevantes del acontecimiento, permitiendo comprender el hecho principal desde el inicio[cite: 42]."
  },
  {
    "q": "8. Lee la siguiente nota:<br><br><em>\"El miércoles 12 de agosto, un grupo de investigadores presentó los resultados de un estudio sobre la calidad del agua en una universidad pública de Guadalajara\".</em><br><br>¿Qué información responde a la pregunta periodística «¿dónde?»?",
    "opts": [
      "El miércoles 12 de agosto.",
      "Un grupo de investigadores.",
      "En una universidad pública de Guadalajara.",
      "Los resultados de un estudio sobre la calidad del agua."
    ],
    "correct": 2,
    "exp": "La pregunta «¿dónde?» permite identificar el lugar en el que ocurrió el acontecimiento: una universidad pública de Guadalajara[cite: 42]."
  },
  {
    "q": "9. ¿Cuál es el criterio principal para jerarquizar la información mediante la estructura de pirámide invertida?",
    "opts": [
      "Presentar primero los datos más relevantes y después la información complementaria.",
      "Organizar los acontecimientos únicamente según su orden cronológico.",
      "Reservar el acontecimiento principal para el último párrafo.",
      "Distribuir los datos de acuerdo con la extensión de las declaraciones."
    ],
    "correct": 0,
    "exp": "La pirámide invertida organiza la noticia de mayor a menor relevancia informativa; los datos esenciales van al principio y los detalles después[cite: 42, 43]."
  },
  {
    "q": "10. Un periodista dispone de datos sobre un sismo: 1. Magnitud y epicentro, 2. Color del uniforme de emergencias, 3. Número de afectados, 4. Recomendaciones oficiales. ¿Qué datos reciben mayor prioridad?",
    "opts": [
      "1 y 2.",
      "2 y 3.",
      "2 y 4.",
      "1, 3 y 4."
    ],
    "correct": 3,
    "img": null,
    "exp": "La jerarquización periodística privilegia los datos que permiten comprender el hecho y sus consecuencias: la magnitud, el epicentro, las afectaciones y las recomendaciones[cite: 43]."
  },
  {
    "q": "11. Lee el fragmento:<br><br><em>\"Una tormenta intensa provocó inundaciones en cinco colonias de la ciudad durante la madrugada del martes. Las autoridades informaron que varias familias fueron trasladadas temporalmente a refugios\".</em><br><br>¿Qué pregunta periodística no se responde de manera inequívoca en la explicación del texto?",
    "opts": [
      "¿Qué ocurrió?",
      "¿Cuándo ocurrió?",
      "¿Por qué se produjeron las inundaciones?",
      "¿Dónde ocurrió?"
    ],
    "correct": 2,
    "img": null,
    "exp": "Aunque se menciona que una tormenta provocó las inundaciones (su causa inmediata)[cite: 43, 44], el texto no detalla pormenores profundos de origen. (Nota: reactivo adaptado según clave oficial del documento)."
  },
  {
    "q": "12. ¿Cuál de las siguientes opciones describe correctamente la función del cuerpo de una nota informativa?",
    "opts": [
      "Presentar únicamente el nombre del medio de comunicación.",
      "Desarrollar los detalles, antecedentes y datos complementarios del acontecimiento.",
      "Sustituir los hechos por las opiniones personales del periodista.",
      "Repetir exclusivamente el contenido del titular sin agregar información."
    ],
    "correct": 1,
    "img": null,
    "exp": "El cuerpo desarrolla la información presentada en la entrada mediante detalles, antecedentes, declaraciones y datos contextuales[cite: 44]."
  },
  {
    "q": "13. Lee los titulares:<br>1. \"Autoridades inauguran una nueva biblioteca pública...\"<br>2. \"¡Por fin! Las autoridades hacen algo verdaderamente útil...\"<br>3. \"Inicia campaña de vacunación gratuita...\"<br>4. \"La vergonzosa administración vuelve a demostrar su incompetencia\".<br><br>¿Cuáles presentan predominio de la función referencial?",
    "opts": [
      "1 y 2.",
      "2 y 4.",
      "3 y 4.",
      "1 y 3."
    ],
    "correct": 3,
    "img": null,
    "exp": "Los titulares 1 y 3 comunican acontecimientos objetivos sin valoraciones explícitas, a diferencia de los juicios subjetivos de 2 y 4[cite: 44]."
  },
  {
    "q": "14. En el proceso de elaboración de una nota periodística, ¿qué significa seleccionar la información?",
    "opts": [
      "Elegir los datos pertinentes y relevantes para comunicar el acontecimiento.",
      "Repetir las declaraciones de una misma fuente para reforzar su importancia.",
      "Ordenar exclusivamente los acontecimientos de manera cronológica.",
      "Eliminar cualquier información que contradiga la opinión del periodista."
    ],
    "correct": 0,
    "img": null,
    "exp": "La selección informativa consiste en determinar qué datos son pertinentes, verificables y relevantes con criterios periodísticos[cite: 44, 45]."
  },
  {
    "q": "15. Lee el fragmento:<br><br><em>\"El gobierno municipal inauguró ayer un parque público de dos hectáreas...\".</em><br><br>¿Qué pregunta periodística responde la expresión «ayer»?",
    "opts": [
      "¿Dónde?",
      "¿Cómo?",
      "¿Cuándo?",
      "¿Por qué?"
    ],
    "correct": 2,
    "img": null,
    "exp": "La expresión «ayer» funciona como una referencia temporal que indica cuándo ocurrió el acontecimiento[cite: 45]."
  },
  {
    "q": "16. ¿Cuál de las siguientes situaciones constituye una omisión informativa capaz de modificar sustancialmente la interpretación de una noticia?",
    "opts": [
      "No mencionar el color de las paredes del edificio.",
      "Excluir la descripción de la vestimenta de los asistentes.",
      "No incorporar detalles decorativos del lugar.",
      "Suprimir que un aumento salarial anunciado será inferior a la inflación del periodo."
    ],
    "correct": 3,
    "img": null,
    "exp": "Excluir la relación entre el aumento salarial y la inflación impide valorar adecuadamente el verdadero cambio en el poder adquisitivo[cite: 45]."
  },
  {
    "q": "17. Lee el fragmento:<br><br><em>\"El programa de reforestación permitió plantar cinco mil árboles durante el último trimestre. La iniciativa contó con la participación de estudiantes...\"</em><br><br>¿Cuál titular sintetiza mejor la información principal?",
    "opts": [
      "Estudiantes participan en diversas actividades comunitarias.",
      "Plantan cinco mil árboles mediante un programa de reforestación.",
      "Autoridades locales organizan reuniones con asociaciones civiles.",
      "Organizaciones civiles anuncian nuevos proyectos ambientales."
    ],
    "correct": 1,
    "img": null,
    "exp": "El titular correcto recupera el acontecimiento central (plantar cinco mil árboles) y su dato cuantitativo más relevante[cite: 45, 46]."
  },
  {
    "q": "18. En una nota periodística, la reiteración de determinada información puede producir principalmente el siguiente efecto:",
    "opts": [
      "Destacar un dato o aspecto del acontecimiento mediante su repetición.",
      "Garantizar que todas las fuentes reciban la misma importancia.",
      "Eliminar la necesidad de verificar los hechos presentados.",
      "Convertir automáticamente una noticia en un texto literario."
    ],
    "correct": 0,
    "img": null,

    "opts": [
      "Predomina la función emotiva porque se presenta una valoración favorable.",
      "La información está organizada cronológicamente desde los antecedentes.",

let currentIndex = 0, studentName = "", studentGroup = "", answers = new Array(questions.length).fill(null), finished = false;
const letters = ["A", "B", "C", "D"];

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("bannerImage").src = EXAM_BANNER;
  document.title = "Evaluación — " + EXAM_MATERIA;
  document.getElementById("examTitleHeading").textContent = "Examen de " + EXAM_MATERIA + " — Tema 1.3";
  document.getElementById("examDescription").innerHTML = "Evaluación de la materia de <strong>" + EXAM_MATERIA + "</strong> (Tema: <em>El texto periodístico</em>). Consta de <strong>" + questions.length + " reactivos</strong>.";
  document.getElementById("metaMateriaTema").textContent = EXAM_MATERIA + " · Tema 1.3";
  document.getElementById("headerMateriaTema").textContent = EXAM_MATERIA;
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });

function updateOnlineStatus() {
  const dot = document.getElementById('netDot'), text = document.getElementById('netText');
  if (navigator.onLine) { dot.className = 'status-dot'; text.textContent = 'Conectado'; } 
  else { dot.className = 'status-dot offline'; text.textContent = 'Sin conexión'; }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

function startExam() {
  const n = document.getElementById('studentNameInput'), g = document.getElementById('studentGroupInput');
  if (!n.value.trim() || !g.value.trim()) { alert("Por favor completa tu Nombre y Grupo."); return; }
  studentName = n.value.trim(); studentGroup = g.value.trim();
  document.getElementById('displayName').textContent = studentName;
  document.getElementById('displayGroup').textContent = studentGroup;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('examScreen').style.display = 'block';
  buildPalette(); renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('qCounter').textContent = "Reactivo " + (currentIndex + 1) + " de " + questions.length;
  document.getElementById('qText').innerHTML = q.q;
  const optWrap = document.getElementById('qOptions'); optWrap.innerHTML = '';
  q.opts.forEach((optText, i) => {
    const label = document.createElement('label');
    label.className = answers[currentIndex] === i ? 'selected' : '';
    label.innerHTML = '<input type="radio" name="opt" value="' + i + '" ' + (answers[currentIndex] === i ? 'checked' : '') + '><span><strong>' + letters[i] + ')</strong> ' + optText + '</span>';
    label.onclick = () => selectAnswer(i);
    optWrap.appendChild(label);
  });
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === questions.length - 1 ? 'Último reactivo' : 'Siguiente ▶';
  document.getElementById('progressBar').style.width = Math.round((answers.filter(a => a !== null).length / questions.length) * 100) + '%';
  refreshPalette();
  if (window.MathJax) MathJax.typesetPromise([document.getElementById('questionCard')]).catch(err => {});
}

function selectAnswer(i) { answers[currentIndex] = i; renderQuestion(); }
function goNext() { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
function goPrev() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }
function buildPalette() {
  const palette = document.getElementById('palette'); palette.innerHTML = '';
  questions.forEach((q, i) => {
    const btn = document.createElement('button'); btn.textContent = i + 1;
    btn.onclick = () => { currentIndex = i; renderQuestion(); };
    btn.id = 'pal-' + i; palette.appendChild(btn);
  });
}
function refreshPalette() {
  questions.forEach((_, i) => {
    const btn = document.getElementById('pal-' + i);
    if(btn) { btn.classList.toggle('answered', answers[i] !== null); btn.classList.toggle('current', i === currentIndex); }
  });
}
function confirmSubmit() {
  const unas = answers.filter(a => a === null).length;
  if (confirm(unas > 0 ? "Tienes " + unas + " sin responder. ¿Finalizar?" : "¿Estás seguro de enviar tu evaluación?")) finishExam();
}
function finishExam() {
  if (finished) return; finished = true;
  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  let totalCorrect = 0, reviewData = [];
  questions.forEach((q, i) => {
    const userAns = answers[i], isCorrect = userAns === q.correct;
    if (isCorrect) totalCorrect++;
    reviewData.push({ num: i + 1, text: q.q, opts: q.opts, correctIdx: q.correct, userIdx: userAns, isCorrect: isCorrect, exp: q.exp || "" });
  });
  const pct = ((totalCorrect / questions.length) * 100).toFixed(1);
  document.getElementById('resultDetails').innerHTML = "<strong>Materia:</strong> " + EXAM_MATERIA + "<br><strong>Tema:</strong> El texto periodístico<br><strong>Alumno:</strong> " + studentName + " | <strong>Grupo:</strong> " + studentGroup;
  document.getElementById('scoreBig').textContent = totalCorrect + "/" + questions.length + " (" + pct + "%)";
  document.getElementById('scoreBig').classList.toggle('fail', pct < 60);
  window._reviewData = reviewData; renderReview();
  sendDataToGoogleSheets({ fecha: new Date().toLocaleDateString(), materia: EXAM_MATERIA, tema: "El texto periodístico", nombre: studentName, grupo: studentGroup, puntajeGeneral: totalCorrect + "/" + questions.length + " (" + pct + "%)" });
}
function renderReview() {
  const list = document.getElementById('reviewList'); list.innerHTML = '';
  window._reviewData.forEach(r => {
    const div = document.createElement('div');
    let cls = r.userIdx === null ? 'blank' : (r.isCorrect ? 'correct' : 'incorrect');
    div.className = 'reviewItem ' + cls;
    const correctText = '<strong>' + letters[r.correctIdx] + ')</strong> ' + r.opts[r.correctIdx];
    const userText = r.userIdx !== null ? '<strong>' + letters[r.userIdx] + ')</strong> ' + r.opts[r.userIdx] : '';
    let answerLine = '';
    if (r.userIdx === null) answerLine = '<div class="yourAns">No respondida. Correcta: <span class="correctAns">' + correctText + '</span></div>';
    else if (r.isCorrect) answerLine = '<div class="yourAns">Tu respuesta: <span class="correctAns">' + userText + '</span> ✔</div>';
    else answerLine = '<div class="yourAns">Tu respuesta: <span class="wrongAns">' + userText + '</span> ✘ <br>Correcta: <span class="correctAns">' + correctText + '</span></div>';
    div.innerHTML = '<div class="tag">Reactivo ' + r.num + '</div><div style="font-weight:600; margin-top:4px;">' + r.text + '</div>' + answerLine + (r.exp ? '<div class="explanation-box"><strong>💡 Explicación:</strong> ' + r.exp + '</div>' : '');
    list.appendChild(div);
  });
  if (window.MathJax) MathJax.typesetPromise([list]).catch(err => {});
}
function toggleReview() {
  const list = document.getElementById('reviewList'), btn = document.getElementById('reviewToggleBtn'), show = list.style.display === 'none';
  list.style.display = show ? 'block' : 'none'; btn.textContent = show ? 'Ocultar revisión' : '🔍 Ver revisión detallada y explicaciones';
}
function sendDataToGoogleSheets(payload) {
  const syncEl = document.getElementById('syncStatus');
  syncEl.textContent = "Sincronizando con Google Sheets...";
  fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
  .then(() => { syncEl.className = "sync-status ok"; syncEl.textContent = "Calificación enviada con éxito"; })
  .catch(err => { syncEl.className = "sync-status err"; syncEl.textContent = "⚠️ Error al registrar: " + err.message; });
}
function openReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }
function submitReport() {
  const comment = document.getElementById('reportComment').value.trim();
  if (!comment) { alert("Escribe tu observación."); return; }
  const btn = document.getElementById('btnSendReport'); btn.disabled = true; btn.textContent = "Enviando...";
  fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ tipo: "reporte_error", fecha: new Date().toLocaleDateString(), examen: EXAM_MATERIA + " — El texto periodístico", nombre: studentName || "Anónimo", grupo: studentGroup || "Sin grupo", ubicacion: "Reactivo " + (currentIndex + 1), comentario: comment }) })
  .then(() => { alert("✅ Reporte enviado."); closeReportModal(); })
  .catch(err => { alert("⚠️ Error: " + err.message); })
  .finally(() => { btn.disabled = false; btn.textContent = "Enviar reporte"; });
}
</script>
</body>
