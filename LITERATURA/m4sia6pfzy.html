<div class="network-status" id="netStatus"><div class="status-dot" id="netDot"></div><span id="netText">Conectado</span></div>

  <div id="examScreen">
    <div class="exam-header">

    </div>
    <div class="progressBarWrap"><div id="progressBar"></div></div>

      <div class="qMeta"><span id="metaMateriaTema">Evaluación</span><span id="qCounter" style="white-space: nowrap;"></span></div>
      <div class="qText" id="qText"></div>

      <div class="navRow">

    </div>

    <div id="syncStatus" class="sync-status">Guardando resultados en Google Sheets...</div>
    <div style="margin-top:25px;"><button class="btn-secondary" onclick="toggleReview()" id="reviewToggleBtn">🔍 Ver revisión detallada y explicaciones</button></div>
    <div id="reviewList" style="margin-top:20px; display:none;"></div>
  </div>
</div>

<div class="report-modal" id="reportModal">

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeReportModal()">Cancelar</button>

</div>

const questions = [
  {

    "opts": [
      "La expresión de emociones mediante la voz de un hablante lírico.",
      "La representación de conflictos mediante diálogos escénicos.",

      "La exposición de argumentos para defender una postura."

    "correct": 2,
    "img": null,
    "exp": "El género épico o narrativo se caracteriza por presentar acontecimientos reales o ficticios mediante una voz narrativa, incluyendo personajes, acciones, tiempo y espacio[cite: 69]."
  },
  {
    "q": "2. ¿Qué característica corresponde principalmente al género lírico?",
    "opts": [
      "La expresión de sentimientos, emociones o reflexiones mediante una voz poética.",
      "La presentación de acontecimientos mediante un narrador omnisciente.",
      "El desarrollo de conflictos a través de diálogos entre personajes.",
      "La descripción objetiva de sucesos históricos documentados."
    ],
    "correct": 0,
    "img": null,
    "exp": "El género lírico se caracteriza por la expresión subjetiva de emociones, sentimientos y pensamientos a través de una voz poética[cite: 69]."
  },
  {
    "q": "3. ¿Cuál es la característica fundamental del género dramático?",
    "opts": [
      "La narración de acontecimientos mediante un narrador externo.",
      "La expresión de sentimientos mediante una voz poética.",
      "La presentación de hechos mediante descripciones documentales.",
      "La representación de una acción conflictiva mediante personajes y diálogos."
    ],
    "correct": 3,
    "img": null,
    "exp": "El género dramático presenta acciones y conflictos desarrollados por personajes mediante diálogos y actuaciones para su representación escénica[cite: 69]."
  },
  {
    "q": "4. ¿Cuál de las siguientes opciones contiene exclusivamente subgéneros tradicionalmente asociados con el género épico o narrativo?",
    "opts": [
      "Elegía, oda, himno y égloga.",
      "Epopeya, cantar de gesta, cuento y novela.",
      "Tragedia, comedia, drama y entremés.",
      "Soneto, romance lírico, canción y madrigal."
    ],
    "correct": 1,
    "img": null,
    "exp": "Epopeya, cantar de gesta, cuento y novela son formas del género épico o narrativo[cite: 70]."
  },
  {
    "q": "5. ¿Qué subgénero épico se caracteriza por narrar extensamente las hazañas de héroes vinculados con el origen, la identidad o los valores de un pueblo?",

      "Fábula.",
      "Leyenda.",
      "Epopeya.",
      "Cuento."
    ],
    "correct": 2,
    "img": null,
    "exp": "La epopeya es una narración extensa, generalmente en verso, que relata acontecimientos heroicos de importancia colectiva con elementos mitológicos o históricos[cite: 70]."
  },
  {
    "q": "6. ¿Cuál es una característica distintiva del cantar de gesta medieval?",
    "opts": [
      "Relata las hazañas de un héroe asociado con valores e ideales colectivos.",

    "correct": 0,

  {
    "q": "7. ¿Cuál de las siguientes características corresponde a la novela?",

      "Presenta necesariamente animales que representan defectos humanos.",

  {
    "q": "8. ¿Qué característica distingue generalmente al cuento frente a la novela?",

  {
    "q": "12. ¿Cuál de las siguientes opciones contiene exclusivamente subgéneros tradicionalmente asociados con el género lírico?",

      "Oda, elegía, égloga e himno.",

    "correct": 2,
    "img": null,

  {
    "q": "13. ¿Qué subgénero lírico se caracteriza por expresar sentimientos de dolor o lamentación ante una pérdida, especialmente la muerte de una persona?",

      "Elegía.",
      "Égloga.",
      "Himno.",
      "Sátira."
    ],
    "correct": 0,
    "img": null,
    "exp": "La elegía es una composición lírica de tono lamentativo que expresa dolor o tristeza ante una pérdida[cite: 72, 73]."
  },
  {
    "q": "14. ¿Cuál es una característica general de la oda?",

    "correct": 3,
    "img": null,
    "exp": "La oda expresa admiración, alabanza o reflexión solemne sobre diversos temas, personas, objetos o ideas[cite: 73]."

  {
    "q": "15. Lee el fragmento:<br><br><em>\"Dos pastores conversan sobre sus penas amorosas mientras descansan junto a un río, rodeados de árboles y praderas\".</em><br><br>¿Con qué subgénero lírico se relaciona?",

      "Himno.",

      "Epigrama."
    ],
    "correct": 2,
    "img": null,
    "exp": "La égloga es una composición poética de ambiente pastoril que presenta diálogos o monólogos sobre temas amorosos en una naturaleza idealizada[cite: 73]."

let currentIndex = 0, studentName = "", studentGroup = "", answers = new Array(questions.length).fill(null), finished = false;
const letters = ["A", "B", "C", "D"];

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("bannerImage").src = EXAM_BANNER;
  document.title = "Evaluación — " + EXAM_MATERIA;
  document.getElementById("examTitleHeading").textContent = "Examen de " + EXAM_MATERIA + " — Tema 2.1";
  document.getElementById("examDescription").innerHTML = "Evaluación de la materia de <strong>" + EXAM_MATERIA + "</strong> (Tema: <em>Géneros literarios</em>). Consta de <strong>" + questions.length + " reactivos</strong>.";
  document.getElementById("metaMateriaTema").textContent = EXAM_MATERIA + " · Tema 2.1";
  document.getElementById("headerMateriaTema").textContent = EXAM_MATERIA;
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });

function updateOnlineStatus() {
  const dot = document.getElementById('netDot'), text = document.getElementById('netText');
  if (navigator.onLine) { dot.className = 'status-dot'; text.textContent = 'Conectado'; } 
  else { dot.className = 'status-dot offline'; text.textContent = 'Sin conexión'; }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

function startExam() {
  const n = document.getElementById('studentNameInput'), g = document.getElementById('studentGroupInput');
  if (!n.value.trim() || !g.value.trim()) { alert("Por favor completa tu Nombre y Grupo."); return; }
  studentName = n.value.trim(); studentGroup = g.value.trim();
  document.getElementById('displayName').textContent = studentName;
  document.getElementById('displayGroup').textContent = studentGroup;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('examScreen').style.display = 'block';
  buildPalette(); renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('qCounter').textContent = "Reactivo " + (currentIndex + 1) + " de " + questions.length;
  document.getElementById('qText').innerHTML = q.q;
  const optWrap = document.getElementById('qOptions'); optWrap.innerHTML = '';
  q.opts.forEach((optText, i) => {
    const label = document.createElement('label');
    label.className = answers[currentIndex] === i ? 'selected' : '';
    label.innerHTML = '<input type="radio" name="opt" value="' + i + '" ' + (answers[currentIndex] === i ? 'checked' : '') + '><span><strong>' + letters[i] + ')</strong> ' + optText + '</span>';
    label.onclick = () => selectAnswer(i);
    optWrap.appendChild(label);
  });
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === questions.length - 1 ? 'Último reactivo' : 'Siguiente ▶';
  document.getElementById('progressBar').style.width = Math.round((answers.filter(a => a !== null).length / questions.length) * 100) + '%';
  refreshPalette();
  if (window.MathJax) MathJax.typesetPromise([document.getElementById('questionCard')]).catch(err => {});
}

function selectAnswer(i) { answers[currentIndex] = i; renderQuestion(); }
function goNext() { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
function goPrev() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }
function buildPalette() {
  const palette = document.getElementById('palette'); palette.innerHTML = '';
  questions.forEach((q, i) => {
    const btn = document.createElement('button'); btn.textContent = i + 1;
    btn.onclick = () => { currentIndex = i; renderQuestion(); };
    btn.id = 'pal-' + i; palette.appendChild(btn);
  });
}
function refreshPalette() {
  questions.forEach((_, i) => {
    const btn = document.getElementById('pal-' + i);
    if(btn) { btn.classList.toggle('answered', answers[i] !== null); btn.classList.toggle('current', i === currentIndex); }
  });
}
function confirmSubmit() {
  const unas = answers.filter(a => a === null).length;
  if (confirm(unas > 0 ? "Tienes " + unas + " sin responder. ¿Finalizar?" : "¿Estás seguro de enviar tu evaluación?")) finishExam();
}
function finishExam() {
  if (finished) return; finished = true;
  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  let totalCorrect = 0, reviewData = [];
  questions.forEach((q, i) => {
    const userAns = answers[i], isCorrect = userAns === q.correct;
    if (isCorrect) totalCorrect++;
    reviewData.push({ num: i + 1, text: q.q, opts: q.opts, correctIdx: q.correct, userIdx: userAns, isCorrect: isCorrect, exp: q.exp || "" });
  });
  const pct = ((totalCorrect / questions.length) * 100).toFixed(1);
  document.getElementById('resultDetails').innerHTML = "<strong>Materia:</strong> " + EXAM_MATERIA + "<br><strong>Tema:</strong> Géneros literarios (Épico, lírico y dramático)<br><strong>Alumno:</strong> " + studentName + " | <strong>Grupo:</strong> " + studentGroup;
  document.getElementById('scoreBig').textContent = totalCorrect + "/" + questions.length + " (" + pct + "%)";
  document.getElementById('scoreBig').classList.toggle('fail', pct < 60);
  window._reviewData = reviewData; renderReview();
  sendDataToGoogleSheets({ fecha: new Date().toLocaleDateString(), materia: EXAM_MATERIA, tema: "Géneros literarios", nombre: studentName, grupo: studentGroup, puntajeGeneral: totalCorrect + "/" + questions.length + " (" + pct + "%)" });
}
function renderReview() {
  const list = document.getElementById('reviewList'); list.innerHTML = '';
  window._reviewData.forEach(r => {
    const div = document.createElement('div');
    let cls = r.userIdx === null ? 'blank' : (r.isCorrect ? 'correct' : 'incorrect');
    div.className = 'reviewItem ' + cls;
    const correctText = '<strong>' + letters[r.correctIdx] + ')</strong> ' + r.opts[r.correctIdx];
    const userText = r.userIdx !== null ? '<strong>' + letters[r.userIdx] + ')</strong> ' + r.opts[r.userIdx] : '';
    let answerLine = '';
    if (r.userIdx === null) answerLine = '<div class="yourAns">No respondida. Correcta: <span class="correctAns">' + correctText + '</span></div>';
    else if (r.isCorrect) answerLine = '<div class="yourAns">Tu respuesta: <span class="correctAns">' + userText + '</span> ✔</div>';
    else answerLine = '<div class="yourAns">Tu respuesta: <span class="wrongAns">' + userText + '</span> ✘ <br>Correcta: <span class="correctAns">' + correctText + '</span></div>';
    div.innerHTML = '<div class="tag">Reactivo ' + r.num + '</div><div style="font-weight:600; margin-top:4px;">' + r.text + '</div>' + answerLine + (r.exp ? '<div class="explanation-box"><strong>💡 Explicación:</strong> ' + r.exp + '</div>' : '');
    list.appendChild(div);
  });
  if (window.MathJax) MathJax.typesetPromise([list]).catch(err => {});
}
function toggleReview() {
  const list = document.getElementById('reviewList'), btn = document.getElementById('reviewToggleBtn'), show = list.style.display === 'none';
  list.style.display = show ? 'block' : 'none'; btn.textContent = show ? 'Ocultar revisión' : '🔍 Ver revisión detallada y explicaciones';
}
function sendDataToGoogleSheets(payload) {
  const syncEl = document.getElementById('syncStatus');
  syncEl.textContent = "Sincronizando con Google Sheets...";
  fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
  .then(() => { syncEl.className = "sync-status ok"; syncEl.textContent = "Calificación enviada con éxito"; })
  .catch(err => { syncEl.className = "sync-status err"; syncEl.textContent = "⚠️ Error al registrar: " + err.message; });
}
function openReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }
function submitReport() {
  const comment = document.getElementById('reportComment').value.trim();
  if (!comment) { alert("Escribe tu observación."); return; }
  const btn = document.getElementById('btnSendReport'); btn.disabled = true; btn.textContent = "Enviando...";
  fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ tipo: "reporte_error", fecha: new Date().toLocaleDateString(), examen: EXAM_MATERIA + " — Géneros literarios", nombre: studentName || "Anónimo", grupo: studentGroup || "Sin grupo", ubicacion: "Reactivo " + (currentIndex + 1), comentario: comment }) })
  .then(() => { alert("✅ Reporte enviado."); closeReportModal(); })
  .catch(err => { alert("⚠️ Error: " + err.message); })
  .finally(() => { btn.disabled = false; btn.textContent = "Enviar reporte"; });
}
</script>
